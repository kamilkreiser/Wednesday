# =============================================================================
# SECUURA LOCAL GATEWAY - DEMO MODE NGINX REVERSE PROXY
# =============================================================================
# APPLIED-WHERE (KS-121): MOUNTED by docker-compose as /etc/nginx/conf.d/default.conf
# for local/demo — THIS is the conf actually in effect locally (it overrides the
# baked nginx.conf). Edit this for local gateway changes, then:
#   docker exec secuura-nginx-gateway nginx -s reload   (restart if reload doesn't apply)
# See docs/local-dev-build.md → "nginx-gateway conf strategy".
#
# Demo branch override of nginx.conf. Adds:
#   - sub_filter injection of demo-overlay.js into all HTML responses
#   - demo-service upstream and proxy routing at /demo-api/
#   - Static serving of demo-overlay bundle at /demo-overlay/
#   - Accept-Encoding fix so sub_filter can operate on proxied HTML
#
# Routing:
#   /              -> Issuer Frontend  (issuer-frontend:80)
#   /verify/       -> Verifier Frontend (verifier-frontend:80)
#   /admin/        -> Admin Frontend   (admin-frontend:80)
#   /status/       -> Status Page      (status-frontend:80)
#   /website/      -> Marketing/Tokenomics Website (website-frontend:80)
#   /api/          -> API Gateway      (api-gateway:8080)
#   /originate/    -> CLOSED, returns 404 (KS-1041) — was Originate Service (originate:4000)
#   /analytics/    -> Analytics Service (analytics:4010)
#   /demo-api/     -> Demo Service     (demo-service:4030)
#   /demo-overlay/ -> Static overlay bundle
#   /health        -> Gateway health aggregation
# =============================================================================

# KS-20: static `upstream { server host:port }` blocks resolved each
# upstream IP once at nginx boot and cached it forever — so a restarted
# upstream container (new IP) caused permanent 502s until a manual nginx
# restart, and nginx refused to start at all if any upstream wasn't yet
# DNS-resolvable. Replaced with per-request resolution: `set $svc_X
# "host:port"` + a variable `proxy_pass http://$svc_X` and a short-TTL
# `resolver` (below), mirroring nginx.conf. 127.0.0.11 is Docker's
# embedded DNS server.

# =============================================================================
# KS-529 — nginx → api-gateway connection pooling (the 502-under-load fix)
# =============================================================================
# PR #608 fixed the hop BELOW this one (api-gateway → services) with a pooled
# keep-alive http.Agent. This is the same defect one layer up: nginx opened a
# fresh TCP connection to the gateway for EVERY proxied request, so under sweep
# concurrency it exhausted sockets/ephemeral ports and served its own
# `/_gw_err_502` page for upstreams that were perfectly healthy — verified: the
# affected services had 0 restarts and answered correctly when probed singly.
#
# Two changes were required and EITHER ALONE IS USELESS:
#   1. this pool — `keepalive` is an `upstream`-block directive, so pooling is
#      impossible with the variable-`proxy_pass` form the other services use;
#   2. `Connection: ""` on ordinary requests — see the $connection_upgrade map
#      near the bottom of this file, which sent `Connection: close` and would
#      have torn down every pooled connection after a single response.
#
# Why this does NOT reintroduce the DNS staleness the variable form was adopted
# to fix: `resolve` (with its required `zone`) makes nginx re-resolve the server
# name in the background on the resolver TTL, so a recreated container on a new
# IP is picked up without a reload. `resolve` is open-source since nginx 1.27.3;
# this image is 1.30.4 — checked with `nginx -t` before adopting. The
# http-level resolver here is what `resolve` consumes; the one inside the
# server block serves the variable-`proxy_pass` locations and stays.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_gateway_pool {
    zone api_gateway_pool 64k;
    server api-gateway:8080 resolve;

    # Sized for sweep concurrency; idle connections are cheap. keepalive_requests
    # is high so a long run does not churn through pool recycles.
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# =============================================================================
# KS-618 — recover the REAL client IP before anything keys on it
# =============================================================================
# The demo edge is Caddy -> this nginx -> api-gateway, i.e. TWO proxy hops.
# With no realip module configured, `$remote_addr` here was the Docker bridge
# gateway for EVERY external request — measured on the live VM: 100% of nginx
# access-log lines showed 172.18.0.1, and 3616 of 3616 api-gateway security
# events logged "ip":"172.18.0.1". So brute-force counters, account lockout,
# suspicious-request detection and the CSRF fingerprint were all keying on one
# constant for the entire internet.
#
# Trust is deliberately scoped to SINGLE HOST addresses — the immediate proxy
# hop only — not to a subnet. Trusting 172.18.0.0/16 would let any container on
# the compose network forge X-Forwarded-For and choose its own rate-limit
# bucket, which is a worse defect than the one being fixed.
#
# The hop address DIFFERS BY ENVIRONMENT (this is why a subnet felt tempting):
#   demo VM   -> 172.18.0.1   (compose bridge gw; Caddy runs on the host)
#   local     -> 192.168.65.1 (Docker Desktop's host gw on macOS)
#   local alt -> 172.25.0.1 / 172.17.0.1 (compose bridge gw / default bridge)
# VERIFY ON DEPLOY: if the compose network is recreated with a different
# subnet, the matching line below must be updated. The access log now carries
# the resolved address (log_format below), so a mismatch is visible in one
# `docker compose logs nginx-gateway` rather than silently disabling the fix.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.17.0.1;
set_real_ip_from 172.18.0.1;
set_real_ip_from 172.25.0.1;
set_real_ip_from 192.168.65.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Log the resolved client so "is realip working?" is answerable from evidence.
# $remote_addr is post-realip; $http_x_forwarded_for is the raw chain.
log_format secuura_edge '$remote_addr - - [$time_local] "$request" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent" '
                        'xff="$http_x_forwarded_for" scope=$secuura_limit_scope';

# Readable companion to $secuura_limit_key (which is binary and would render as
# escape sequences in the log). "edge" = arrived via Caddy and IS rate limited;
# "direct" = local/in-cluster and is not. Grep for scope=edge to confirm the
# limiter is engaged on real traffic.
map $http_x_forwarded_for $secuura_limit_scope {
    ""      "direct";
    default "edge";
}

# =============================================================================
# KS-613 — edge rate limiting, keyed on the resolved client
# =============================================================================
# WHY NOT AN RFC1918 WHITELIST (the obvious approach, and it fails open):
# the exemption we need is "our own test suites and local dev are not rate
# limited". The tempting implementation is a `geo` whitelist over private
# ranges. It is WRONG here, because the demo's Caddy hop (172.18.0.1) is
# ITSELF inside 172.16.0.0/12 — so if realip above ever stops resolving, every
# external request presents a private address, matches the whitelist, and the
# limiter goes silently inert while still reading as configured protection.
#
# Instead the gate is the PRESENCE OF A FORWARDED CHAIN. Only the public edge
# (Caddy) sets X-Forwarded-For; direct hits — local dev, the Schemathesis /
# Akto / k6 suites against :6882, in-cluster calls — have none.
#   - no XFF  -> empty key -> nginx applies no limit (documented behaviour of
#                limit_req/limit_conn: an empty key is skipped entirely)
#   - XFF set -> key on $binary_remote_addr, which realip has already rewritten
#                to the true client
#
# Its failure mode is the right way round: if realip breaks, requests still
# carry XFF, so they are still limited — collapsed into one bucket rather than
# silently unlimited. Degraded and noticeable beats inert and invisible. The
# rates below are set so that even that degenerate single-bucket case sits
# above normal aggregate demo traffic (~25 r/s), so a realip regression
# throttles a scan rather than taking the demo down.
map $http_x_forwarded_for $secuura_limit_key {
    ""      "";
    default $binary_remote_addr;
}

# Auth paths get their own, much tighter zone WITHOUT duplicating the /api/
# location block: the key is empty for every non-auth URI, so the auth zone
# simply does not engage there. Duplicating the location to attach a second
# zone would fork the proxy config and drift.
map $request_uri $secuura_auth_limit_key {
    default            "";
    "~^/api/auth/"     $secuura_limit_key;
    "~^/api/v1/auth/"  $secuura_limit_key;
}

# Rates chosen against MEASURED traffic on the live demo (2026-08-13), not by
# copying nginx-production.conf's 10r/s — which was written for the deleted
# Container Apps path and never ran anywhere:
#   Platform S integration  52.74.18.212  ~25 r/s in steady bursts  (legitimate)
#   secrets scanner        195.178.110.199 ~80 r/s for 8s           (hostile)
# 50 r/s + burst 100 leaves S comfortable headroom while cutting a sustained
# scan down; auth at 5 r/s + burst 10 is the credential-stuffing bound.
limit_req_zone  $secuura_limit_key      zone=secuura_api:10m  rate=50r/s;
limit_req_zone  $secuura_auth_limit_key zone=secuura_auth:10m rate=5r/s;
limit_conn_zone $secuura_limit_key      zone=secuura_conn:10m;

# 429 is the correct semantic; nginx's default for both is 503, which is a lie
# about whose fault it is and tells a client to retry rather than back off.
limit_req_status  429;
limit_conn_status 429;


server {
    listen 80;
    server_name localhost;

    # KS-308: emit RELATIVE redirects (Location: /api/) instead of absolute ones.
    # nginx's auto-append-slash 301 (e.g. /api -> /api/) otherwise builds an
    # absolute URL from the internal listen port (80), stripping the host-side
    # port (6882 locally) — so a client following the redirect lands on :80 and
    # the connection fails. Relative Location lets the client preserve scheme +
    # host + port. Harmless behind any proxy/port; standard reverse-proxy hygiene.
    absolute_redirect off;

    # KS-316: hide the nginx version in the Server header + error pages
    # (was leaking `Server: nginx/1.27.5` — Akto SERVER_VERSION_DISCLOSED LOW).
    # The other gateway/frontend confs already set this; nginx-demo.conf was the gap.
    server_tokens off;

    access_log /var/log/nginx/access.log secuura_edge;

    # =========================================================================
    # KS-613 — body cap + slow-request timeouts (Review F, F-2/F-7)
    # =========================================================================
    # Sized against what the app tier actually accepts, not a round number:
    # api-gateway parses at 1mb by default and mounts a 10mb parser on
    # /api/documents/upload and /api/nft/upload (services/api-gateway/src/index.ts
    # :400-406). 12m gives headroom over the largest gateway-enforced limit so
    # nginx rejects only what express would reject anyway.
    #
    # KNOWN CAVEAT, recorded rather than assumed away: services/nft-certificate
    # declares express.json({ limit: '50mb' }). If any nft route legitimately
    # carries a body above 12m THROUGH this gateway, it will now 413 at the
    # edge. Not proven either way — confirming it needs a write against the
    # demo, and the deploy hold is on. If such a route surfaces, raise this
    # value deliberately rather than removing the cap.
    client_max_body_size 12m;

    # Slow-loris bound. The 408 JSON error page already existed below and was
    # unreachable until these were set.
    client_body_timeout   15s;
    client_header_timeout 15s;

    # Per-client concurrent connections. Empty key (no XFF) is skipped, so
    # local dev and the test suites are unaffected.
    limit_conn secuura_conn 50;

    # Aggregate ceiling for every location that does not set its own; /api/
    # redefines both zones below (a limit_req at a deeper level replaces the
    # inherited one rather than adding to it).
    limit_req zone=secuura_api burst=100 nodelay;

    # =========================================================================
    # KS-613 — security headers emitted BY THE GATEWAY
    # =========================================================================
    # Review F, F-8. These are served today by downstream helmet/frontend nginx,
    # which is why a curl against the live site reads "already hardened" — the
    # guarantee is one dropped helmet away. proxy_hide_header + add_header means
    # exactly ONE copy reaches the client (duplicating a header is not neutral:
    # two X-Frame-Options are ambiguous and two CSPs are enforced as their
    # intersection), and the value survives a service that stops sending it.
    #
    # CSP is DELIBERATELY NOT SET HERE. It is app-specific — issuer, admin and
    # verifier each ship their own — and a single generic policy at the gateway
    # would either be too loose to be worth having or would break a portal.
    # Owning it here would also silently override a tighter downstream policy.
    # That stays with the apps; tracked as its own decision, not smuggled in.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Frame-Options           "DENY"                                  always;
    add_header X-Content-Type-Options    "nosniff"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # TLS is terminated upstream by Caddy; this header is forwarded to the
    # client over that TLS connection, so it is meaningful despite this hop
    # being plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;

    # Docker-embedded DNS, short cache so a restarted upstream is picked up
    # within 10s. ipv6=off — Docker compose default networks don't issue
    # AAAA records and nginx would log a failed v6 lookup per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================================
    # Observability: nginx live stats for the Prometheus nginx-exporter
    # =========================================================================
    # Feeds the "Secuura · Infrastructure · Engineering → Nginx" panels
    # (request rate, active connections). Restricted to loopback + private
    # Docker ranges so the gateway never serves stub_status to public clients;
    # the exporter reaches it in-network at http://secuura-nginx-gateway/stub_status.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # =========================================================================
    # KS-367: JSON bodies for nginx-GENERATED errors
    # =========================================================================
    # Errors nginx produces itself (URIs with NUL/control bytes, oversized
    # bodies/headers, dead upstreams, timeouts) returned nginx's stock HTML
    # page, which does not conform to the API's documented application/json
    # content type (Schemathesis content_type_conformance, KS-367). Serve a
    # minimal JSON envelope mirroring the api-gateway's error shape instead.
    # Upstream responses pass through untouched — proxy_intercept_errors
    # stays off, so these only fire for errors originating at this layer.
    error_page 400 /_gw_err_400;
    error_page 405 /_gw_err_405;
    error_page 408 /_gw_err_408;
    error_page 413 /_gw_err_413;
    error_page 414 /_gw_err_414;
    error_page 431 /_gw_err_431;
    error_page 429 /_gw_err_429;
    error_page 500 /_gw_err_500;
    error_page 502 /_gw_err_502;
    error_page 503 /_gw_err_503;
    error_page 504 /_gw_err_504;
    location = /_gw_err_400 { internal; default_type application/json; return 400 '{"success":false,"error":{"code":"BAD_REQUEST","message":"The gateway could not parse this request."}}'; }
    # RFC 9110 §15.5.6: a 405 must carry an Allow header. nginx rejects methods it
    # doesn't implement (e.g. TRACE) with a bare 405 before routing (KS-404).
    location = /_gw_err_405 { internal; default_type application/json; add_header Allow "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always; return 405 '{"success":false,"error":{"code":"METHOD_NOT_ALLOWED","message":"This HTTP method is not supported."}}'; }
    location = /_gw_err_408 { internal; default_type application/json; return 408 '{"success":false,"error":{"code":"REQUEST_TIMEOUT","message":"The request timed out at the gateway."}}'; }
    location = /_gw_err_413 { internal; default_type application/json; return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request body exceeds the gateway limit."}}'; }
    location = /_gw_err_414 { internal; default_type application/json; return 414 '{"success":false,"error":{"code":"URI_TOO_LONG","message":"The request URI exceeds the gateway limit."}}'; }
    location = /_gw_err_431 { internal; default_type application/json; return 431 '{"success":false,"error":{"code":"HEADERS_TOO_LARGE","message":"The request headers exceed the gateway limit."}}'; }
    location = /_gw_err_429 { internal; default_type application/json; add_header Retry-After "1" always; return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down and retry."}}'; }
    location = /_gw_err_500 { internal; default_type application/json; return 500 '{"success":false,"error":{"code":"INTERNAL_ERROR","message":"The gateway encountered an internal error."}}'; }
    location = /_gw_err_502 { internal; default_type application/json; return 502 '{"success":false,"error":{"code":"BAD_GATEWAY","message":"The upstream service is not reachable right now."}}'; }
    location = /_gw_err_503 { internal; default_type application/json; return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable."}}'; }
    location = /_gw_err_504 { internal; default_type application/json; return 504 '{"success":false,"error":{"code":"GATEWAY_TIMEOUT","message":"The upstream service did not respond in time."}}'; }

    # CRITICAL: Tell upstreams to send uncompressed responses
    # so sub_filter can operate on the HTML body
    proxy_set_header Accept-Encoding "";

    # Re-compress for the client after sub_filter has operated
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 256;

    # Increase proxy timeouts for development
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for HMR in development)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Security headers — KS-154: X-Frame-Options / X-Content-Type-Options /
    # X-XSS-Protection / Referrer-Policy are emitted by api-gateway (helmet +
    # manual middleware) and by each downstream Node service via helmet.
    # Re-adding here caused duplicates like `X-Content-Type-Options: nosniff,
    # nosniff`. CSP stays on nginx for the non-local profiles — helmet's CSP
    # is disabled by design (pen-test L9/H12).

    # =========================================================================
    # DEMO OVERLAY — DISABLED ON LOCAL (F-09, 2026-05-15)
    # =========================================================================
    # The demo overlay was a presenter-mode UI for sales demos. Its
    # persona-switch backend (demo-service /demo-api/persona/switch) calls
    # the auth service with hardcoded persona credentials (alice@meridian.edu,
    # sarah@student.edu, bob@bridgepoint.com, admin@secuura.io) defined in
    # services/demo-service/src/config/personas.ts. Those users only exist
    # in the database after the demo seed runs (services/demo-service/src/
    # seed/), which only triggers via a manual reset endpoint — not on
    # `docker compose up`. So on local, every persona-switch click 502s with
    # "Persona auth failed" and the overlay floods the browser console with
    # CSP errors (its <style> injections fail style-src-elem 'self').
    #
    # Azure-deployed frontends (issuer/admin/verifier/etc.) don't include
    # the overlay either — each frontend container has its own nginx.conf
    # with no sub_filter for demo-overlay.js. So this was always a
    # local-only feature, and one that's been broken for as long as the
    # persona-seed gap has existed.
    #
    # KS-65 already worked around it test-side via page.route() interception
    # in tests/e2e-v2/fixtures/auth.fixture.ts; this is the source-side
    # companion that also fixes the human-driven local browsing experience.
    #
    # If sales demos eventually need it: deploy the demo-service +
    # nginx-gateway + frontend bundle to a dedicated demo Azure environment
    # with the demo seed loaded (POST /demo-api/reset on first boot).
    #
    # The previous sub_filter / location /demo-overlay/ / location /demo-api/
    # blocks were here. Removed because they had no functional value and
    # produced visible errors on every page load.

    # =========================================================================
    # HEALTH CHECK
    # =========================================================================
    # KS-691: the JSON used to carry "port":6882. This file is bind-mounted
    # read-only into EVERY slot, so that literal was wrong on three of four —
    # slot 2 reports 6882 while actually serving 6982. nginx cannot interpolate
    # an env var here without envsubst templating, which would also have to
    # escape every legitimate nginx $variable in this file. The port adds no
    # information a caller does not already have (they just connected to it),
    # so it is removed rather than templated.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","gateway":"secuura-local-demo","routes":{"/":"issuer","/verify/":"verifier","/admin/":"admin","/status/":"status","/website/":"website","/api/":"api-gateway"}}';
    }

    # BACKLOG H6: deep health probes downstream (postgres, redis, auth,
    # originate, anchoring) via api-gateway. /health stays static-liveness;
    # /health/deep + /health/ready give the platform-wide state.
    location = /health/deep {
        proxy_pass http://api_gateway_pool$request_uri;
    }
    location = /health/ready {
        proxy_pass http://api_gateway_pool$request_uri;
    }

    # =========================================================================
    # API GATEWAY (highest priority path match)
    # =========================================================================
    location /api/ {
        # KS-613: both zones are declared here because a limit_req at this
        # level REPLACES the server-level one rather than adding to it — omit
        # secuura_api and /api/ would lose the aggregate ceiling entirely.
        # secuura_auth's key is empty for non-auth URIs, so it is a no-op
        # except on /api/auth/* and /api/v1/auth/*.
        limit_req zone=secuura_auth burst=10  nodelay;
        limit_req zone=secuura_api  burst=100 nodelay;
        proxy_pass http://api_gateway_pool$request_uri;
    }

    location = /api/docs {
        proxy_pass http://api_gateway_pool$request_uri;
    }

    # System status endpoint (mounted outside /api/ on the gateway)
    location /system/ {
        proxy_pass http://api_gateway_pool$request_uri;
    }

    # Stripe webhooks (mounted outside /api/ on the gateway — Stripe posts to a
    # fixed URL, signature-verified, no Bearer). KS-118: the edge had no
    # /webhooks/ location, so /webhooks/stripe 405'd at nginx instead of
    # reaching the gateway -> billing proxy. Preserve the raw body (no parsing).
    location /webhooks/ {
        proxy_pass http://api_gateway_pool$request_uri;
    }

    # =========================================================================
    # ORIGINATE SERVICE — route CLOSED (KS-1041); no longer proxied
    # =========================================================================
    # KS-1041: this route is CLOSED. It used to proxy /originate/ straight to
    # originate:4000, stripping the prefix and bypassing the API gateway — and
    # originate's routes assume they are only ever reached over internal ingress.
    # The route made that assumption false, so it is closed at the edge here.
    # (Making the assumption *true* inside originate is the separate second step.)
    #
    # It is an explicit 404 rather than a deleted block, and that is deliberate.
    # Measured on the demo host before writing this: with the block simply deleted,
    # /originate/... falls through to `location /` (the issuer SPA), whose
    # `try_files $uri $uri/ /index.html` answers **HTTP 200 text/html** for any
    # unknown path — /zzz-nonexistent-path-control/ returned 200, 1592 bytes, against
    # a /health control of 200. The route would be shut, but the status code would
    # read 200 before AND after the change, so no status-keyed check could tell a
    # closed route from a live one. Returning 404 makes the closure observable.
    # Do not "tidy" this into a deletion, and do not re-point this at the gateway
    # pool — see KS-1041.
    location /originate/ {
        default_type application/json;
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    # =========================================================================
    # ANALYTICS SERVICE (admin API calls)
    # =========================================================================
    location /analytics/ {
        set $svc_analytics "analytics:4010";
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass http://$svc_analytics;
    }

    # =========================================================================
    # VERIFIER FRONTEND — served at /verify/
    # =========================================================================
    location /verify/ {
        set $svc_verifier "verifier-frontend:8080";
        proxy_pass http://$svc_verifier$request_uri;
    }

    # Redirect bare /verify to /verify/
    location = /verify {
        return 301 /verify/;
    }

    # =========================================================================
    # ADMIN FRONTEND — served at /admin/
    # =========================================================================
    location /admin/ {
        set $svc_admin "admin-frontend:8080";
        proxy_pass http://$svc_admin$request_uri;
    }

    # Redirect bare /admin to /admin/
    location = /admin {
        return 301 /admin/;
    }

    # =========================================================================
    # STATUS PAGE — served at /status/
    # =========================================================================
    location /status/ {
        set $svc_status "status-frontend:80";
        proxy_pass http://$svc_status$request_uri;
    }

    # Redirect bare /status to /status/
    location = /status {
        return 301 /status/;
    }

    # =========================================================================
    # WEBSITE (Marketing/Tokenomics) — served at /website/
    # =========================================================================
    location /website/ {
        set $svc_website "website-frontend:80";
        rewrite ^/website/(.*)$ /$1 break;
        proxy_pass http://$svc_website;
    }

    # Redirect bare /website to /website/
    location = /website {
        return 301 /website/;
    }

    # =========================================================================
    # SHOWCASE TITLE CARDS (static pages for demo recordings)
    # =========================================================================
    location /showcase/ {
        alias /usr/share/nginx/showcase/;
        index index.html;
        try_files $uri $uri/ /showcase/index.html;
    }

    # Redirect bare /showcase to /showcase/
    location = /showcase {
        return 301 /showcase/;
    }

    # =========================================================================
    # PRICING STRATEGY PAGE (KS-479) — static, baked into the image
    # =========================================================================
    # Canonical source: 2_Project_Files/PRICING/secuura-pricing-strategy.html
    location /pricing/ {
        alias /usr/share/nginx/pricing/;
        index index.html;
        try_files $uri $uri/ /pricing/index.html;
    }

    # Redirect bare /pricing to /pricing/
    location = /pricing {
        return 301 /pricing/;
    }

    # =========================================================================
    # ISSUER FRONTEND (default / catch-all)
    # =========================================================================
    location / {
        set $svc_issuer "issuer-frontend:8080";
        proxy_pass http://$svc_issuer$request_uri;
    }
}

# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    # KS-529: MUST be empty, not `close`. `Connection: close` on every ordinary
    # proxied request tells the upstream to tear the connection down after one
    # response, defeating upstream keepalive entirely — this was half the
    # 502-under-load cause. Empty => nginx omits the header and manages pooling
    # itself. Websocket upgrades still get `Connection: upgrade` via `default`.
    ''      '';
}

