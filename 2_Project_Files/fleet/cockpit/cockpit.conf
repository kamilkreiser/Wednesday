# cockpit.conf — fleet cockpit panes: <pane-name>|<command>
# Pane 0 = the LEFT COLUMN (main-vertical layout). From next boot this is
# Wednesday herself — launch the cockpit INSTEAD of double-clicking her
# launcher, and talk to her in the left pane while agents run on the right.
#
# RULE (Kam, 2026-08-04): NOTHING launches before Wednesday. This conf holds
# ONLY Wednesday + the monitor. Agent panes are never listed here — Wednesday
# launches them on demand via `cockpit.sh add <name> <launcher>`, one or as
# many as the work needs.
wednesday|bash "/Volumes/KK_T9_External_HDD/WEDNESDAY/Launch_Wednesday.command"
fleet-monitor|"/Volumes/KK_T9_External_HDD/WEDNESDAY/2_Project_Files/fleet/cockpit/monitor.sh" --interval 60 --stall-min 10
