# inbox_routing.conf — where a brief for each project is DELIVERED (WED-104).
#
# WHY: 2026-08-13 the fleet moved from one shared bus (coagent@) to per-project
# inboxes with inbox-scoped API keys (WED-103), because a single-client agent
# polling the shared bus can read another client's mail — it happened
# (learnings/2026-08-13_shared-bus-tag-filter-or-leak). send_brief.sh addressed
# coagent@ unconditionally, so a brief to a MIGRATED project would land on a bus
# that project no longer reads.
#
# Format: <Client>/<Project>|<project inbox>|<migrated: yes|no>
#
#   migrated=yes → deliver to the project inbox ONLY. They have stopped polling
#                  the bus; a bus copy would be an unread copy sitting on a
#                  shared channel, which is the exposure this migration removed.
#   migrated=no  → deliver to the project inbox AND the bus. They still read the
#                  bus today and will read their own inbox after they migrate at
#                  their next boot; the brief must be findable on whichever
#                  channel that session actually reads. (Bootstrap pattern proven
#                  2026-08-13: the migration notice itself was seeded both ways.)
#
# Flip a project to yes ONLY after that project's agent has reported its own
# verification (own inbox 200 · another inbox 404 · enumeration count 1) — the
# agent's report, not my assumption. A project absent from this file is REFUSED
# by send_brief.sh rather than defaulted anywhere.
# Flipped to yes 2026-08-13 22:2x on the agent's OWN verification report (session
# 28 plan mail): own inbox 200 · coagent@ 404 · all three Datasec inboxes AND
# wednesday-agent@ 404 · GET /v0/inboxes count 1. Their probe was wider than the
# one I asked for.
Secuura/Blockchain|secuura-blockchain@agentmail.to|yes
Datasec/NexusAI|datasec-nexusai@agentmail.to|no
Datasec/Vision_Sales_Portal|datasec-vision@agentmail.to|no
Datasec/HPSM|datasec-hpsm@agentmail.to|yes
Wednesday|wednesday-agent@agentmail.to|yes
