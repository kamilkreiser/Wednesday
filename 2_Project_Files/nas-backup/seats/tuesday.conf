# seats/tuesday.conf — PROPOSED, NOT CONFIRMED. Written by the WED build seat on Wednesday's machine, where
# Tuesday's drive is not the working drive: every path below is a placeholder until it is checked on Tuesday's
# own machine (proposed/INSTRUCTIONS-for-other-seats.md). While status is not "confirmed" nb_core.py refuses.
status=unconfirmed
# Tuesday's own working drive, as `mount` shows it on her machine (it must be a LOCAL volume).
source_volume=/Volumes/REPLACE-WITH-TUESDAYS-DRIVE
fire=02:30
# 3 hours: closes at 05:30, when com.tuesday.shiftchange fires on her machine.
window_hours=3
late_fire=refuse
min_free_gib=200
max_seconds=10800
card_client_project=Datasec/TUESDAY
# Allow-list for this seat (nb_core.py SEATS): Datasec only -> <NAS>/Datasec/Tuesday/nightly-backup/.
set=Datasec|TUESDAY|/Volumes/REPLACE-WITH-TUESDAYS-DRIVE/TUESDAY
set=Datasec|Datasec|/Volumes/REPLACE-WITH-TUESDAYS-DRIVE/!CODING/Datasec
report_unlisted_under=/Volumes/REPLACE-WITH-TUESDAYS-DRIVE/!CODING
# Add exclude_path= lines after reading her first dry run (the Wednesday tree needed several: see wednesday.conf).
