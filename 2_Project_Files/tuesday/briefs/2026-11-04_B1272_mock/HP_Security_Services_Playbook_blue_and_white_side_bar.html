/* v1.1 – white HP branding and user-controlled navigation blind */
.hp-logo-wrap{display:inline-block;position:relative;width:var(--hp-mark-size);height:var(--hp-mark-size);flex-shrink:0;vertical-align:middle}
.hp-logo-wrap img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hp-logo-original{z-index:1}.hp-logo-local{z-index:0}
.hp-sidebar-icon{background:#fff!important;box-shadow:none!important;width:48px!important;height:48px!important;border-radius:9px!important}
.brand{gap:10px;position:relative;margin:0 7px 25px}.brand .brand-title{flex:1;min-width:0}
.sidebar-hide{flex-shrink:0;display:grid;place-items:center;width:25px;height:29px;border-radius:7px;border:1px solid #2d5e7b;background:transparent;color:#c9eaf8;transition:.2s}
.sidebar-hide:hover{background:#275777;color:white}
.top-start{display:flex;align-items:center;gap:13px;min-width:0}
.sidebar-toggle{width:39px;height:39px;display:grid;place-items:center;flex-shrink:0;border:1px solid #d7e8f1;background:#f8fcff;border-radius:9px;color:#145474;transition:background .18s,border-color .18s}
.sidebar-toggle:hover{background:#e9f7ff;border-color:#96d8f4}
.sidebar{transition:width .22s ease,padding .22s ease;overflow-x:hidden}
.app.sidebar-closed>.sidebar{width:0;min-width:0;padding:0;overflow:hidden;pointer-events:none;border:0}
.app.sidebar-closed>.sidebar>*{display:none}
.nav-backdrop{display:none}
.hp-home-signature{background:#fff;display:flex;align-items:center;gap:12px;border:1px solid #dce8f0;border-radius:12px;padding:9px 14px 9px 10px;min-height:72px;box-shadow:0 4px 20px #0b3c5a0a}
.hp-home-logo{display:grid;place-items:center;background:#fff;min-width:55px;min-height:55px}
.hp-home-text{display:flex;flex-direction:column;text-align:left;white-space:nowrap;gap:5px}
.hp-home-text b{font-size:17px;font-weight:900;letter-spacing:-.6px;color:#092f50;line-height:1}
.hp-home-text small{font-size:9px;font-weight:800;letter-spacing:1px;color:#69849a}
@media(max-width:1150px){.hp-home-signature{order:-1}.pagehead .header-buttons{justify-content:flex-end;max-width:420px}}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:245px!important;height:100dvh;min-height:100vh;padding:21px 9px 10px!important;z-index:31;box-shadow:18px 0 50px #061c3055;overflow-y:auto}
  .sidebar .brand{margin:0 7px 25px!important}
  .sidebar .brand strong{display:block!important}
  .sidebar .brand small{display:block!important}
  .sidebar .nav-section{display:block!important}
  .sidebar .nav-item span{display:inline!important}
  .sidebar .nav-item{justify-content:flex-start!important;padding:12px!important}
  .sidebar .sidebar-bottom{display:block!important}
  .sidebar .brand-icon{width:48px!important;height:48px!important}

/* v1.2 — differentiated partner enablement and customer security experiences */
.workspace-switch{display:inline-flex;gap:3px;padding:4px;border:1px solid #dcebf4;background:#f3f9fd;border-radius:10px;align-items:center}
.workspace-switch button{border:none;border-radius:7px;background:transparent;color:#5b7990;padding:8px 11px;white-space:nowrap;font-size:11px;font-weight:820}
.workspace-switch button.active{background:#087cbe;color:#fff;box-shadow:0 2px 7px #1176a526}
.workspace-switch button:disabled{opacity:.55}
.view-kicker{padding:11px 14px;border-radius:10px;background:#eff7fc;border:1px solid #cfe4f1;color:#35647e;display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.65;margin-bottom:17px}
.view-kicker strong{color:#1b516c}
.view-kicker.customer{background:#f1f9f8;border-color:#d4eae4;color:#32695e}
.kpi-note{background:#f6fafc;color:#54768c;padding:10px 12px;border-radius:9px;font-size:10px;line-height:1.6}
.hpsc-feature{background:linear-gradient(115deg,#0c3552,#134c6e);border-radius:13px;color:white;padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;min-height:124px}
.hpsc-feature h2{font-size:18px;margin:0 0 7px;color:white}.hpsc-feature p{color:#b9deef;font-size:11px;margin:0;line-height:1.6;max-width:640px}
.hpsc-feature .btn{align-self:center}.feature-logo{background:white;border-radius:11px;padding:7px;display:grid;place-items:center;flex:0 0 66px;height:65px}
.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.level-card{border:1px solid #d9e8f1;background:#fff;border-radius:13px;padding:19px;display:flex;flex-direction:column;gap:11px;position:relative}
.level-card.chosen{outline:2px solid #0a90c8;outline-offset:-2px;background:#f9fdff}
.level-card h3{font-size:17px;letter-spacing:-.25px;margin:0}.level-card .price-note{font-size:11px;color:#7290a5}.level-card ul{padding-left:19px;margin:0;color:#516c81;font-size:11px;line-height:1.85;flex:1}
.level-card .tier-num{font-weight:880;font-size:10px;letter-spacing:1.3px;color:#008cbd}.level-card .chosen-sign{position:absolute;top:17px;right:17px}
.readiness-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.readiness-block{border:1px solid var(--line);background:#fff;border-radius:12px;padding:17px}
.readiness-block h3{font-size:12px;margin:0 0 9px}.readiness-block .smalltext{margin:4px 0 9px}
.security-domains{display:grid;gap:14px}.domain{display:grid;grid-template-columns:minmax(145px,1fr) minmax(120px,2fr) 65px;align-items:center;gap:13px}.domain b{font-size:11px}.domain small{color:#83a0b3;font-size:10px;display:block;margin-top:3px}
.summary-columns{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:14px;align-items:start}
.finding-public{padding:16px;border-radius:10px;border:1px solid #dce9f1;border-left:4px solid #f1ad55;margin-top:10px;background:#fff}
.finding-public.high{border-left-color:#ca5d4e}.finding-public.low{border-left-color:#5fbd9b}.finding-public h3{margin:9px 0 7px;font-size:12px}
.finding-public p{margin:6px 0;line-height:1.55;color:#57768b;font-size:11px}
.mapping-table{width:100%;border-collapse:collapse;min-width:690px}.mapping-table th,.mapping-table td{text-align:left;border-bottom:1px solid #edf3f7;padding:12px;font-size:11px;vertical-align:top}.mapping-table th{font-size:9px;text-transform:uppercase;letter-spacing:.8px;background:#f6fafd;color:#62819a}.mapping-table th:first-child{min-width:205px}
.workspace-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.workspace-step{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;min-height:144px}.workspace-step b{display:block;font-size:12px;margin:10px 0 7px}.workspace-step p{color:#6c899c;font-size:11px;line-height:1.65;margin:0}
.clean-data{margin:0;padding-left:17px;color:#577991;font-size:11px;line-height:1.8}
.text-btn{border:0;background:none;padding:0;font-weight:800;font-size:11px;color:#087cbe;cursor:pointer;text-align:left}.text-btn:hover{text-decoration:underline}
.view-chip{font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:1.1px;color:#7794a9}
.sep-line{height:1px;background:#e9f0f5;margin:15px 0}
.v12-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.side-mode{padding:12px;margin:0 5px 8px;border-radius:10px;border:1px solid #35617d;background:#133c56;font-weight:750;color:#d8f0fc;line-height:1.45;font-size:10px}
.side-mode small{display:block;color:#8dbbd7;font-size:9px;margin-top:3px}
.skeleton-score{color:#9bb0bf;font-size:24px;font-weight:850}
.assess-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.assess-stat{border:1px solid #e1ebf2;border-radius:10px;padding:16px;background:white}.assess-stat b{font-size:24px;display:block;margin-bottom:6px}.assess-stat small{color:#7993a5;font-size:11px}
.cust-only .feedback-fab{display:none}

function stepNav(i){return `<div class="rowflex mt20">${i>0?btn('← Previous step','step','btn',`data-step="${i-1}"`):'<span></span>'}${i<8?btn('Next: '+STEPS[i+1]+' →','step','btn primary',`data-step="${i+1}"`):btn('Back to customer overview','customer-tab','btn primary',`data-tab="Overview"`)}</div>`}
function stepPage(c){const n=ui.step;return [stepProfile,stepAssessment,stepScore,stepRecommendation,stepRoadmap,stepNarrative,stepExecutive,stepNext,stepMetrics][n](c)+stepNav(n)}
function stepProfile(c){return `<h2>1. Customer profile</h2><p class="smalltext">Capture the context for the assessment and confirm the print estate. Optional information should not be treated as verified if unknown.</p><div class="form-grid mt20"><div class="form-item full"><label class="form-label" for="cust-name">Customer / organisation</label><input class="field" id="cust-name" value="${esc(c.name)}" data-profile="name" ${readonly()?'disabled':''}></div><div class="form-item"><label class="form-label">Industry</label><select class="field" data-profile="industry" ${readonly()?'disabled':''}>${['Manufacturing','Government','Healthcare','Education','Financial services','Transport & logistics','Professional services','Other'].map(x=>`<option ${c.industry===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item"><label class="form-label">Customer owner / partner</label><input class="field" value="${esc(c.owner)}" data-profile="owner" ${readonly()?'disabled':''}></div>${[['staff','Staff size'],['sites','Number of sites'],['devices','Printers & MFPs']].map(([k,t])=>`<div class="form-item"><label class="form-label">${t}</label><input class="field" type="number" min="0" value="${esc(c[k])}" data-profile="${k}" ${readonly()?'disabled':''}></div>`).join('')}</div><div class="mt20">${btn('Save profile','save-profile','btn primary',readonly()?'disabled':'')}</div><div class="hint mt20"><b>Assessment context · Placeholder</b><div>Detailed context fields and their impact on scoring must be validated with HP. Industry labels do not establish a compliance finding.</div></div>`}
function stepAssessment(c){const q=QUESTIONS[ui.question];return `<h2>2. Guided assessment</h2><p class="smalltext">16 draft customer snapshot questions in five groups. Answers save to this browser as you go.</p><div class="rowflex mt14"><div>${chip(`${count(c)} of 16 answered`,'blue')} ${chip('Draft content','amber')}</div><div style="width:180px">${progress(coverage(c))}</div></div><div class="rowflex mt14"><div class="form-item"><label class="form-label">Show questions for</label><select class="field" style="min-width:220px" data-change="qgroup"><option>Everyone</option>${GROUPS.map(g=>`<option ${ui.qGroup===g?'selected':''}>${g}</option>`).join('')}</select></div>${btn('Create follow-up draft','create-followup','btn soft',readonly()?'disabled':'')}</div><div class="q-layout mt14"><div class="question-card"><div class="smalltext" style="font-weight:850;letter-spacing:.5px">QUESTION ${ui.question+1} OF 16 · ${esc(q.group).toUpperCase()}</div><div class="question-text">${esc(q.q)}</div><div class="answerchoices">${['Yes','No','Unsure'].map(a=>`<button class="${c.answers[q.id]===a?'selected':''}" data-act="answer" data-id="${q.id}" data-answer="${a}" ${readonly()?'disabled':''}>${a}</button>`).join('')}</div><div class="mt20">${btn(ui.showNote?'− Hide note':'+ Add a note','toggle-note','btn ghost small')}${ui.showNote?`<textarea class="field mt14" data-note="${q.id}" placeholder="Optional evidence or context (stored locally)" ${readonly()?'disabled':''}>${esc(c.notes[q.id]||'')}</textarea>${btn('Save note','save-note','btn small',`data-id="${q.id}" ${readonly()?'disabled':''}`)}`:''}</div><div class="hint mt20">Guidance on answering is being finalised. The example finding and recommended response are not approved HP content.</div><div class="btnrow mt20">${btn('← Previous','prev-question','btn',ui.question===0?'disabled':'')}${btn('Skip for now →','next-question','btn')}${btn('Next question →','next-question','btn primary',ui.question===15?'disabled':'')}</div></div><aside class="q-list"><div class="card-title" style="padding:5px">All questions</div><div class="smalltext" style="padding:0 5px 9px">Select any question to review or answer it.</div>${QUESTIONS.map((x,i)=>`<button data-act="question" data-question="${i}" class="${c.answers[x.id]?'answered':''} ${i===ui.question?'active':''}" style="${ui.qGroup!=='Everyone'&&x.group!==ui.qGroup?'display:none':''}">${x.id} · ${esc(x.q.substring(0,56))}…</button>`).join('')}</aside></div>`}
function stepScore(c){return `<h2>3. Score & findings</h2><p class="smalltext">Scored by fixed <b>demonstration rules</b>. Every finding shows the triggering question and recorded answer. This is not an approved or externally validated security score.</p>${!assessed(c)?notice('This sample has fewer than eight answers; the provisional score is not ready for assessment sign-off.','amber'):''}<div class="scoregrid mt20"><div class="card pad" style="text-align:center"><div class="smalltext">Overall score · answered questions</div><div class="scorebig"><div><strong>${score(c)}</strong><small>out of 100</small></div></div>${chip('Rating: '+rating(score(c)),rating(score(c))==='Green'?'green':rating(score(c))==='Amber'?'amber':'red')}<p class="smalltext">${count(c)} / 16 answers recorded. Unanswered questions are excluded in the draft formula.</p></div><div class="card pad"><h3>By section · current vs target</h3>${GROUPS.map(g=>{const qs=QUESTIONS.filter(q=>q.group===g);const ans=qs.filter(q=>c.answers[q.id]);const val=ans.length?Math.round(ans.filter(q=>c.answers[q.id]==='Yes').length/ans.length*100):0;return `<div class="bar-row"><div class="proglabel"><b>${esc(g)}</b><b>${val}% · ${ans.length}/${qs.length}</b></div>${progress(val)}</div>`}).join('')}<div class="hint">Illustrative calculation: score = percentage of recorded answers that are “Yes”; “Unsure” is counted as unresolved. A production model requires HP-approved weighting and handling of missing evidence.</div></div></div><div class="mt20"><h3>Findings (${findings(c).length})</h3>${findingsCards(c)}</div>`}
function findingsCards(c){const ff=findings(c);return ff.length?ff.map(f=>`<article class="finding ${f.risk==='High'?'high':f.risk==='Low'?'low':''}"><div class="btnrow">${chip(f.risk.toUpperCase(),f.risk==='High'?'red':f.risk==='Medium'?'amber':'grey')}${chip('Act: '+f.when,'blue')}${f.approved?chip('Reviewed / accepted','green'):chip('Requires review','amber')}</div><h3>${esc(f.finding)}</h3><p><b>Rule:</b> ${esc(f.id)} = ${esc(f.answer)} · ${esc(f.q)}</p><p><b>Suggested action:</b> ${esc(f.action)}</p><div class="actions">${btn('Open finding detail','finding-detail','btn small',`data-id="${f.id}"`)}${!f.approved?btn('Mark finding reviewed','approve-finding','btn soft small',`data-id="${f.id}" ${readonly()?'disabled':''}`):''}</div></article>`).join(''):'<div class="empty">No negative or uncertain responses currently produce findings. Continue the snapshot to establish evidence.</div>'}
function findingsPanel(c){let f=QUESTIONS.find(x=>x.id===ui.findDetail);return f&&['No','Unsure'].includes(c.answers[f.id])?`<div class="card panel"><div class="rowflex"><div><h2>${esc(f.finding)}</h2>${chip(f.risk,'red')} ${chip(f.when,'blue')}</div>${btn('← All findings','clear-finding','btn')}</div><div class="kvgrid mt20"><div class="kv"><small>Category</small><strong>${esc(f.group)}</strong></div><div class="kv"><small>Answer and rule</small><strong>${f.id} = ${esc(c.answers[f.id])}</strong></div><div class="kv"><small>Current state</small><strong>Requires customer validation</strong></div><div class="kv"><small>Status</small><strong>${c.approved.includes(f.id)?'Reviewed / accepted':'Pending review'}</strong></div></div><h3 class="mt20">Source question</h3><p>${esc(f.q)}</p><h3>Potential business impact <span class="pill amber">Draft / to be validated</span></h3><p class="smalltext">This item highlights a possible control gap. Customer impact and affected devices need to be evidenced, not inferred from a Yes/No answer alone.</p><h3>Proposed remediation</h3><p>${esc(f.action)}</p><h3>HP/HPSM policy mapping</h3><p class="hint">${esc(f.hpsm)}. This proposed mapping is subject to HP technical validation. No device changes occur from this page.</p>${btn('Mark finding reviewed','approve-finding','btn primary',`data-id="${f.id}" ${readonly()?'disabled':''}`)}</div>`:`<div class="card panel"><div class="rowflex"><div><h2>Customer findings</h2><p class="smalltext">Draft rule-derived findings, most severe first. Only reviewed findings feed the customer narrative.</p></div>${btn('Continue to recommendations','open-step','btn primary',`data-step="3"`)}</div>${findingsCards(c)}</div>`}
function stepRecommendation(c){const fs=openFindings(c);return `<h2>4. HP/HPSM recommendation</h2><p class="smalltext">Proposed good/better/best settings linked back to reviewed findings. HP must vet control terminology, support by model and settings before customer use.</p>${notice('<b>No device is changed.</b> Recommendations are explanatory only and cannot be exported as an HPSM policy.','green')}<div class="hint mb12">Grouping proposed for HP to vet. Good, Better and Best are cumulative. Some actions require processes or infrastructure beyond HP Security Manager.</div>${['Good','Better','Best'].map(tier=>`<div class="card pad mb12"><div class="rowflex"><h3 style="margin:0">${tier} ${tier==='Good'?'— Essential controls':tier==='Better'?'— Harden & govern':'— Operate & optimise'}</h3>${chip(tier,'blue')}</div>${fs.filter(f=>f.tier===tier).map(f=>`<div class="finding"><b>${esc(f.control)}</b><p><b>Location in HPSM / related process:</b> ${esc(f.hpsm)}</p><p><b>Recommended action:</b> ${esc(f.action)}</p><p><b>Addresses:</b> ${esc(f.id)} · ${esc(f.finding)}</p></div>`).join('')||'<p class="smalltext">No reviewed finding currently maps to this tier.</p>'}</div>`).join('')}`}
function stepRoadmap(c){let fs=openFindings(c);return `<h2>5. Remediation roadmap</h2><p class="smalltext">Reviewed findings are organised into a sequenced plan. Assign owners and confirm dependencies during the implementation engagement.</p>${notice('Draft roadmap: timings are indicative priority buckets, not a committed project plan.','amber')}<div class="timeline mt14">${['Immediate','30-day','60–90-day','Ongoing'].map(t=>`<div class="timecol"><h3>${t}</h3>${fs.filter(f=>f.when===t).map(f=>`<div class="timecard"><b>${esc(f.action)}</b><small>${esc(f.id)} · ${esc(f.risk)} risk</small></div>`).join('')||'<div class="smalltext">No actions in this bucket.</div>'}</div>`).join('')}</div>`}
function narrative(c){let fs=openFindings(c);let str=fs.length?`The sample assessment for ${c.name} has ${count(c)} of 16 questions answered, with a provisional score of ${score(c)}/100. ${fs.length} findings have been reviewed for inclusion. Priority areas include ${fs.slice(0,3).map(f=>f.control.toLowerCase()).join(', ')}. The proposed next step is to validate device-level evidence, agree remediation ownership and obtain HP review of relevant control mappings.`:`The assessment for ${c.name} has ${count(c)} recorded answers. No findings have been reviewed for publication. Additional evidence and human approval are required before producing a meaningful executive report.`;return str}
function stepNarrative(c){return `<h2>6. Narrative review</h2><p class="smalltext">A customer-facing summary generated only from reviewed draft findings, then requiring human approval.</p>${notice('<b>Human approval required.</b> The summary is derived from recorded answers and reviewed findings, not from unsupported free-text claims.','amber')}<div class="card pad mt14"><div class="rowflex"><h3>Executive summary</h3>${chip(c.narrativeApproved?'Approved':'Template text · unapproved',c.narrativeApproved?'green':'amber')}</div><p style="line-height:1.8">${esc(c.narrative||narrative(c))}</p></div><div class="btnrow mt14">${btn('Regenerate from reviewed findings','regen-narrative','btn',readonly()?'disabled':'')}${btn('Approve summary','approve-narrative','btn primary',readonly()?'disabled':'')}</div>`}
function reportMarkup(c,type='Full executive report'){const approved=openFindings(c);const blocks={"Executive summary":true,"Findings & risk analysis":true,"Prioritised roadmap":true,"Recommendations":true,"Full executive report":true};return `<div class="report-print" id="print-root"><div class="eyebrow">HP SECURITY SERVICES · REVIEW COPY</div><h1>Print security assessment</h1><div class="smalltext">${esc(type)} · ${esc(c.name)} · Sample data</div><hr class="divider"><h2>Executive overview</h2><p>${esc(c.narrative||narrative(c))}</p><p><b>Answers:</b> ${count(c)} / 16 &nbsp; <b>Illustrative score:</b> ${score(c)} / 100 &nbsp; <b>Reviewed findings:</b> ${approved.length}</p>${['Full executive report','Findings & risk analysis'].includes(type)?`<h2>Reviewed findings</h2>${approved.map(f=>`<p><b>${esc(f.id)} ${esc(f.finding)} (${f.risk})</b><br>${esc(f.action)}</p>`).join('')||'<p>No reviewed findings available.</p>'}`:''}${['Full executive report','Prioritised roadmap'].includes(type)?`<h2>Remediation roadmap</h2>${approved.map(f=>`<p><b>${esc(f.when)}:</b> ${esc(f.action)}</p>`).join('')||'<p>Pending review.</p>'}`:''}${['Full executive report','Recommendations'].includes(type)?`<h2>Proposed HP/HPSM recommendations</h2>${approved.map(f=>`<p><b>${esc(f.tier)} · ${esc(f.control)}</b><br>${esc(f.hpsm)}</p>`).join('')||'<p>Pending review.</p>'}`:''}<hr class="divider"><p class="smalltext"><b>Review restriction:</b> All customer details are fictional. The 16-question set, scoring, policy mappings and implementation guidance are draft and must not be represented as validated HP policy, compliance certification or customer security posture.</p></div>`}
function stepExecutive(c){return `<h2>7. Executive report</h2><p class="smalltext">Build a customer-facing output from the recorded snapshot and human-reviewed findings.</p>${c.report?notice('<b>Report marked issued in the sample engagement.</b> Download or print a locally generated review copy.','green'):c.narrativeApproved?notice('Narrative approved. The report can be generated as a review-only document.','green'):notice('The narrative is not yet approved. Review and approve it before marking the report issued.','amber')}<div class="btnrow mt14">${btn('Preview executive report','preview-report','btn soft')}${btn('Generate review document (HTML)','download-report','btn')}${btn('Mark report issued','issue-report','btn primary',`${readonly()||!c.narrativeApproved?'disabled':''}`)}</div><div class="mt20">${reportMarkup(c)}</div>`}
function stepNext(c){return `<h2>8. Next engagement</h2><p class="smalltext">A draft next-step recommendation derived from the types of reviewed findings and the service delivery phase.</p><div class="card pad mt20"><div class="rowflex"><h3>Proposed next service engagement</h3>${chip('Placeholder','amber')}</div><h2>${openFindings(c).length?'Print-device hardening and control validation':'Customer security discovery / evidence review'}</h2><p><b>Why:</b> ${openFindings(c).length?'Reviewed findings indicate a need to validate and plan control improvements.':'There is insufficient reviewed evidence to scope an implementation service.'}</p><p><b>How chosen:</b> Demonstration rules, with emphasis on outstanding reviewed findings.</p><p><b>Area:</b> ${openFindings(c)[0]?.group||'Security discovery'}</p><p><b>Price:</b> Not shown — service pricing and commercial scope are not approved.</p>${btn('Review service offers →','nav','btn soft',`data-key="offers"`)}</div>`}
function stepMetrics(c){return `<h2>Customer automation metrics</h2><p class="smalltext">Proposed definitions and local example counts. These are not performance benchmarks or validated time savings.</p><div class="cards4" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric('Consultant time','Not measured','No tracking connection','users')}${metric('Findings raised',findings(c).length,'From recorded answers','shield')}${metric('Findings reviewed',openFindings(c).length,'Human-reviewed draft findings','check')}${metric('Narrative drafts',c.narrative?1:0,'Local generated text','file')}</div>`}
function tasks(c){let tid='firmware';let items=['Review supported device models and firmware versions','Compare firmware to HP security advisories','Record prioritised exceptions and affected devices','Approve a remediation or monitoring plan'];return `<div class="card panel"><h2>Firmware risk assessment</h2><p class="smalltext">Track a sample firmware-risk activity using the task checklist, findings, evidence and guidance tabs.</p><div class="top-tabs">${['Overview','Checklist','Findings','Evidence','Guidance'].map(t=>`<button class="tab ${ui.taskTab===t?'active':''}" data-act="task-tab" data-tab="${t}">${t}</button>`).join('')}</div><div class="mt20">${ui.taskTab==='Overview'||ui.taskTab==='Checklist'?`<div class="rowflex"><h3>Task checklist</h3>${chip(items.filter((_,i)=>c.tasks['f'+i]).length+' of 4 complete','blue')}</div>${items.map((x,i)=>`<label class="checkline"><input type="checkbox" data-task="f${i}" ${c.tasks['f'+i]?'checked':''} ${readonly()?'disabled':''}> <span>${x}</span></label>`).join('')}`:ui.taskTab==='Findings'?findingsCards(c):ui.taskTab==='Evidence'?`<h3>Evidence register</h3><p class="hint">No real device evidence is connected. Provide representative inventory, firmware versions, policy reports and validation screenshots during a real engagement.</p>`:`<h3>Guidance</h3><p class="smalltext">Verify the manufacturer's latest advisories, supported management functions and policy syntax before applying configuration changes. This prototype does not perform network discovery or deployment.</p>`}</div></div>`}
function documents(c){return `<div class="split"><div class="card panel"><h2>Document generation</h2><p class="smalltext">From scored results: deterministic rules and human review, not unverified AI assertions.</p><h3 class="mt20">1. Document type</h3><div class="chips">${['Executive summary','Findings & risk analysis','Prioritised roadmap','Recommendations','Full executive report'].map(t=>`<button class="chip ${ui.reportType===t?'active':''}" data-act="report-type" data-type="${t}">${t}</button>`).join('')}</div><h3 class="mt20">2. Configure content</h3><div class="hint">The prototype includes customer overview, reviewed findings and draft recommendations for the chosen report type. HP-approved templates and branded layouts are a future integration.</div><h3 class="mt20">3. Generate</h3><div class="btnrow">${btn('Export HTML report','download-report','btn primary')}${btn('Print / save as PDF','print-report','btn')}</div><hr class="divider"><h3>Client packs</h3><p class="smalltext">Before, during and after engagement. Opening a pack is local; no emails are sent.</p>${['Before the engagement','During the engagement','After completion'].map((x,i)=>`<button class="quick-action" data-act="pack" data-pack="${i}"><span>${i+1}. ${x}</span><span>→</span></button>`).join('')}</div><div class="card panel"><h3>Document preview</h3>${reportMarkup(c,ui.reportType)}</div></div>`}
const COACH=[['Opening a print security conversation','ASSESS','“How do you know whether every printer is aligned to an agreed security standard?”','Lead with current fleet visibility, not a product feature. Offer a short evidence-led snapshot.'],['Explaining an unresolved finding','ASSESS','“We have an answer that needs validation before we call it a confirmed risk.”','Explain the rule, request supporting device evidence, and avoid overclaiming.'],['Why HP Security Manager?','IMPLEMENT','“Could we use a repeatable policy standard instead of checking each device manually?”','Validate supported HP MFP models and the policy functions with HP before proposing enforcement.'],['How do we commercialise remediation?','IMPLEMENT','“Can we scope the controls, exceptions and ownership as an implementation phase?”','Propose a bounded statement of work after findings and mappings have been approved.'],['Building a recurring security service','OPTIMIZE','“Who checks the device fleet after the initial remediation is finished?”','Position periodic exception handling, advisories and reporting as a candidate managed service.']];
function coach(c){let t=COACH[ui.coach]||COACH[0];return `<div class="card panel"><h2>Conversation coach</h2><p class="smalltext">Customer talk tracks: use evidenced findings first, followed by common questions and objections. Draft content.</p><div class="q-layout mt20"><div><h3>${esc(t[0])}</h3>${chip(t[1],'blue')}<h3 class="mt20">How to open</h3><p class="hint">${esc(t[2])}</p><h3 class="mt20">Suggested response</h3><p style="line-height:1.8">${esc(t[3])}</p><div class="btnrow mt20">${btn('← Previous','coach-prev','btn')}${btn('Next →','coach-next','btn primary')}</div></div><aside class="q-list"><div class="card-title" style="padding:8px">Talk tracks</div>${COACH.map((x,i)=>`<button class="${i===ui.coach?'active':''}" data-act="coach-select" data-coach="${i}">${i+1}. ${esc(x[0])}</button>`).join('')}</aside></div></div>`}
function engagements(){const list=data.customers.filter(c=>c.engagement);return head('CUSTOMER LIFECYCLE','Engagements','Every customer engagement under way: where it stands, what is complete and what happens next.',btn('View all customers','nav','btn',`data-key="customers"`))+`<section class="card"><div class="cardhead"><h2 class="card-title">Under way (${list.length})</h2></div><div class="tablewrap"><table class="data-table"><thead><tr><th>CUSTOMER</th><th>STAGE</th><th>PROGRESS</th><th>NEXT MILESTONE</th><th>LAST ACTIVITY</th></tr></thead><tbody>${list.map(c=>`<tr><td><button class="table-link" data-act="open-customer" data-id="${c.id}">${esc(named(c))}</button></td><td>${stageChip(c.stage)}</td><td>${progress(coverage(c))}<div class="tdsub">${count(c)} of 16 questions</div></td><td>${btn(count(c)<16?'Continue assessment':!c.narrativeApproved?'Narrative approval':c.report?'Next engagement':'Executive report','engagement-next','btn soft small',`data-id="${c.id}"`)}</td><td>${esc(c.updated)}</td></tr>`).join('')}</tbody></table></div></section><p class="smalltext mt14">${data.customers.filter(c=>!c.engagement).length} sample customer(s) without an engagement.</p>`}
function actionPlan(){return head('PARTNER ENABLEMENT','Action plan','Your practice-level activities for moving from assessment capability through implementation and ongoing service delivery.',btn('+ Add action','add-action','btn primary'))+notice('The target dates and owners shown are sample suggestions. Changes to this page are saved locally.')+`<div class="cards4">${metric('Programme phase','Phase 1','Assessment','shield')}${metric('Actions',data.actionPlan.length,'Example partner activities','clipboard')}${metric('Completed',data.actionPlan.filter(a=>a.status==='Complete').length,'Readiness milestones','check')}${metric('In progress',data.actionPlan.filter(a=>a.status==='In progress').length,'Current work','briefcase')}</div><div class="card pad"><h2 class="sectiontitle">Your next 30 days</h2><div class="tablewrap"><table class="data-table"><thead><tr><th>ACTION</th><th>OWNER</th><th>DUE DATE</th><th>STATUS</th><th>SOURCE</th><th></th></tr></thead><tbody>${data.actionPlan.map(a=>`<tr><td style="min-width:250px">${esc(a.action)}</td><td>${esc(a.owner)}</td><td>${esc(a.due||'Not set')}</td><td><select class="field" style="min-width:125px" data-actionstatus="${a.id}" ${readonly()?'disabled':''}>${['Not started','In progress','Complete'].map(x=>`<option ${x===a.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${chip(a.source,'blue')}</td><td>${btn('Remove','remove-action','btn small danger',`data-id="${a.id}" ${readonly()?'disabled':''}`)}</td></tr>`).join('')}</tbody></table></div><hr class="divider"><h3>Supporting resources</h3><div class="btnrow">${btn('Readiness self-assessment','nav','btn',`data-key="assessments"`)}${btn('Customer snapshot','open-step','btn',`data-step="1"`)}${btn('Service offers','nav','btn',`data-key="offers"`)}</div></div>`}
function offers(){return head('SERVICE DELIVERY / PHASES','Service offers','A repeatable assess → implement → optimise motion. The offer inclusions, tiers and pricing are awaiting approval.')+notice('Offer wording, inclusions, service tiers and pricing remain placeholders; nothing below represents approved HP or Datasec commercial terms.','amber')+`<div class="phasegrid">${[['Assessment & design','Fleet discovery, security snapshot, evidence review and proposed remediation roadmap.'],['Implementation','Validate policy control mapping, apply approved remediation under change control and document exceptions.'],['Managed service','Recurring posture review, advisory monitoring, exception management and security reporting.']].map(([t,desc],i)=>`<div class="card pad"><span class="numstep">0${i+1}</span><h2 style="font-size:16px">Phase ${i+1}: ${t}</h2><p class="smalltext" style="min-height:70px">${desc}</p>${btn('View offer sheet','open-offer','btn primary',`data-offer="${i+1}"`)}</div>`).join('')}</div><div class="card panel mt20"><h2>Current offer sheet · Phase ${ui.offer}</h2><div class="kvgrid mt14">${[['Inclusions','PLACEHOLDER — content pending approval'],['Tiers','PLACEHOLDER — scope and service levels pending approval'],['Price','PLACEHOLDER — not confirmed'],['Tracker','Sample implementation and managed service milestone tracking']].map(([k,v])=>`<div class="kv"><small>${k}</small><strong style="font-size:12px">${v}</strong></div>`).join('')}</div><div class="hint mt20">Before publishing, obtain HP approval for recommended service scope, supported fleet functions, roles, SLAs, warranty boundaries and approved price book.</div></div>`}
const READINESS=['We have an identified security services owner','We can describe our security services value proposition','We can conduct a first customer discovery call','We can inventory a printer fleet','We understand HP Security Manager positioning','We can identify basic printer security risks','We have access to HP technical escalation','We can describe an evidence-led assessment','We can agree an assessment scope','We can interpret a draft findings report','We have a repeatable proposal template','We have an implementation specialist identified','We have standard implementation UAT criteria','We have a managed service reporting model','We have a defined response and escalation process','We measure recurring service customer outcomes'];
function assessments(){let n=data.readiness.filter(Boolean).length;return head('READINESS / CUSTOMER SNAPSHOT','Assessments','Review the partner capability self-assessment and launch an individual customer security snapshot.')+`<div class="split"><section class="card panel"><h2>Partner readiness self-assessment</h2><p class="smalltext">16 illustrative statements across four capability areas. This prototype allows you to update the local readiness sample.</p><div class="rowflex mt20"><b style="font-size:26px">${n} / 16</b>${chip(n>=12?'Ready to start':n>=8?'Solid foundation':n>=4?'Foundation building needed':"Let's connect",'blue')}</div>${progress(Math.round(n/16*100))}<div class="mt20">${READINESS.map((x,i)=>`<label class="checkline"><input type="checkbox" data-readiness="${i}" ${data.readiness[i]?'checked':''} ${readonly()?'disabled':''}>${esc(x)}</label>`).join('')}</div><div class="hint mt14">Score bands from the guide: 12–16 Ready to start; 8–11 Solid foundation; 4–7 Foundation building needed; 0–3 Let's connect. The statements in this interactive version are draft examples.</div></section><div class="stack"><section class="card panel"><h2>Customer security snapshot</h2><p class="smalltext">Sixteen Yes / No / Unsure questions covering printer administration, networks, identity, governance and monitoring.</p>${btn('Open selected customer snapshot →','open-step','btn primary',`data-step="1"`)}</section><section class="card panel"><h2>Capability breakdown</h2>${['Practice strategy','Delivery skills','Operational readiness','Commercialisation'].map((name,j)=>`<div class="bar-row"><div class="proglabel"><b>${name}</b><b>${data.readiness.slice(j*4,j*4+4).filter(Boolean).length}/4</b></div>${progress(data.readiness.slice(j*4,j*4+4).filter(Boolean).length*25)}</div>`).join('')}</section></div></div>`}
function revenueCalc(){const r=data.revenue;let customers=Math.max(0,+r.base),attach=Math.min(100,Math.max(0,+r.attach))/100,eng=Math.round(customers*attach),ass=eng*(+r.assess),imp=Math.round(eng*.65)*(+r.implement),monthly=Math.round(eng*.55)*(+r.managed),annual=monthly*12,total=ass+imp+annual*(+r.horizon);return{eng,ass,imp,monthly,annual,total}}
function money(n){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n||0)}
function revenue(){const r=data.revenue,x=revenueCalc();return head('COMMERCIAL / SAMPLE MODEL','Revenue opportunity model','Explore an illustrative assessment, implementation and recurring-service commercial scenario. Nothing in this model is HP or Datasec pricing.')+notice('<b>Sample scratchpad only.</b> The assumptions below are fictitious, editable and not tied to the customer register. Figures are AUD illustrative scenario values, not rates or commitments.','amber')+`<div class="split"><div class="card panel"><div class="rowflex"><h2>Scenario assumptions</h2>${chip('Local sample inputs','blue')}</div><div class="form-grid mt20">${[['base','Customer base',1],['attach','Assessment conversion (%)',1],['assess','Sample assessment fee (A$)',100],['implement','Sample implementation fee (A$)',100],['managed','Illustrative service / month (A$)',5]].map(([key,label,step])=>`<div class="form-item"><label class="form-label">${label} ${inf('Demonstration assumption, not approved service pricing.')}</label><input type="number" min="0" step="${step}" class="field" value="${esc(r[key])}" data-revenue="${key}" ${readonly()?'disabled':''}></div>`).join('')}<div class="form-item"><label class="form-label">Time horizon</label><select class="field" data-revenue="horizon" ${readonly()?'disabled':''}>${[1,3,5].map(n=>`<option value="${n}" ${r.horizon==n?'selected':''}>${n} year${n>1?'s':''}</option>`).join('')}</select></div></div><div class="hint mt20">Draft model logic: assessment conversion produces ${x.eng} engagements; 65% of these enter an illustrative implementation; 55% contribute to managed-service run-rate. Production forecasting requires win rates, contract dates, margin and churn.</div><div class="btnrow mt14">${btn('Export model CSV','export-revenue','btn primary')}${btn('Restore scenario assumptions','reset-revenue','btn',readonly()?'disabled':'')}</div></div><div class="stack"><div class="cards4" style="grid-template-columns:repeat(2,1fr);margin:0">${metric('Assessment revenue',money(x.ass),'Sample one-time','clipboard')}${metric('Implementation revenue',money(x.imp),'Sample one-time','briefcase')}${metric('Managed run-rate',money(x.monthly)+'/mo','Sample exit monthly','chart')}${metric('Total, '+r.horizon+' year(s)',money(x.total),'Illustrative sum','dollar')}</div><div class="card panel"><h2>Revenue by service phase</h2><div class="mini-chart">${[['Assess',x.ass],['Implement',x.imp],['Recurring',x.annual*r.horizon]].map(([k,v])=>`<div class="c-col"><b>${money(v)}</b><div class="cbar" style="height:${Math.max(3,Math.round(v/Math.max(1,x.ass,x.imp,x.annual*r.horizon)*165))}px"></div><small>${k}</small></div>`).join('')}</div><p class="smalltext mt20">Scenario recalculates as fields change. Revenue recognition and contract timing are simplified for demonstration.</p></div></div></div>`}
function metrics(){let done=data.customers.filter(c=>assessed(c));return head('MEASUREMENT / INTERNAL','Automation metrics','Proposed telemetry and operator-effort measures for score generation, findings changes and narratives.')+notice('Definitions are proposed and elapsed-time baselines have not been measured. No time savings are claimed.','amber')+`<div class="cards4">${metric('Runs counted',done.length,'Sample customers with ≥8 answers','list')}${metric('Median elapsed time','Not measured','Instrument in live delivery','chart')}${metric('Findings raised',data.customers.reduce((a,c)=>a+findings(c).length,0),'From draft rules','shield')}${metric('Manual baseline','Not supplied','Required for savings claim','briefcase')}</div><section class="card pad"><h2 class="sectiontitle">Each sample assessment</h2><table class="data-table"><thead><tr><th>ASSESSMENT</th><th>ANSWERS</th><th>FINDINGS</th><th>REVIEWED</th><th>PROPOSED TIMING</th></tr></thead><tbody>${data.customers.map((c,i)=>`<tr><td>ORG-${String(i+1).padStart(5,'0')}</td><td>${count(c)} / 16</td><td>${findings(c).length}</td><td>${openFindings(c).length}</td><td>Not measured</td></tr>`).join('')}</tbody></table></section>`}
function attribution(){return head('FINANCIAL / PREVIEW','Attribution (preview)','A planned commercial-attribution view connecting assess, implement and optimise engagements.')+notice('Preview only: no CRM, customer contracts or audited attribution data is connected. No revenue impact can be demonstrated by this prototype.','amber')+`<div class="card panel"><h2>Planned measurement model</h2><div class="phasegrid mt20"><div class="kv"><small>Step 1</small><strong>Engagement source</strong><p class="smalltext">Partner, HP account team or direct customer.</p></div><div class="kv"><small>Step 2</small><strong>Service conversion</strong><p class="smalltext">Assessment to implementation and recurring service.</p></div><div class="kv"><small>Step 3</small><strong>Evidence of value</strong><p class="smalltext">Contract data, recognised revenue and renewal evidence.</p></div></div></div>`}
function resources(){return head('KNOWLEDGE CENTRE','HP Security Services Playbook','Eleven review modules aligned to the guide’s end-to-end playbook approach. Chapter labels beyond those explicitly named in the user guide are proposed navigation headings.',btn('Customer security snapshot →','open-step','btn primary',`data-step="1"`))+notice('The guide documents the Playbook interface, not the full original deck text. Modules below contain practical review summaries and clearly marked placeholders where approved source material is not supplied.','amber')+`<div class="rowflex mb12"><h2 class="sectiontitle">Playbook modules</h2>${chip(`${data.viewed.length} of 11 viewed`,'blue')}</div><div class="module-grid">${MODS.map(([name,summary],i)=>`<div class="module-card"><div class="rowflex"><span class="modnum">MODULE ${String(i+1).padStart(2,'0')} / 11</span>${data.viewed.includes(i)?chip('Viewed','green'):''}</div><h3>${esc(name)}</h3><p>${esc(summary)}</p>${btn('Open module →','open-module','btn soft small',`data-module="${i}"`)}</div>`).join('')}</div>`}
function moduleText(i){const blocks=[['Purpose','Introduce the commercial and technical case for a three-phase print security services programme.'],['What to validate','Audience, HP messaging, supported products, owner responsibilities and service boundaries.'],['Output','A consistent discovery-to-managed-service motion, ready for HP review.']];const m=MODS[i];return head('KNOWLEDGE CENTRE / MODULE '+(i+1),'Module '+(i+1)+': '+m[0],m[1],btn('← All modules','nav','btn',`data-key="resources"`))+notice('Module summary is a review aid, not a replacement for the approved HP Playbook deck.','amber')+`<div class="split"><section class="card panel"><h2>Module overview</h2>${blocks.map(([k,v])=>`<h3 class="mt20">${k}</h3><p class="smalltext">${v}</p>`).join('')}<div class="hint mt20">${i===5?'The 16 customer snapshot questions, weights and resulting recommendations have not been approved by HP.':'Full source deck wording and detailed graphics must be supplied and reviewed before publication.'}</div><div class="btnrow mt20">${i===5?btn('Start customer snapshot','open-step','btn primary',`data-step="1"`):btn('Open sample customer','open-customer','btn primary',`data-id="${current().id}"`)}${btn('Next module →','open-module','btn',`data-module="${Math.min(10,i+1)}"`)}</div></section><section class="card panel"><h3>Related steps</h3>${['Profile','Assessment','Findings','Recommendations','Roadmap','Documents'].map((x,j)=>`<button class="quick-action" data-act="open-step" data-step="${Math.min(8,j)}"><span>${x}</span><span>→</span></button>`).join('')}</section></div>`}
function admin(){return head('SYSTEM / REVIEW MANAGEMENT','Administration','Local design-review settings and feedback. User management, content packages and tenant integrations are not included.')+notice('Reset, erase, external notifications and policy deployment are intentionally unavailable in the review copy.','amber')+`<div class="split"><section class="card panel"><h2>Feedback received (${data.feedback.length})</h2><p class="smalltext">Feedback is saved in this browser only and is not transmitted to anyone.</p>${data.feedback.map(f=>`<div class="finding"><div class="rowflex">${chip(f.kind,'blue')} ${chip('Waiting to be sent','amber')}</div><p>${esc(f.message)}</p><p class="tdsub">${esc(f.date)} · ${esc(f.page)}</p></div>`).join('')||'<div class="empty">No feedback saved in this browser.</div>'}</section><section class="card panel"><h2>Content and connections</h2>${[['Approved control and scoring rules','Not connected'],['HP Security Manager integration','Not connected'],['Customer email delivery','Not connected'],['CRM and quoting','Not connected'],['Content-package administration','Future phase']].map(([k,v])=>`<div class="step-row"><span class="numstep">–</span><div style="flex:1"><b>${k}</b><p>${v}</p></div></div>`).join('')}<div class="hint mt20">This prototype can export/import its local sample workspace as JSON. No administrator can erase external data because no external systems are connected.</div></section></div>`}
function modal(){const m=ui.modal;let title='',body='',foot='';if(m==='new-customer'){title='Register a sample customer';body=`<p class="smalltext">Create a fictional customer workspace to explore the playbook. Do not enter real customer personal data.</p><form id="new-customer-form" class="form-grid mt14"><div class="form-item full"><label class="form-label">Organisation name *</label><input class="field" name="name" required placeholder="Example: Contoso Services (sample)"></div><div class="form-item"><label class="form-label">Industry</label><select class="field" name="industry">${['Manufacturing','Government','Healthcare','Education','Financial services','Transport & logistics','Professional services','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-item"><label class="form-label">Origin / owner</label><select class="field" name="owner"><option>HP account manager</option><option>Reseller / channel partner</option><option>Datasec consultant</option><option>Direct customer enquiry</option></select></div><div class="form-item"><label class="form-label">Printers and MFPs</label><input type="number" min="0" class="field" name="devices" value="0"></div><div class="form-item"><label class="form-label">Sites</label><input type="number" min="0" class="field" name="sites" value="1"></div></form>`;foot=`${btn('Cancel','close-modal')}${btn('Create sample workspace','submit-customer','btn primary')}`}
else if(m==='feedback'){title='Send feedback';body=`<p class="smalltext">Tell Datasec what works, what needs attention or what is missing. Feedback is saved <b>locally only</b> in this prototype.</p><div class="form-item mt14"><label class="form-label">What is it about?</label><select class="field" id="fb-kind"><option>Something does not work</option><option>An idea</option><option>The content</option><option>A question</option></select></div><div class="form-item mt14"><label class="form-label">Your comment (up to 2,000 characters)</label><textarea class="field" maxlength="2000" id="fb-message" placeholder="What would you improve?"></textarea></div><p class="smalltext">Recorded with this page: ${esc(ui.page)}. Do not include confidential or personal details.</p>`;foot=`${btn('Cancel','close-modal')}${btn('Save feedback locally','submit-feedback','btn primary')}`}
else if(m==='followup'){title='Client follow-up · local draft';let qs=QUESTIONS.filter(q=>!current().answers[q.id]);body=`<p class="smalltext">${qs.length} unanswered question(s) for ${esc(current().name)}. A live link cannot be created from this offline prototype; you can record a proposed follow-up for later review.</p><div class="q-list" style="max-height:230px">${qs.map(q=>`<div class="checkline">${esc(q.id)} · ${esc(q.q)}</div>`).join('')||'<p class="smalltext">All questions already answered.</p>'}</div><label class="form-label mt14">Customer contact reference (optional; sample only)</label><input class="field" id="followup-ref" placeholder="E.g. customer IT lead">`;foot=`${btn('Cancel','close-modal')}${btn('Save local follow-up draft','submit-followup','btn primary',qs.length?'':'disabled')}`}
else if(m==='pack'){let labels=['Before the engagement','During the engagement','After completion'];title='Client pack · '+labels[ui.pack||0];body=`<h3>${labels[ui.pack||0]}</h3><p class="smalltext">Customer: ${esc(current().name)}</p><p class="hint">This pack is illustrative and requires customer-specific review. Include an engagement overview, evidence responsibilities, next milestones and clear owner contacts before distributing.</p><p class="smalltext">No correspondence is sent from this prototype. Copy content for offline drafting or print locally.</p>`;foot=`${btn('Close','close-modal')}${btn('Copy pack text','copy-pack','btn primary')}`}
else if(m==='add-action'){title='Add action';body=`<div class="form-item"><label class="form-label">Activity</label><input class="field" id="action-title" placeholder="Describe the action"></div><div class="form-grid mt14"><div><label class="form-label">Owner role</label><input class="field" id="action-owner" value="Security specialist"></div><div><label class="form-label">Due date</label><input class="field" id="action-due" type="date" value="2026-11-30"></div></div>`;foot=`${btn('Cancel','close-modal')}${btn('Save action','submit-action','btn primary')}`}
else if(m==='preview-report'){title='Customer report preview';body=reportMarkup(current(),ui.reportType);foot=`${btn('Close','close-modal')}${btn('Download review HTML','download-report','btn primary')}`}
return `<div class="modal-wrap" id="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${title}</h2>${btn('✕','close-modal','btn icon-btn')}</div><div class="modal-content">${body}</div><div class="modal-footer">${foot}</div></div></div>`}
function navigate(p){ui.page=p;ui.modal=null;if(p==='customer')ui.tab='Overview';if(window.matchMedia('(max-width:860px)').matches)setSidebar(false);render();window.scrollTo(0,0)}
function openCustomer(id,tab='Overview',step=0){if(id)data.current=id;ui.page='customer';ui.tab=tab;ui.step=step;ui.modal=null;ui.findDetail=null;if(window.matchMedia('(max-width:860px)').matches)setSidebar(false);render();window.scrollTo(0,0)}
function openStep(n){openCustomer(current().id,'Assessment journey',n)}
function changeQuestion(n){ui.question=Math.max(0,Math.min(15,n));ui.showNote=false;render()}
function filename(s){return String(s).replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,60)}
function download(name,body,type='text/plain'){const blob=new Blob([body],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function reportDownload(){const c=current(),content=reportMarkup(c,ui.reportType);const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(c.name)} — HP Security Services Review Report</title><style>body{font-family:Segoe UI,Arial,sans-serif;color:#17384e;margin:48px auto;max-width:800px;line-height:1.65}h1,h2{color:#087cbe}.smalltext{font-size:12px;color:#718b9f}.eyebrow{letter-spacing:1px;color:#008ac2;font-size:11px}.report-print{padding:25px}@media print{body{margin:0}}</style></head><body>${content}</body></html>`;download(filename(c.name)+'_'+filename(ui.reportType)+'.html',html,'text/html');notify('HTML review report downloaded. Open it in a browser to print or save as PDF.')}
function exportWorkspace(){download('HPSC_Security_Services_Playbook_Sample_Workspace.json',JSON.stringify(data,null,2),'application/json');notify('Local sample workspace exported as JSON.')}
function eventHandler(e){const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;const id=t.dataset.id;switch(act){case'toggle-sidebar':setSidebar(!sidebarOpen);break;case'close-sidebar':setSidebar(false);break;case'nav':navigate(t.dataset.key);break;case'open-customer':openCustomer(id);break;case'new-customer':safeAction(()=>ui.modal='new-customer');break;case'close-modal':ui.modal=null;render();break;case'customer-tab':ui.tab=t.dataset.tab;ui.findDetail=null;render();break;case'open-step':openStep(+t.dataset.step);break;case'step':ui.step=+t.dataset.step;render();break;case'question':changeQuestion(+t.dataset.question);break;case'prev-question':changeQuestion(ui.question-1);break;case'next-question':changeQuestion(ui.question+1);break;case'toggle-note':ui.showNote=!ui.showNote;render();break;case'answer':safeAction(()=>{const c=current();c.answers[id]=t.dataset.answer;c.approved=c.approved.filter(x=>x!==id);c.updated='25 Oct 2026';c.report=false;c.narrativeApproved=false;c.narrative='';if(c.stage==='New lead')c.stage='Assessment in progress';});break;case'save-note':safeAction(()=>{const el=document.querySelector(`[data-note="${id}"]`);current().notes[id]=el?.value||'';notify('Question note saved locally.')});break;case'approve-finding':safeAction(()=>{let c=current();if(!c.approved.includes(id))c.approved.push(id);c.narrativeApproved=false;c.report=false;ui.findDetail=null;notify('Finding marked reviewed; regenerate the narrative before issuing a report.')});break;case'finding-detail':ui.findDetail=id;ui.tab='Findings';ui.page='customer';render();break;case'clear-finding':ui.findDetail=null;render();break;case'regen-narrative':safeAction(()=>{current().narrative=narrative(current());current().narrativeApproved=false;notify('Narrative draft regenerated from reviewed findings.')});break;case'approve-narrative':safeAction(()=>{if(!openFindings(current()).length){notify('Review at least one finding before approving a customer narrative.');return}current().narrative=narrative(current());current().narrativeApproved=true;notify('Human review simulated: summary marked approved locally.')});break;case'preview-report':ui.modal='preview-report';render();break;case'download-report':reportDownload();break;case'print-report':{const win=window.open('','_blank');if(!win){notify('Allow pop-ups to print the report, or download its HTML file.');break}const c=current();win.document.write(`<html><head><title>Print review report</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:30px auto;line-height:1.6;color:#13384d}h1,h2{color:#087cbe}.smalltext{color:#68849a;font-size:12px}</style></head><body>${reportMarkup(c,ui.reportType)}</body></html>`);win.document.close();win.focus();win.print();break;}case'issue-report':safeAction(()=>{if(!current().narrativeApproved){notify('Approve the narrative before issuing this sample report.');return}current().report=true;current().stage='Report issued';notify('Sample report marked issued locally. No customer delivery occurred.')});break;case'create-followup':safeAction(()=>ui.modal='followup');break;case'task-tab':ui.taskTab=t.dataset.tab;render();break;case'report-type':ui.reportType=t.dataset.type;render();break;case'pack':ui.pack=+t.dataset.pack;ui.modal='pack';render();break;case'copy-pack':{const text='HP Security Services · '+['Before','During','After'][ui.pack]+' the engagement — '+current().name+'\nReview-only placeholder. Confirm engagement scope, evidence requests, milestones and responsible contacts.';navigator.clipboard?.writeText(text).then(()=>notify('Pack placeholder copied.'),()=>notify('Clipboard unavailable in this browser.'));break;}case'coach-select':ui.coach=+t.dataset.coach;render();break;case'coach-prev':ui.coach=(ui.coach+COACH.length-1)%COACH.length;render();break;case'coach-next':ui.coach=(ui.coach+1)%COACH.length;render();break;case'engagement-next':{let c=data.customers.find(x=>x.id===id);openCustomer(id,'Assessment journey',count(c)<16?1:!c.narrativeApproved?5:c.report?7:6);break}case'filter-stage':ui.stage=t.dataset.stage;render();break;case'open-offer':ui.offer=+t.dataset.offer;ui.page='offers';render();window.scrollTo(0,0);break;case'open-module':{let n=+t.dataset.module;ui.module=n;if(!data.viewed.includes(n)){data.viewed.push(n);save()}ui.page='module';render();window.scrollTo(0,0);break;}case'export':exportWorkspace();break;case'import':document.getElementById('import-input')?.click();break;case'feedback':ui.modal='feedback';render();break;case'submit-feedback':{let message=document.getElementById('fb-message')?.value.trim()||'';if(!message){notify('Write a comment before saving feedback.');break}data.feedback.unshift({kind:document.getElementById('fb-kind').value,message,date:new Date().toLocaleString('en-AU'),page:ui.page});ui.modal=null;save();render();notify('Feedback saved locally; not sent.');break;}case'submit-customer':{const form=document.getElementById('new-customer-form');if(!form?.reportValidity())break;safeAction(()=>{const fd=new FormData(form);let n=String(fd.get('name')).trim();const idNew='sample'+Date.now();data.customers.unshift({id:idNew,name:n,industry:fd.get('industry'),staff:0,sites:Math.max(0,+(fd.get('sites')||0)),devices:Math.max(0,+(fd.get('devices')||0)),status:'Prospect',stage:'New lead',owner:fd.get('owner'),answers:{},approved:[],report:false,narrativeApproved:false,notes:{},tasks:{},engagement:false,updated:'25 Oct 2026'});data.current=idNew;ui.modal=null;ui.page='customer';ui.tab='Overview';notify('Sample customer workspace created locally.')});break;}case'submit-followup':safeAction(()=>{data.followups.push({customer:current().id,count:16-count(current()),contact:document.getElementById('followup-ref').value||'Unspecified',date:new Date().toISOString(),status:'Local draft only'});ui.modal=null;notify('Local follow-up draft saved. No external link or email was sent.')});break;case'add-action':safeAction(()=>ui.modal='add-action');break;case'submit-action':{const n tted retention.</div>${btn('Open assessment results','nav','btn primary',`data-key="c-assessments"`)}</div></div>`}

function customerFindings(){const c=current(),fs=reviewedGaps(c);return head('CUSTOMER SECURITY / FINDINGS','Reviewed risks & gap analysis','Approved assessment findings are presented with priority, traceability and practical next steps.')+customerBanner()+notice('Only findings marked reviewed in the consultant workspace are published here. A No answer does not become a customer-facing confirmed finding until reviewed.','')+`<div class="cards4">${metric('Reviewed findings',fs.length,'Accepted in sample workspace','clipboard')}${metric('High priority',fs.filter(f=>f.risk==='High').length,'Includes verification items if approved','shield')}${metric('Unknown answers',verificationCount(c),'Do not treat as proven control gaps','users')}${metric('Definitive responses',securityStats(c).verifiedAnswers+'/16','Assessment response coverage','list')}</div><div class="summary-columns"><div class="card panel"><h2>Security finding register</h2>${fs.length?fs.map(f=>`<article class="finding-public ${f.risk.toLowerCase()}"><div class="btnrow">${chip(f.risk.toUpperCase(),f.risk==='High'?'red':'amber')}${chip(f.when,'blue')}${chip(f.answer==='Unsure'?'Evidence required':'Reviewed gap',f.answer==='Unsure'?'amber':'red')}</div><h3>${esc(f.finding)}</h3><p><b>Recorded response:</b> ${esc(f.answer)} · <b>Traceable to:</b> ${esc(f.id)}</p><p><b>Proposed action:</b> ${esc(f.action)}</p><p><b>Framework relevance:</b> ISO/IEC 27001:2022 ${FMW[f.id].iso} · ${FMW[f.id].nist}</p><p><b>Evidence to verify:</b> ${FMW[f.id].evidence}</p></article>`).join(''):'<p class="smalltext">No findings have been approved for customer release. Continue the consultant assessment and finding review workflow.</p>'}</div><div class="card panel"><h2>Reading the findings</h2><ul class="clean-data"><li><b>Reviewed gap:</b> the draft rule has been accepted by a reviewer, not necessarily independently verified on-device</li><li><b>Evidence required:</b> the control cannot yet be confirmed</li><li><b>Severity:</b> indicative prioritisation pending customer context and risk acceptance</li><li><b>Alignment:</b> an ISO/NIST mapping does not establish standards compliance</li></ul><div class="v12-actions">${btn('View mapped controls','nav','btn primary',`data-key="c-controls"`)}${btn('Roadmap','nav','btn',`data-key="c-roadmap"`)}</div></div></div>`}

${q.id}</b> · ${esc(m.control)}<div class="tdsub">${esc(q.group)}</div></td><td>${chip(st.label,st.tone)}</td><td>${esc(m.iso)}</td><td>${esc(m.nist)}</td><td>${pending?'Await consultant review before customer finding is published':esc(m.evidence)}</td></tr>`}).join('')||'<tr><td colspan="5">No matching controls for this filter.</td></tr>'}</tbody></table></div><div class="kpi-note mt14">Mappings link security objectives to assessment evidence requirements. Printer applicability varies by HP model, firmware and deployment. CIS references and HP/HPSM suggestions are draft practitioner guidance, not audited implementation claims.</div></section>`}

function isGroupExpanded(group,workspace=data.workspace){return expandedGroups[groupKey(group,workspace)]!==false;}
function persistGroupState(){try{localStorage.setItem(GROUP_STATE_STORAGE,JSON.stringify(expandedGroups))}catch(_){}}
const navChevron='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function groupButton(group,groupId,active){const opened=isGroupExpanded(group);return `<button type="button" class="nav-section nav-accordion-trigger ${active?'has-active':''}" data-act="toggle-nav-group" data-nav-group="${esc(group)}" aria-controls="${groupId}" aria-expanded="${opened}" title="${opened?'Collapse':'Expand'} ${esc(group.toLowerCase())}"><span>${esc(group)}</span><span class="nav-accordion-chevron">${navChevron}</span></button>`;}
menu=function(){const isC=data.workspace==='customer',sections=MENU_SPEC[isC?'customer':'partner'];const approved=isC?customerPages:MENU_ALLOWED[data.role]||MENU_ALLOWED.Partner;
return `<div class="side-mode">${isC?'CUSTOMER SECURITY':'PARTNER ENABLEMENT'}<small>${isC?'Posture, evidence & remediation':'Readiness, delivery & revenue'}</small></div>`+
 sections.map(([group,items],index)=>{
  const use=items.filter(([p])=>approved.includes(p));if(!use.length)return '';
  const panelId='sidebar-group-'+(isC?'customer':'partner')+'-'+index;
  const active=use.some(([p])=>ui.page===p||p==='resources'&&ui.page==='module');
  return `${groupButton(group,panelId,active)}<div class="nav-accordion-panel" id="${panelId}" ${isGroupExpanded(group)?'':'hidden'}>${use.map(([p,t,icon])=>`<button class="nav-item ${ui.page===p||p==='resources'&&ui.page==='module'?'active':''}" data-act="nav" data-key="${p}" title="${esc(t)}" aria-current="${ui.page===p?'page':'false'}">${ico(icon)}<span>${esc(t)}</span></button>`).join('')}</div>`;
 }).join('')};

crumb=function(){const custom={'c-dashboard':'Security overview','c-fleet':'Fleet & devices','c-assessments':'Assessments','c-findings':'Gaps & findings','c-controls':'Control alignment','c-roadmap':'Remediation','c-reports':'Reports & evidence','c-assurance':'Continuous assurance','p-readiness':'Partner readiness','p-training':'Learning pathway','p-packages':'Service packages'};return custom[ui.page]||crumbV11()};
dashboard=function(){return partnerHome()};
page=function(){if(data.role==='Customer'&&data.workspace!=='customer'){data.workspace='customer';ui.page='c-dashboard'}if(data.workspace==='customer'){if(!customerPages.includes(ui.page)){ui.page='c-dashboard'}const customerRoutes={'c-dashboard':customerHome,'c-fleet':customerFleet,'c-assessments':customerAssessment,'c-findings':customerFindings,'c-controls':customerControls,'c-roadmap':customerRoadmap,'c-reports':customerReports,'c-assurance':customerAssurance};return customerRoutes[ui.page]()}if(customerPages.includes(ui.page))ui.page='dashboard';if(!((MENU_ALLOWED[data.role]||MENU_ALLOWED.Partner).includes(ui.page)||['customer','module','assessments'].includes(ui.page))){ui.page='dashboard'}const partnerRoutes={'p-readiness':partnerReadiness,'p-training':partnerTraining,'p-packages':partnerPackages};return partnerRoutes[ui.page]?partnerRoutes[ui.page]():pageV11()};
function decorateShell(){const app=document.querySelector('.app');if(!app)return;app.classList.toggle('cust-only',data.role==='Customer');const top=document.querySelector('.top-actions');if(top){const role=top.querySelector('[data-change="role"]');if(role&&!role.querySelector('[value="Customer"]')){const o=document.createElement('option');o.value='Customer';o.textContent='Customer';role.append(o)}if(role){role.title='Review-only role selector. Not live authentication.';role.value=data.role;}const switcher=document.createElement('div');switcher.className='workspace-switch';switcher.setAttribute('role','group');switcher.setAttribute('aria-label','Choose workspace experience');switcher.innerHTML=`<button type="button" data-act="switch-workspace" data-view="partner" class="${data.workspace==='partner'?'active':''}" aria-pressed="${data.workspace==='partner'}" ${data.role==='Customer'?'disabled title="Customer reviewer cannot open partner commercial workspace"':''}>${ico('briefcase',14)} Partner</button><button type="button" data-act="switch-workspace" data-view="customer" class="${data.workspace==='customer'?'active':''}" aria-pressed="${data.workspace==='customer'}">${ico('shield',14)} Customer</button>`;const start=top.querySelector('.pill');if(start)start.insertAdjacentElement('afterend',switcher);else top.prepend(switcher);const custselect=top.querySelector('[data-change="customer"]');if(custselect){custselect.style.display=data.role==='Customer'?'none':'';custselect.title='Choose a fictional demonstration customer';if(data.workspace==='customer')custselect.value=data.current}const create=top.querySelector('[data-act="new-customer"]');if(create)create.style.display=data.workspace==='customer'?'none':'';const rolelabel=top.querySelector('#role-select');if(rolelabel)rolelabel.setAttribute('aria-label','Review role (demonstration only)')}const brand=app.querySelector('.sidebar-version');if(brand)brand.textContent='HPSC · Security Services Playbook v1.2 · Design prototype';const context=document.querySelector('.top-title small');if(context)context.textContent=`HP SECURITY SERVICES / ${data.workspace==='partner'?'PARTNER':'CUSTOMER'} / ${crumb().toUpperCase()}`;const tools=app.querySelector('.sidebar-bottom');if(tools&&data.workspace==='customer'){const q=tools.querySelectorAll('.side-tool');q.forEach(el=>el.style.display='none');const toolHeader=tools.querySelector('.nav-section');if(toolHeader)toolHeader.style.display='none';const info=tools.querySelector('.side-info');if(info)info.innerHTML='<b>Customer review workspace</b><p>Read-only sample experience. No tenant or live device connections. Role selection is for demonstration only.</p>'}}
render=function(){renderV11();decorateShell()};
function changeWorkspace(view){if(view==='partner'&&data.role==='Customer'){notify('The Customer role cannot access partner commercial content. Change the demonstration role to preview partner mode.');return}data.workspace=view;ui.page=view==='partner'?'dashboard':'c-dashboard';ui.modal=null;ui.controlFilter='All';try{localStorage.setItem(VIEW_STORE,view)}catch(_){}if(window.matchMedia('(max-width:860px)').matches)setSidebar(false);render();window.scrollTo(0,0)}
const clickHandlerV12=function(e){const t=e.target.closest('[data-act]');if(!t)return;switch(t.dataset.act){case'switch-workspace':changeWorkspace(t.dataset.view);return;case'nav':if(customerPages.includes(t.dataset.key)&&data.workspace==='partner'){changeWorkspace('customer');ui.page=t.dataset.key;render();return}clickV11(e);return;case'select-tier':if(readonly()){notify('This is a view-only role.');return}data.tier=t.dataset.tier;save();render();return;case'save-remediation':{if(readonly()||data.workspace!=='partner'){notify('Action changes require partner or consultant access.');return}const id=t.dataset.id;const obj={};document.querySelectorAll('[data-remediation][data-id=\"'+id+'\"]').forEach(el=>obj[el.dataset.remediation]=el.value);if(obj.status==='Verified complete'&&!(obj.evidence||'').trim()){notify('Add an evidence reference before marking an action verified complete.');return}if(!data.remediation[current().id])data.remediation[current().id]={};data.remediation[current().id][id]=obj;save();render();notify('Sample remediation action updated locally.');return;}case'export-scope':scopeExport();return;case'export-public-report':publicExport();return;case'preview-public-report':if(!current().report||!current().narrativeApproved){notify('No customer report is available for release.');return}ui.modal='public-report';render();return;default:if(data.workspace==='customer'&&(t.dataset.act==='nav')&&!customerPages.includes(t.dataset.key)){notify('This page belongs to the partner workspace.');return}if(data.role==='Customer'&&['new-customer','import','export','open-step','issue-report','approve-finding','regen-narrative','download-report','open-module','open-customer','add-action','approve-narrative'].includes(t.dataset.act)){notify('Customer access is limited to customer-ready security views.');return}clickV11(e)}};
eventHandler=clickHandlerV12;
changeHandler=function(e){const t=e.target;if(t.dataset.change==='role'){data.role=t.value;data.workspace=data.role==='Customer'?'customer':'partner';ui.page=data.workspace==='partner'?'dashboard':'c-dashboard';ui.modal=null;save();try{localStorage.setItem(VIEW_STORE,data.workspace)}catch(_){}render();return}if(t.dataset.change==='control-filter'){ui.controlFilter=t.value;render();return}if(t.dataset.change==='customer'&&data.workspace==='customer'){data.current=t.value||data.current;save();ui.page='c-dashboard';render();return}changeV11(e)};
modal=function(){if(ui.modal==='public-report'){return `<div class="modal-wrap" id="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="Customer security report"><div class="modal-header"><h2>Customer security review · Issued sample</h2>${btn('✕','close-modal','btn icon-btn')}</div><div class="modal-content">${publicReportHTML(current())}</div><div class="modal-footer">${btn('Close','close-modal')}${btn('Export report HTML','export-public-report','btn primary')}</div></div></div>`}return modalV11()};
// Keep v1.1 local JSON compatible while enriching v1.2 workspace state.


/* White/blue style comparison. This changes colours only, not menu content or routing. */
const STYLE_REVIEW_STORAGE='hp-security-playbook-v12-sidebar-review';
let sidebarPreviewStyle='white';
try{const v=localStorage.getItem(STYLE_REVIEW_STORAGE);if(v==='blue'||v==='white')sidebarPreviewStyle=v}catch(_){}
const renderOriginalSidebarReview=render;
render=function(){
 renderOriginalSidebarReview();
 const app=document.querySelector('.app');
 if(!app)return;
 app.classList.toggle('sidebar-white',sidebarPreviewStyle==='white');
 const actions=app.querySelector('.top-actions');
 if(actions){
  const compare=document.createElement('button');
  compare.type='button';compare.className='sidebar-compare';
  compare.setAttribute('data-act','sidebar-colour-compare');
  compare.setAttribute('aria-label','Switch sidebar colour between white and blue for review');
  compare.setAttribute('aria-pressed',String(sidebarPreviewStyle==='white'));
  compare.setAttribute('title','Only the sidebar colour changes; original menu labels and sections remain');
  compare.innerHTML='<span class="compare-dot" aria-hidden="true"></span>Sidebar: '+(sidebarPreviewStyle==='white'?'White':'Blue')+' <span aria-hidden="true">⇄</span>';
  actions.append(compare);
 }
};
/* Use capture to isolate the preview control from the pre-existing application actions. */
document.addEventListener('click',function(e){
 const control=e.target.closest('[data-act="sidebar-colour-compare"]');
 if(!control)return;
 e.preventDefault();e.stopImmediatePropagation();
 sidebarPreviewStyle=sidebarPreviewStyle==='white'?'blue':'white';
 try{localStorage.setItem(STYLE_REVIEW_STORAGE,sidebarPreviewStyle)}catch(_){}
 const app=document.querySelector('.app');
 if(app)app.classList.toggle('sidebar-white',sidebarPreviewStyle==='white');
 control.setAttribute('aria-pressed',String(sidebarPreviewStyle==='white'));
 control.innerHTML='<span class="compare-dot" aria-hidden="true"></span>Sidebar: '+(sidebarPreviewStyle==='white'?'White':'Blue')+' <span aria-hidden="true">⇄</span>';
},true);


// Stop the underlying app's delegated click handler from treating a section heading as page navigation.
document.addEventListener('click',function(e){
 const t=e.target.closest('[data-act="toggle-nav-group"]');
 if(!t)return;
 e.preventDefault();e.stopImmediatePropagation();
 const group=t.dataset.navGroup;
 const expanded=t.getAttribute('aria-expanded')!=='true';
 expandedGroups[groupKey(group)]=expanded;
 persistGroupState();
 t.setAttribute('aria-expanded',String(expanded));
 t.setAttribute('title',(expanded?'Collapse ':'Expand ')+group.toLowerCase());
 const panel=document.getElementById(t.getAttribute('aria-controls'));
 if(panel)panel.hidden=!expanded;
},true);

document.addEventListener('click',eventHandler);document.addEventListener('change',changeHandler);document.addEventListener('input',e=>{if(e.target.dataset.input==='search'){const val=e.target.value;const start=e.target.selectionStart;ui.search=val;const section=e.target.closest('.card');const temp=document.createElement('div');temp.innerHTML=customerTable(ui.page==='dashboard');const existing=section?.querySelector('.tablewrap');if(existing)existing.replaceWith(temp.firstElementChild);}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}else if(e.key==='Escape'&&sidebarOpen&&window.matchMedia('(max-width:860px)').matches){setSidebar(false);document.querySelector('.sidebar-toggle')?.focus()}});
render();
</script></body></html>
