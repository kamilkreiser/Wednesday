#   KS-1439: prior pin 4.29.3 (KS-1408); 4.29.4 is a fixes-only patch (35 entries, none marked breaking).
#   KS-1408: prior pin 4.28.0 (KS-1353). 4.29.0 changed exit codes (nothing tested -> 2, Ctrl+C -> 130)
#   and added the `wfc` report format; both are now consumed (src/sweep_outcome.py, harness reports).
#   KS-684: this header lagged at 4.24.2 against a 4.24.3 pin — the same drift KS-495 fixed on
#   2026-07-24, recurred. It is now stated as the EXACT pin, so a floor bump cannot silently
