# -----------------------------------------------------------------------------
# Integrations that 503 by design when their provider is unconfigured (local/dev
# has no M365 license, no billing provider, no VC signing key, no Cardano
# anchoring). The 503 is declared and carries setup instructions;
# not_a_server_error would red every local run because it cannot tell that
# expected 503 from a genuine 500/502/504.
#
# KS-1170 (2026-09-15) — HOW the exception is expressed changed; WHAT is excepted
# did not. These entries used to read `checks.not_a_server_error.enabled = false`.
# Schemathesis 4.26.1 made an explicit `--checks` list (which every profile in
# config/schemathesis_tests.yaml passes) mark the check EXPLICITLY ENABLED, and
# that marker wins over a per-operation `enabled = false` (config/_checks.py
# `from_hierarchy`, read on 4.27.1). From the KS-1169 bump every one of these
# lines was dead and the declared 503s redded 14 pairs of noise per sweep.
# Per-operation `expected-statuses` is an ordinary field merged operation-first
# and SURVIVES the explicit list — proven offline against the installed library
# by tests/functional/config/test_not_a_server_error_suppression.py, which drives
# the real CLI with the real argv and this real file.
#
# WHY expected-statuses and not a filter hook (the alternative KS-1170 named):
#   1. It is this file's established mechanism — ~25 entries already tolerate a
#      ruled status this way for positive_data_acceptance / negative_data_rejection,
#      and the KS-662 ruling (Kam, 2026-08-25) fixed the honest shape: the
#      tolerance names ONE status on ONE operation, and a guard classifies what
#      the tolerance is not meant to cover. `integration_5xx_guard` is that guard.
#   2. It is NARROWER than the old disable. `enabled = false` silenced every 5xx
#      on the operation and left the guard alone to notice a 500; now
#      not_a_server_error itself still fails a 500/502/504 here. Kamil's own
#      wording on KS-693 (2026-08-27) asked for exactly this: "scoped … to the
#      503-when-unconfigured case only — never a blanket 5xx tolerance."
#   3. Both checks can still fail on these operations — the built-in on any
#      non-declared 5xx, the guard on a 503 whose body is not the declared
#      SERVICE_UNAVAILABLE envelope. A raw 500 is therefore reported TWICE (check
#      + guard). That is deliberate: a genuine server error on a by-design
#      operation should be loud, not filtered back to one row post hoc.
#   4. The one weakness — if the guards were ever silently unselected again this
#      would tolerate ANY 503 body — is what the KS-1170 offline tripwires close:
#      harness.custom_checks in the yaml is pinned to the registered guards in
#      both directions, every profile's argv is asserted to name them, and the
#      functional guard above reds if a guard records nothing.
#
# KS-268: the genuine-500 blind spot the tolerance opens is closed at the harness
# by the `integration_5xx_guard` custom check (config/checks.py) — for these
# operations it passes the declared 503 SERVICE_UNAVAILABLE envelope (and any
# non-5xx) but fails every other 5xx.
#
# KS-499: extends the original three GET reads with seven WRITE ops across three
# provider classes — billing (Stripe), VC signing (VC_SIGNING_KEY), and Cardano
# anchoring. They were unmasked after the KS-428 CSRF-guard fix let write probes
# through and redded not_a_server_error on every full sweep. The include-name
# must match the spec path template verbatim (mind the mixed {id} vs {customerId}
# param names) and stay in lockstep with _UNCONFIGURED_503_OPS in config/checks.py.
# To hold an op to the default again: seed that provider's local config, verify
# green, then remove its entry here AND from the guard's set.
# -----------------------------------------------------------------------------
[[operations]]
include-name = "GET /api/billing/customers/{customerId}/payment-methods"
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

