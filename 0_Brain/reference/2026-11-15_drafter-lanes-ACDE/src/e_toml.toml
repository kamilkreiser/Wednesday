# =============================================================================
# Schemathesis check configuration (KS-255)
# =============================================================================
# Auto-discovered by the schemathesis CLI from the working directory.
#
# Why this file exists: `positive_data_acceptance` and `negative_data_rejection`
# do NOT consult the OpenAPI spec's declared responses — each has its own
# expected-statuses list (defaults: positive = 2xx,401,403,404,409,5xx;
# negative = 400,401,403,404,405,406,409,422,428,5xx). Declaring a status in
# the spec therefore cannot clear these checks; it must be expected here.
#
# Policy (KS-255, agreed direction from the 2026-06-11 review thread):
# - 429 is expected globally for both checks. Every targeted endpoint declares
#   429 (x-ratelimit-* extensions); a rate-limited probe says nothing about
#   whether the data would have been accepted or rejected.
# - Per-operation 400/422 additions are ONLY for endpoints whose schema-valid
#   inputs are semantically unresolvable by construction (random OAuth client
#   ids, unsigned wallet payloads, unverifiable Stripe HMACs, weak passwords).
#   These cannot be fixed by schema tightening: KS-255 round 1 (#240) tried
#   minLength/pattern tightening and it regressed negative_data_rejection
#   (reverted in #248) — the runtime accept-set is not regex-expressible.
# Evidence for every entry: 2026-06-12 local full run, seed in the run log
# (output/reports/test-run-20260612_095819.log).
#
# -----------------------------------------------------------------------------
# WHERE EACH KIND OF SETTING LIVES (KS-544) — read this before moving anything.
# Three files configure the sweep. They are not interchangeable: putting a setting
# in the wrong one either silently does nothing, or applies far too widely.
#
#   1. THIS FILE (schemathesis.toml) — settings Schemathesis reads itself, and the
#      ONLY place a setting can be scoped to a single operation, via [[operations]]
#      include-name. Use it for anything that should affect ONE endpoint: check
#      expected-statuses, a per-operation generation budget, per-operation timeouts.
#      Auto-discovered from the working directory; no CLI flag involved.
#
#   2. config/schemathesis_tests.yaml — the harness's own configuration: profiles,
#      check/phase sets, and the harness.execution / harness.generation blocks that
#      become CLI flags. RUN-LEVEL only. Every value carries its reason, and flags
#      deliberately NOT passed are listed under harness.deliberately_unused_flags
#      with a reason each, so an absent flag is documented rather than forgotten.
#
#   3. scripts/runner/args_builder.py — turns (2) into the argv. Its module
#      docstring records why each flag is or is not emitted. Nothing belongs
#      hard-coded there that could live in (2).
#
# The rule that decides between them (systemTest/CLAUDE.md -> "The gate must be
# TRUTHFUL — never blanket-suppress a signal"): scope a relaxation to the SMALLEST
# thing that needs it, because a run-level switch silences the signal for all 318
# operations. Worked example: the global `--suppress-health-check filter_too_much`
# was removed in KS-544 and replaced by the per-operation generation budget at the
# bottom of this file — Schemathesis's suppress-health-check is root-only and cannot
# be scoped, whereas [[operations]] generation.max-examples can.
# -----------------------------------------------------------------------------
# =============================================================================

# -----------------------------------------------------------------------------
# KS-226: fail the run on the "method_not_allowed" warning instead of relying on
# a hand-maintained skip-count allowlist. Schemathesis maintains a persistent
# cross-run cache (.schemathesis/<project-slug>/cache/) of operations that
# consistently return 405 and skips them in later phases with this warning;
# failing on it turns a silent skip into a hard CI signal, self-correcting as
# the cache observes real API behaviour. Mirrors config/schemathesis_tests.yaml
# harness.warnings.fail_on — keep both in sync.
# -----------------------------------------------------------------------------
# KS-684: `unmatched_filter` ADOPTED (new in Schemathesis 4.25.0). Prior behaviour: absent,
# because the warning did not exist. 4.25.0 reports filter expressions that match no API
# operations, with the closest match as a suggestion.
#
# WHY IT EARNS `fail-on` HERE SPECIFICALLY: our profiles filter heavily, so a filter expression
# matching ZERO operations is silent coverage loss — the run reports success having tested less
# than it was asked to, which is the same shape as KS-517 (masking by loss of reach) and the
# skip-count class KS-226 exists for. A typo'd or stale filter is exactly the sort of drift that
# survives review because nothing goes red.
#
# CONFIRMED SAFE BEFORE ENABLING: two full `pre-merge` sweeps on 2026-08-25 (12,527 and 13,296
# cases) produced ZERO unmatched_filter warnings against the current filter set, so turning this
# into a failure does not red an already-correct configuration.
# -----------------------------------------------------------------------------
# KS-1169: `unresolvable_reference` ADOPTED as fatal; `base_url_mismatch` classified INFORMATIONAL
# (both new in Schemathesis 4.26.0; accepted in `[warnings]` since 4.26.1). Prior behaviour:
# absent, because neither warning existed on 4.25.2. TestAllInstalledWarningsAreAccountedFor
# (KS-684) caught both on the 4.25.2 → 4.27.1 bump, as designed — a new warning is a decision.
#
# WHY `unresolvable_reference` EARNS `fail-on`: parameters/responses were SKIPPED over a missing
# schema component. Our spec is generated (`npm run generate-openapi`), so a dangling `$ref` is spec
# drift that would otherwise shrink coverage without going red — the unmatched_filter shape.
# CONFIRMED SAFE BEFORE ENABLING: the KS-1169 `full` sweep on 4.27.1 (2026-09-14, slot 2, 341 ops
# tested) raised it on ZERO operations, so making it fatal reds nothing that is correct today.
#
# WHY `base_url_mismatch` IS NOT FATAL — measured, not assumed: it is Schemathesis's heuristic for
# "every response was 404, maybe --url lacks the base path". On the same sweep it fired on 73
# operations — the SAME 404-only set `missing_test_data` names (non-existent-id probes, the KS-478
# precondition class) — while the auth-coverage gate proved 341/342 operations reached past auth,
# i.e. the URL was right. For this spec it is a false positive that would red every run, so it is
# accounted for in TestAllInstalledWarningsAreAccountedFor.INFORMATIONAL instead, with the reason.
#
# WHY `timeout_units` EARNS `fail-on` (KS-1607, Schemathesis 4.31.0): it fires only when
# `--request-timeout` or `max_response_time` is 1000 or more — almost certainly milliseconds where
# Schemathesis takes seconds, i.e. a run configured to wait ~17 minutes per request. That is a harness
# misconfiguration, never a platform finding, so the run should stop rather than sweep with it. It
# CANNOT red a correct run today: harness.request_timeout_seconds is 10 and max_response_time is 5.
# Upstream applies a fatal startup warning at engine finish (WarningCollector.on_startup_warning), so
# "fatal" FAILS the run without STOPPING it: every remaining test still executes (Peter's ruling,
# KS-1607, 2026-10-19 — fatal, but the rest of the run must complete). Pinned by
# test_dictionary_and_timeout_warnings_reach_every_surface.py::test_fatal_does_not_stop_the_run_every_test_still_executes.
# Timeouts stay as they are (Peter agreed 2026-10-19): request-timeout 10 s, max_response_time 5 s.
# `dictionary_mismatch` (also 4.31.0) is INFORMATIONAL — reason in the compat test. Prior behaviour:
# neither warning existed on 4.30.1, so neither was listed.
[warnings]
fail-on = ["method_not_allowed", "unmatched_filter", "unresolvable_reference", "timeout_units"]

# -----------------------------------------------------------------------------
# KS-406 (decision, Kam 2026-07-08): the platform's auth middleware runs before
# routing, so an HTTP method an endpoint does not declare answers 401 (auth-first)
# rather than RFC 9110's 405 + Allow. That posture is INTENDED — it avoids
# revealing the method surface to unauthenticated callers. The coverage phase's
# unexpected-method probes would therefore fail `unsupported_method` on every
# authenticated route by design (228 findings = 100% of the 2026-07-07 sweep's
# failures), so we stop generating those probes rather than asserting a 405 the
# platform deliberately does not send. Everything else about the coverage phase
# stays on. Pinned by tests/unit/test_coverage_unexpected_methods.py; the
# `unsupported_method` check stays configured (harmless without probes) so the
# checks-compatibility coverage of installed check names is unaffected.
# -----------------------------------------------------------------------------
[phases.coverage]
unexpected-methods = []

[checks.positive_data_acceptance]
# defaults + 429 (declared rate limits). KS-1353: register is 100/hr/ip on every local and non-prod
# stack the sweeps run against, and 5/hr/ip only in production —
# `api-gateway/src/index.ts`: REGISTER_RATE_LIMIT || (isNonProd ? '100' : '5'). Prior text said
# "5/hr" alone, the production figure, which no sweep here ever meets. Measured on slot 3,
# 2026-09-28: `RateLimit-Policy: 100;w=3600`.
expected-statuses = ["2xx", "401", "403", "404", "409", "429", "5xx"]

[checks.negative_data_rejection]
# defaults + 429 (a rate-limited negative probe was still not accepted)
expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "422", "428", "429", "5xx"]

# -----------------------------------------------------------------------------
# Auth — login: a schema-valid body can legitimately 400. The email field is
# `format: email` in the spec but validated at runtime with Zod `.email()`,
# which is stricter — it rejects some format:email-valid addresses (e.g.
# `%@r.lr`, `~rD@…`, `DSmJmbH_&%@…`). Schemathesis can generate such an address
# as a POSITIVE case, and the runtime correctly returns 400 VALIDATION_ERROR
# ("email: Invalid email"). The KS-285 custom `email` format strategy reduces
# this in the fuzzing phase, but it is a hypothesis strategy (hook-load- and
# version-dependent) and proved not to be a complete guarantee — KS-356 recurred
# on a 4.21.10 full run despite it. Tightening the spec's email `pattern` is the
# #240/#248 trap (regresses negative_data_rejection — see lines 16-21), so the
# durable, phase-agnostic fix is this expected-statuses exception. The runtime
# email accept-set is not spec-expressible without that regression.
# Verified 2026-06-30 (schemathesis 4.21.10, live local auth): the fuzzing phase
# emits Zod-invalid emails as positive cases (VCR), the runtime 400s them (curl),
# and schemathesis resolves login's expected-statuses to include 400. (NB the
# coverage phase emits a Zod-VALID `0@a.com`, so it is NOT the source.) register
# + forgot-password share this (same `email` validation) — see
# known-issues-and-baseline.md (KS-356 note).
# -----------------------------------------------------------------------------
[[operations]]
include-name = "POST /api/auth/login"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

# -----------------------------------------------------------------------------
# Auth — password endpoints: weak password is a documented 422 (ValidationError
# per the auth error convention, checked at runtime by checkPasswordStrength —
# minLength 12 + 3-of-4 character classes + score; not regex-expressible).
# -----------------------------------------------------------------------------
[[operations]]
include-name = "POST /api/auth/register"
# 400: a schema-compliant positive case can legitimately 400 — both from the
# stricter runtime Zod `.email()` (see the login note above) and from the runtime
# rejecting extra unknown body properties Schemathesis injects (additionalProperties
# → 400 VALIDATION_ERROR). Same exception as login; do NOT tighten the spec
# (additionalProperties:false is the #240/#248 trap that regresses negative_data_
# rejection). 422 stays: weak password is a documented ValidationError. KS-362.
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "422", "429", "5xx"]

[[operations]]
include-name = "POST /api/auth/forgot-password"
# 400: same email-validation + additional-properties rejection as register/login.
# No 422 here — forgot-password takes only an email (no password-strength check).
# KS-362 (sibling of KS-356).
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

[[operations]]
include-name = "POST /api/auth/reset-password"
# 422 weak password (checked before token lookup); 400 expired token;
# 404 invalid/used token — all legitimate outcomes for schema-valid bodies.
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "422", "429", "5xx"]

[[operations]]
include-name = "POST /api/auth/mfa/verify"
# KS-622: this operation is RETIRED. It answers 410 Gone unconditionally — backup-code
# redemption moved to POST /api/auth/login, where the password is verified before the
# code is read. The old rationale here ("generated userId/code pairs never correspond
# to a real pending MFA session") described the live handler and is no longer true:
# there is no session lookup left to miss.
#
# 410 must be listed explicitly. Neither positive_data_acceptance nor
# negative_data_rejection consults the spec — both raise purely on
# `status_code not in allowed_statuses` — and `deprecated: true` does not exempt the
# operation, because exclude_deprecated is deliberately false and pinned by
# test_deprecated_operations_are_not_excluded. The pre-merge and auth-rate-limited
# profiles both reach /api/auth/, so without 410 here they go red on every run.
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "410", "429", "5xx"]
# The global negative list (lines 88-90) VERBATIM, plus 410 — a per-operation
# expected-statuses REPLACES the global one rather than extending it, so
# 405/406/428/5xx have to be restated here or this operation would silently
# become stricter than every other one for reasons unrelated to KS-622.
checks.negative_data_rejection.expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "410", "422", "428", "429", "5xx"]

