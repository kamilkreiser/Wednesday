# -----------------------------------------------------------------------------
# Webhook / Teams URL fields — SSRF guard (KS-487 B-1 + B-2).
#
# `url` and `webhookUrl` are declared `type: string, format: uri` with no
# pattern, so the positive generator legitimately emits spec-valid URIs the
# runtime must now refuse: `http://` (https-only), single-label and `.internal`
# hosts, IPv4/IPv6 literals in private, loopback and link-local ranges, and —
# since the guard resolves DNS — any host whose A/AAAA records point inside the
# perimeter. Every one of those is a **correct** 400, so without this exception
# `positive_data_acceptance` floods on three operations.
#
# This is deliberately an expected-statuses exception and NOT a tightened spec
# `pattern`: narrowing the published schema is the #240/#248 trap (it regresses
# `negative_data_rejection` and quietly shrinks a contract customers generate
# clients from), and the runtime's accept-set here is not spec-expressible at
# all — "resolves to a public address" is a DNS fact, not a grammar. Same
# reasoning as the login/register email exception above, and the same shape as
# the control-byte widening precedent: a platform-wide rejection was widened, so
# the positive generator is bounded in the same PR rather than after the flood.
#
# NB the guard also runs at SEND time inside `deliverWebhook` / the Teams notify
# loop, but that path is not reachable from a positive sweep case — the sweep
# never triggers a delivery — so no delivery operation needs an exception here.
# -----------------------------------------------------------------------------
[[operations]]
include-name = "POST /api/webhooks"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

[[operations]]
include-name = "PATCH /api/webhooks/{id}"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

[[operations]]
include-name = "POST /api/teams/webhook-config"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

