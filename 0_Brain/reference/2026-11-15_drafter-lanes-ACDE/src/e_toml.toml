# -----------------------------------------------------------------------------
# KS-480 §6 / KS-539 G-1 / KS-566 / KS-571 — `onBehalfOf` is CONNECTOR-ONLY,
# which OpenAPI cannot say. NO [[operations]] entry here any more (KS-571).
#
# The field is published on the operations that honour it, because S generates
# clients from the spec: document create, /version, /share, /transfer-custody,
# /revoke and certifications/issue. It is valid only under an `sk_` connector
# key; an interactive JWT caller sending it gets a deliberate 400
# ("onBehalfOf is connector-only — interactive callers act as themselves") — a
# security property, not a defect.
#
# This block used to list /lifecycle-events and flat /api/anchors and omit
# /revoke: the pre-ruling §6 set. Kam's G-1 split ruling (2026-08-05, WED-65),
# as recorded on KS-571: "onBehalfOf pattern = share / revoke / transfer-custody
# · connector pattern = anchor / lifecycle". KS-566 (#742, merged 2026-09-01)
# delivered it; Kamil's KS-566 status note, verbatim: "**ADD** `onBehalfOf` to
# revoke | **live**", "**DROP** from lifecycle-events | **live**", "**DROP**
# from flat anchors | **live**". The comment then disagreed with the code for a
# month — so the honouring set now lives in config/connector_only_field.py and
# a unit test holds it equal to the published spec.
#
# PRIOR MECHANISM (removed, KS-571): /share and /transfer-custody widened
# `positive_data_acceptance` to accept 400. That hid EVERY 400 on those two
# operations, not just the connector-only one (the KS-544 rule below: a widened
# expected-status list is masking), while /version, /revoke and
# certifications/issue had no entry at all — their connector-only 400s were
# reported, and /version + certifications/issue were baselined under KS-591 as
# a different defect class. Measured on the KS-571 before-sweep (full, seed
# 571, slot 4, 2026-10-06): 210 connector-only 400s across the five honouring
# operations the sweep reached.
#
# CURRENT MECHANISM: the `map_case` hook in config/connector_only_field.py drops
# `onBehalfOf` from POSITIVE bodies on those six operations, so every other
# 400 they return is judged again. The negative phase keeps the field, and
# tests/test_connector_only_refusal.py pins the refusal on all six.
#
# The ACCEPTED path (connector key + onBehalfOf → 2xx, cross-org → 403) is not
# reachable from a JWT persona; its systemTest coverage is KS-571 item 3 / KS-568.
# -----------------------------------------------------------------------------

# ============================================================================
# ⚠️  DO NOT "FIX" A FAILING SWEEP BY MAKING IT QUIETER.  (KS-544)
#
# Every knob in this file can turn a red run green. Almost none of them should.
# Before changing anything here to stop a failure, answer ONE question:
#
#     Does this change make MORE tests run, or FEWER?
#
#   MORE  -> legitimate. A generation budget lets cases be built and sent, so the
#            endpoint is exercised. Worked example: POST /api/timestamps/batch at
#            budget 25 aborts with ZERO fuzzing cases; at 100 it runs ~320, all
#            passing. That is added coverage, not a hidden result.
#
#   FEWER -> masking. `--suppress-health-check`, `--max-failures`, an exclusion,
#            a widened expected-status list, a raised `request-timeout` — each of
#            these removes signal. The failure stops being reported; it does not
#            stop existing.
#
# Three rules, each of which was broken here once and cost real time:
#
#   1. SCOPE IT. Fix the one operation that needs it, never all 318.
#      `--suppress-health-check` is root-only, so it CANNOT be scoped — that alone
#      disqualifies it. `[[operations]] generation.max-examples` can be.
#
#   2. PROVE IT TOOK EFFECT. A green run is not proof. KS-500 recorded three
#      "verified" fixes for one endpoint; TWO were inert, and the green that
#      "confirmed" one of them came from an unrelated budget change. If a fix
#      configures the tool, assert the tool RECEIVED it.
#
#   3. MEASURE, DO NOT GUESS. This health check is NON-DETERMINISTIC — the same
#      seed and settings produced pass and fail on consecutive runs. A threshold
#      that clears once proves nothing. 100 was kept only after 3/3 clean runs.
#
# Guarded by tests/unit/runner/test_args_builder.py, which fails if a suppression
# appears in this file or the budget drops below the measured minimum. Those tests
# were themselves verified red before being trusted.
#
# Full policy: systemTest/CLAUDE.md -> MUST #13, "The gate must be TRUTHFUL".
# ============================================================================

# -----------------------------------------------------------------------------
# POST /api/timestamps/batch — per-operation generation budget (KS-544 / KS-500)
#
# ⚠️  STATUS 2026-09-01 (KS-611) — READ THIS BEFORE THE ANALYSIS BELOW. The generator every
#     measurement in this block was taken against HAS BEEN REPLACED. Schemathesis 4.25.0
#     dropped `hypothesis-jsonschema` entirely (`jsonschema-rs` 0.51.0 in its place), so the
#     `small_example_cap` mechanism, the cliff at ~90 and the "budget 25 -> 0 fuzzing cases
#     execute" line below all describe a dependency that is NO LONGER INSTALLED.
#
#     Re-measured on 4.25.2 by driving Schemathesis's own generator (`op.as_strategy()`) against
#     the real TimestampBatchRequest body: budgets 6/25/30/50/70/90/100 at 20 seeds each, plus
#     positive AND negative mode at 25/50 — 440 runs, ZERO trips. Controls confirmed detection
#     works, generation is real, and the same call trips 10/10 on a pathological schema, so the
#     zero is the schema's, not the harness's.
#
#     CONSEQUENCES: (1) the budget below is no longer doing the job this block credits it with —
#     it is retained because nothing has been measured that justifies changing it, NOT because
#     50 is a proven floor; (2) raising it to 100 buys nothing; (3) the "untried lead" further
#     down is CLOSED as measured-and-rejected. ⚠ The check still trips LIVE on 4.25.2 (one abort
#     in two consecutive sweeps, 2026-08-25) while reproducing 0/440 offline, so whatever now
#     drives it sits ABOVE the generator and there is currently NO KNOWN MECHANISM. It is carried
#     as an accepted residual on KS-611. Do not "fix" this by tuning the number.
#
# Replaces the global `--suppress-health-check filter_too_much`, which silenced the
# check for all 318 operations to accommodate this one. Schemathesis's positive
# generation of this operation's array-of-objects body (`hashes[]`, minItems 1 /
# maxItems 100) filters a large fraction of draws, so the RATIO trips the check
# unless the operation is given a bigger budget. The `^[a-f0-9]{64}$` hash is NOT
# the cause — `from_regex` generates it fine.
#
# WHY THIS IS A BUDGET AND NOT A SUPPRESSION — the distinction that matters:
#   `--suppress-health-check` silences the signal. A budget does the opposite: it
#   lets generation succeed, so cases actually RUN. Measured on the live stack:
#       budget  25 -> health check trips, 0 fuzzing cases execute
#       budget 100 -> 316-332 cases generated, ALL passed (3/3 runs)
#   So raising it converts "aborted, nothing tested" into "~320 cases tested". It
#   increases real coverage; it hides nothing. It also makes the platform's
#   large-batch timeout MORE likely to surface, not less.
#
# ⚠️  STATUS 2026-07-31: THIS BUDGET REDUCES THE FAILURE RATE BUT DOES NOT ELIMINATE IT.
# A full sweep at budget 50 STILL tripped the check. Do not read the budget as a fix.
#
# WHAT WAS MEASURED (live stack, ~30 targeted runs):
#   * The check is FLAKY, not configuration-dependent. Identical config, back to back:
#     one batch tripped 0/8; another tripped 2 times. Budget shifts the probability only.
#   * Budget floor is real: 25 and 30 trip ~always; 50 mostly clears; 100 cleared 3/3 in
#     isolation — yet the FULL sweep at 50 still tripped. Isolation results do not transfer.
#   * It lives in the FUZZING phase: coverage alone 0/3, fuzzing alone 1/3, both 2/3.
#   * NOT caused by --workers (1 and 12 both trip and both pass) or by the phase count.
#   * NOT negative-mode specific: mode=positive 2/3, mode=negative 1/3.
#   * WAS made worse by the cross-run example database — that is now `none`; see the yaml.
#
# ROOT CAUSE — ⚠ SUPERSEDED 2026-09-01 (KS-611); no longer believed to be operative. It was a
# property of `hypothesis-jsonschema`, which 4.25.0 removed. Original claim follows:
# Hypothesis's fuzzing generation for this array-of-objects body has a high and VARIABLE filter
# ratio. The budget only buys more attempts; it does not make generation efficient.
#
# THE UNTRIED LEAD — ⚠ CLOSED 2026-09-01 (KS-611) as MEASURED-AND-REJECTED. Retained as history
# because it was standing here for months; do not pick it up again. The hash was never what was
# being filtered, so generating it directly cannot help, and the generator it targeted is gone.
# Original note follows:
#   Generate the hash DIRECTLY instead of filtering for it, via a registered positive
#   format strategy — the pattern config/formats.py already uses for `email` (KS-285) and
#   `date-time` (KS-427). KS-500 tried exactly this (`format: hex-digest-64` +
#   `from_regex(^[a-f0-9]{64}$)`) and REVERTED it as ineffective — but that judgement rests
#   on a run at max_examples=60, above the trip threshold, so it proved nothing either way.
#   Neither the spec annotation nor the formats.py registration survives today. Worth
#   re-testing properly, measured over repeated runs rather than one observation.
#
# WHY 50 — MEASURED, NOT GUESSED. The earlier value came from KS-500's "clears at
# >=25", measured on an older generator and stale for 4.24.3. The check is also
# NON-DETERMINISTIC: identical seed and settings produced 130-generated-pass and
# 84-generated-fail on consecutive runs, so a threshold that clears once proves
# nothing. Re-measured on the live stack, mode=all + coverage,fuzzing:
#
#     budget  25  -> TRIPS (0 fuzzing cases execute)
#     budget  30  -> TRIPS
#     budget  50  -> clear 3/3   (184 / 178 / 206 cases generated, all passed)
#     budget 100  -> clear 3/3   (316 / 332 / 328 cases generated, all passed)
#
# 100 was rejected in favour of 50 on COST, not correctness. This override applies
# to every profile, and `pr` is the only one with a time budget (~1 min target):
#
#     pr with budget 100 -> 14.6s, 14.7s   (consistent; ~+24% of the pr target)
#     pr with budget  50 ->  7.9s,  2.7s   (variable, materially cheaper)
#
# `pr` runs mode=positive and does NOT trip the check at all, so its share of this
# budget buys nothing — which is why the cheaper value wins. If this trips again,
# RE-MEASURE and raise it. Never suppress: see the header note above.
#
# Scope note: Schemathesis's `suppress-health-check` is root-only and cannot be set
# per operation; `[[operations]] generation.max-examples` can, which is why this is
# expressed as a budget rather than a scoped suppression.
#
# NOT raising this operation's `request-timeout`: a spec-legal 100-element batch
# (maxItems: 100) exceeds the 10s transport timeout, and that is a platform finding
# to report, not something to tune away.
# -----------------------------------------------------------------------------
# COVERAGE NOTE — this budget is a CEILING as well as a floor. `generation_for()`
# gives the operation-level value priority over the project value, so this 50
# applies to every profile, including ones whose global budget is HIGHER:
#     pr 5 · test-fast 6 · pre-merge 6 · full 25   -> raised to 50 (more coverage)
#     nightly 1100                                 -> CAPPED to 50 (less coverage)
# The nightly cap is accepted deliberately: 1100 draws of a body holding up to 100
# hashes would spend most of the soak on one endpoint that ALREADY exceeds the 10s
# transport timeout at maxItems — more draws would buy more timeouts, not more
# signal. Recorded here so it is a decision, not a surprise. Schemathesis offers no
# 'raise but never lower' semantics, so a single value must serve every profile.
[[operations]]
include-name = "POST /api/timestamps/batch"
generation.max-examples = 50

# -----------------------------------------------------------------------------
# KS-488 C-2 — POST /api/wallets/verify always answers 501 NOT_IMPLEMENTED.
#
# The operation used to return 200 `{verified:true}` for any three non-empty
# strings while performing no cryptography at all, and its published description
# claimed CIP-30/COSE and ecrecover verification. It now fails closed: the
# handler refuses before validating, so 200 and 400 can no longer occur and both
# were removed from the spec; 501 was added and is the ONLY response this
# operation produces (besides the transport/auth codes the gateway can still
# raise ahead of it).
#
# Without this exception `positive_data_acceptance` floods: every positive case is
# spec-legal by construction and every one of them is correctly refused. The 501
# is the contract, not a rejection of the generated data — there is no body that
# could be accepted.
#
# Deliberately an expected-statuses exception and NOT a spec tightening — the
# #240/#248 trap. There is nothing to narrow: the request schema is *already*
# accurate, and the reason no request can succeed is that the schema is MISSING
# the CIP-30 COSE key (KS-475 removed it as "unread", which it was, because the
# runtime never verified anything). Constraining the existing fields harder would
# express the wrong thing entirely.
#
# This exception comes OUT when real verification lands — that work re-adds the
# `key` request field and reintroduces a 2xx, at which point the operation should
# be held to normal positive-acceptance again.
# -----------------------------------------------------------------------------
[[operations]]
include-name = "POST /api/wallets/verify"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "501", "5xx"]
# KS-686 — the SAME 501 also failed `not_a_server_error`, which ignores the declared status
# list and flags every 5xx: 29 × 501 in one pre-merge sweep (2026-08-25), inflating KS-593's
# raw-5xx register by an operation that carries no unhandled exception at all. Prior state:
# the check ran blanket here and reported the fail-closed refusal as a defect every run.
#
# Tolerated per the platform ruling, quoted verbatim (systemTest MUST #15):
#   "Tolerate the 501 until KS-627 lands (guard + tripwire, land it on the KS-684 branch)"
#   — Kam, 2026-08-26 10:44:51 AEST (relayed by Wednesday), on KS-686.
#
# NOT a bare exclusion — the tolerance below names the ONE status (501); `by_design_501_guard`
# (config/checks.py) passes ONLY the declared 501 NOT_IMPLEMENTED envelope; a raw 500, a 502
# or a 501 with any other body still fails BOTH checks. KS-1170 (2026-09-15): this line was
# `checks.not_a_server_error.enabled = false` until Schemathesis 4.26.1 made an explicit
# `--checks` list override a per-operation disable; `expected-statuses` survives it — see the
# KS-1170 note on the 503 block above for the full reasoning. Lockstep: this entry ⇔ `_BY_DESIGN_501_OPS` in
# config/check_predicates.py; `TestLockstepWithSchemathesisToml` in
# tests/unit/checks/test_by_design_501_guard.py fails the offline gate if they drift.
#
# EXPIRY: when KS-627 lands, remove this line AND the frozenset entry (and the
# positive_data_acceptance exception above, per KS-627's own scope). The live tripwire
# `tests/test_wallet_verify_stub.py` goes RED naming KS-627 when the 501 posture ends.
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "501"]

# -----------------------------------------------------------------------------
# KS-487 B-4 — kyc image uploads now verify magic bytes before storing.
#
# `frontImage` / `backImage` / `selfieImage` are `type: string` carrying base64
# image bytes. Before this change the runtime accepted ANY string and stored it
# labelled `image/jpeg` — including strings that were not base64 at all. It now
# decodes strictly, sniffs the container, and 400s anything that is not a real
# JPEG, PNG or WebP.
#
# Every positive case Schemathesis generates for these operations is a random
# schema-legal string, which is by construction not a real image, so all of them
# are correctly refused with 400. Without this exception
# `positive_data_acceptance` floods on a working guard.
#
# Deliberately an expected-statuses exception and NOT a spec tightening — the
# #240/#248 trap. "The first bytes must be FF D8 FF, or the PNG signature, or
# RIFF….WEBP, after base64-decoding" is not expressible in JSON Schema: a
# `pattern` constrains the base64 TEXT, not the bytes it decodes to, and any
# pattern strong enough to matter would regress negative_data_rejection by
# turning malformed-base64 negatives into schema-invalid ones the generator can
# no longer produce.
#
# This exception does NOT come out when inline examples land (the extranet
# 329-operation item). Examples feed the coverage phase; the fuzzing phase still
# emits random strings, and those are exactly the cases this covers.
# -----------------------------------------------------------------------------
[[operations]]
include-name = "POST /api/kyc/{id}/document"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

[[operations]]
include-name = "POST /api/kyc/{id}/selfie"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

# =============================================================================
# KS-662 — by-design permissive input tolerance (negative_data_rejection)
# =============================================================================
# KS-518 was closed BY DESIGN, not fixed: the permissive input handling on these
# operations is intentional at this phase. Without these entries the sweep
# re-reports a settled decision every run, and a permanently-red gate stops being
# read — the same failure mode OUT_OF_SCOPE was introduced for under KS-519.
#
# ✅ RATIFIED — Kam, 2026-08-25, "Option A, the property reading" (KS-662 comment
# 16aa42bd, relayed by Wednesday). Prior state: this scope was proposed and under
# review, with KS-592 appearing to place three of these four back in its fix set.
# The ruling settles that: KS-518's closure is honoured on its PROPERTY, not on
# its COUNT of ten, and "costs zero build change — nothing on the branch moves".
# The /api/status/* trio came OUT of KS-592's fix set as a result.
#
# ⚠️ THE SET IS THREE STATUS-LIST OPERATIONS + audit-log — NOT "four status-list
# operations". audit-log rides on a SEPARATE authority (Kam's 2026-07-29
# unknown-query-param rule), which survives whichever way the status trio is
# ruled, so changing one must not silently move the other. And note
# POST /api/status/{id}/allocate is a fourth status-list operation carrying NO
# violation in KS-518's table — deliberately not tolerated here, and it never
# needed to be. Two different "fours" are in circulation; do not merge them.
#
# ⚠️ IF A TOLERATED CASE STOPS BEING PRODUCED (e.g. Schemathesis 4.25.x's
# `format: float` bound fixes dissolving the check/{index} float case), the entry
# is DELETED, not kept — Kam's standing instruction. The tripwire tests in
# tests/test_by_design_permissive.py are the signal; per the 2026-08-05
# correction, absence from one run is not evidence and wants a targeted re-probe.
#
# ⚠️  THESE ENTRIES ALONE WOULD MASK THE ENDPOINT. `expected-statuses` is
# per-operation and all-or-nothing, and `400` is already expected — so adding
# `2xx` here makes the blanket check pass whether the platform accepts OR
# rejects, hiding the go-live hardening KS-518 says is coming (KS-545 gated
# hardening). They are therefore HALF of the mechanism. The other half is
# `by_design_input_tolerance_guard` (config/checks.py), which fails any violation
# on these operations OUTSIDE the ruling, so correct-response coverage is kept.
#
# The two halves are pinned together by TestLockstepWithSchemathesisToml in
# tests/unit/checks/test_by_design_input_tolerance_guard.py — drift in the
# dangerous direction (excepted here, absent from the guard) would tolerate
# everything silently.
#
# Each is additionally pinned by a tripwire in tests/test_by_design_permissive.py
# asserting the tolerated behaviour. If the platform hardens, the tripwire goes
# RED — the signal to DELETE the entry, not to update the assertion.
# -----------------------------------------------------------------------------

# Kam, KS-518, 2026-07-29: "rejecting unknown query params is NOT standard REST
# practice and a platform-wide flip would fight the positive generator (the
# KS-472 lesson) — recommend registering this one (and the class) as by-design
# tolerated rather than 'fixing' it."
# Ruled violation: an UNDECLARED query key. A declared param given a violating
# value and still accepted is not covered and still fails (guard-enforced).
[[operations]]
include-name = "GET /api/platform/audit-log"
checks.negative_data_rejection.expected-statuses = ["2xx", "400", "401", "403", "404", "405", "406", "409", "422", "428", "429", "5xx"]

# Kam, KS-518 closure, 2026-08-04: "the flagged operations are status-list service
# reads whose permissive input handling is intentional at this phase … if the
# contract posture changes at go-live hardening, a fresh ticket picks it up under
# the KS-545 gated-hardening pattern."
# Ruled violation: a non-integer `index` path parameter. NOTE the platform does
# not merely accept it — it silently coerces (2.589e-42 answered as index 2), which
# is flagged on KS-662 as arguably beyond the ruling.
[[operations]]
include-name = "GET /api/status/{id}/check/{index}"
checks.negative_data_rejection.expected-statuses = ["2xx", "400", "401", "403", "404", "405", "406", "409", "422", "428", "429", "5xx"]

# Same KS-518 closure ruling. Ruled violation: `index` below the declared minimum.
[[operations]]
