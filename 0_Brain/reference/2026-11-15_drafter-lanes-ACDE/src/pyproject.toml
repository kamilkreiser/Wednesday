    "hypothesis>=6.170.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    # KS-571: 1.2.3 -> 1.2.4 (latest).
    "python-dotenv>=1.2.4",
