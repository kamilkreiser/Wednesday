[build-system]
# KS-1439 (2026-10-07, Peter: update every package in this file): floors raised to the latest
# release, read from the registry that day - setuptools >=61.0 -> >=84.0.0, wheel (no floor) ->
# >=0.48.0. Prior behaviour: setuptools 61.0 (2022) and an unbounded wheel, so the build backend
# a clean install used was whatever pip3 resolved, not a verified version.
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secuura-schemathesis"
version = "1.0.0"
description = "Contract compliance and fuzz testing for Secuura API"
readme = "README.md"
# KS-571 (2026-10-06): floor raised ">=3.14" -> ">=3.14.8" (Peter: 3.14.8 is the minimum; newer
# patches accepted). Prior behaviour: any 3.14.x, and nothing at runtime checked it. The runtime
# guard is scripts/python_pin.py (REQUIRED_PYTHON); tests/unit/runner/test_python_pin.py keeps the
# two equal. pip3 itself also refuses `-e .` into a venv below this floor.
requires-python = ">=3.14.8"
authors = [
    { name = "Secuura Testing Team" }
]
dependencies = [
    # KS-495: bumped 4.22.4 → 4.24.0 (latest stable, 2026-07-19) per the CLAUDE.md five-step
    # version-bump workflow. 4.23/4.24 add config keys + reactive dynamic-auth and fix a batch of
    # positive_data_acceptance/negative_data_rejection false positives (KS-255 re-validated). 4.24
    # also moved the skip/warning plumbing OutputHandler→WarningCollector (test_warnings_gate.py
    # updated). version.py reads this pin to stamp the HTML report; venv must match.
    # KS-500: bumped 4.24.0 → 4.24.1 (latest stable, 2026-07-21) — patch fixing fuzz-dictionary
    # application to body fields nested under oneOf/anyOf/allOf and if/then/else. Five-step audit
    # re-run; report-format list unchanged (junit,vcr,har,ndjson,allure). venv verified 4.24.1.
    # Bumped 4.24.1 → 4.24.2 (latest stable, 2026-07-22) — pure bug-fix patch: positive_data_acceptance
    # allOf/anyOf/oneOf property counting, fuzz dicts/body-overrides behind $ref (#4350), and
    # config.*.update() flag reset. No new checks/phases/warnings/CLI/report-files (five-step audit
    # re-run; checks+phases compatibility guards pass; report-format list unchanged). venv verified 4.24.2.
    # KS-544: bumped 4.24.2 → 4.24.3 (latest stable, 2026-07-31) — performance/internal-only patch:
    # faster strategy construction for string/integer/anyOf schemas, with data generation for those
    # types now built from the jsonschema-rs canonical form. Six-step audit re-run: no new
    # checks/phases/warnings/CLI flags/report formats (ReportFormat enum still junit,vcr,har,ndjson,
    # allure). The generation-internals change CAN shift which draws reach a check, so the bump was
    # validated with a live `full` sweep + Delta-tab comparison, not offline gates alone.
    # venv verified 4.24.3.
    # KS-684: pin form changed from `>=` to `==` (prior behaviour: `schemathesis>=4.24.3`).
    # A floor pin cannot express "the installed venv must EQUAL the pin", which
    # systemTest/CLAUDE.md item 2a states as a MUST. The remediation that rule documented,
    # `pip3 install -U 'schemathesis>=X.Y.Z'`, resolves to whatever is newest on PyPI that day, so
    # following it could BREAK the equality it was meant to restore: on 2026-08-25 a fresh venv
    # built from `>=4.24.3` installed 4.25.2 while every offline gate stayed green.
    # That drift is what KS-684 was filed for. 4.24.3's own unbounded `jsonschema-rs>=0.49.0`
    # admitted 0.51.0, which removed `CanonicalSchema.is_satisfiable` and produced 310 generation
    # errors in a run that still rendered a complete, plausible-looking failure table.
    # An exact pin makes the parity assertion mean what it says; a version bump becomes a
    # deliberate act, never a side effect of rebuilding a venv.
    # KS-1169 (2026-09-14): bumped 4.25.2 → 4.27.1 (latest stable; 4.27.1 published 2026-09-13).
    # Three releases folded in — 4.26.0, 4.26.1, 4.27.0/4.27.1 — none reviewed before this bump.
    # Prior behaviour: 4.25.2 (KS-684). Every 4.27.1 fix is in generation internals (negative bodies,
    # coverage-phase bodies, oneOf branches, multipart terminator, nullable), so which draws reach a
    # check CAN shift: validated with a live before/after `full` sweep on the named slot, not
    # offline gates alone. Six-step audit findings are recorded next to the setting they changed:
    # new warnings → schemathesis.toml [warnings] / the INFORMATIONAL map, new CLI flags →
    # harness.deliberately_unused_flags, new `--report json` + baseline file → args_builder notes.
    # KS-1268 (2026-09-18): bumped 4.27.1 → 4.27.2. Prior behaviour: 4.27.1 (KS-1169). The ticket
    # was raised for 4.27.3 (published 2026-09-17) and the bump was retargeted after 4.27.3 failed the
    # offline gate: its "st starts 2.5x faster" commit (5c2b5ae) moves `import requests` inside
    # reporting/ndjson.py's serialize(), which the NDJSON writer THREAD calls; the import deadlocks on
    # the main thread's own `requests` import (_frozen_importlib._DeadlockError on
    # requests.structures), the thread dies silently, and every event after `Initialize` is lost —
    # a 1-line NDJSON while the CLI exits 0 and lists the file. Bisected with one command: 4.27.1 and
    # 4.27.2 write 21 lines for one tested op, 4.27.3 writes 1. NDJSON is the only file carrying the
    # per-case check matrix (Delta tab, baseline gate, KS-1170 guard), so 4.27.3 is unusable here;
    # tracked on its own ticket (linked from KS-1268). 4.27.2 is fix-only (19 fixes) and was validated
    # with a live before/after `full` sweep on slot 1 (109 → 95 unique failures; seed-driven churn
    # inside known registers, 3 platform findings routed) plus a fixed-seed stateful comparison
    # (76 vs 74 distinct ops chained — the link-inference change does not reduce coverage).
    # No new checks/phases/warnings/CLI flags/report formats; `--help` byte-identical to 4.27.1.
    # KS-1285 (2026-09-21): bumped 4.27.2 → 4.27.5. Prior behaviour: 4.27.2 (KS-1268), held there by
    # KS-1270 because 4.27.3's NDJSON writer thread deadlocked on a lazy `import requests` and wrote a
    # 1-line file while exiting 0. Upstream closed that as issue 4807 ("Fixed via #4809", released in
    # 4.27.4): the writer thread now re-raises its exception on join() and reporting/ndjson.py no longer
    # imports requests at all — read at the v4.27.5 tag, not inferred from the changelog. Acceptance was
    # the KS-1270 one-op check on 4.27.5: 3 of 3 runs wrote 21 NDJSON lines with `EngineFinished` present,
    # identical to 4.27.2 (tests/functional/config/test_ndjson_completeness.py runs the same check on
    # every `quality`). 4.27.4 also CHANGES behaviour, not just fixes: the examples phase now fills
    # missing values from schema `default`s and counts required-parameter defaults as examples; with
    # 4.27.5's "drop/skip examples that violate their own schema" that moves examples-phase counts on the
    # KS-256/KS-665 surface — see the KS-1285 before/after tables (same slot, head and seed). Audit:
    # `--help` byte-identical to 4.27.2 (54 flags), check/phase/warning registries identical, `--report`
    # list unchanged (6, SARIF still absent), `ignored_auth` message wording unchanged.
    # KS-1353 (2026-09-28): bumped 4.27.5 -> 4.28.0, the first MINOR since the 4.27.x line (upstream
    # CHANGELOG dates it 2026-09-23; the tag was pushed 2026-09-22). Prior behaviour: 4.27.5 (KS-1285).
    # No release sits between them, so this carries exactly the 4.28.0 notes.
    # WHAT REACHES US, measured against the spec at d9ce1403d rather than read off the release page:
    #   * NEW WARNING `low_valid_rate` (opt-in) - trips TestAllInstalledWarningsAreAccountedFor (KS-684)
    #     by existing. Triaged INFORMATIONAL for this bump: making a warning fatal without a measured
    #     sweep is what `unmatched_filter`/`unresolvable_reference` were explicitly not allowed to do.
    #   * NEW run-ending `Server Unavailable` error when the server stops accepting connections.
    #   * `negative_data_rejection` false positives for regex/uri-reference-ish string formats - our
    #     nearest surface is 22 `uri` formats + 56 `pattern` keywords, so plausible, to be measured.
    #   * top-level `format: binary` JSON bodies now send a JSON string, not raw bytes - exactly 2 ops.
    #   * generation-failure text reworded (a parser risk, not a result change).
    # WHAT DOES NOT, and why the ticket's first draft was wrong about four of them: 0 HEAD operations,
    # 0 boolean query parameters, 0 declared `links:` (KS-188 is still Todo), 0 `examples:` maps and
    # 0 duplicate parameter names - so the HEAD, boolean-query, OpenAPI-link and all three examples-map
    # fixes are inapplicable here. Everything else in 4.28.0 is GraphQL, `st replay` or the Python API.
    # NOTE FOR THE NEXT BUMP: upstream *Unreleased* already carries BREAKING changes - exit code 2 when
    # nothing is tested, exit 2 on schema/config/internal errors, exit 130 on Ctrl+C, and per-operation
    # seeding (which changes what a fixed seed means for our before/after comparisons).
    # KS-1408 (2026-10-05): bumped 4.28.0 -> 4.29.3 (4.29.0 2026-10-02, 4.29.1 + 4.29.2 2026-10-04,
    # 4.29.3 2026-10-05; no 4.28.x patch exists). Prior behaviour: 4.28.0 (KS-1353). That NOTE landed:
    #   * EXIT CODES, measured 4.28.0 -> 4.29.3 on a throwaway local spec: nothing tested 0 -> 2,
    #     Ctrl+C 0 -> 130, missing schema 2 -> 2. The runner read every non-zero code as "failed", so
    #     src/sweep_outcome.py now classifies the code once for the console, results.json and report.
    #   * Six-surface audit: checks 13 -> 13, phases 4 -> 4, warnings 12 -> 12, `run --help` 59 -> 60
    #     flags (`--report-wfc-path`), `--report` gains `wfc` - now generated and surfaced.
    #   * Per-operation seeding: a fixed seed no longer replays the same cases across this bump, so the
    #     before/after pair diff classifies every vanished pair (not generated vs fixed), never "passed".
    #   * Forced transitive move: jsonschema-rs `<0.58.0,>=0.57.1` -> `<0.59.0,>=0.58.5`.
    # KS-1439 (2026-10-07): bumped 4.29.3 -> 4.29.4 (released 2026-10-06; fixes only, 35 entries, none
    # marked breaking). Prior behaviour: 4.29.3 (KS-1408). What reaches this estate, from the spec and
    # harness, to be confirmed by the sweep rather than asserted:
    #   * network-error and crashed-check cases are now reported ERRORED, not skipped - our skipped and
    #     errored panels, src/sweep_outcome.py and report_reconciliation.py read those counts;
    #   * credentials are sanitised in NDJSON recorded cases - the recorder.cases[] readers;
    #   * 8 negative_data_rejection fixes (nullable query null, form fields, path anyOf/oneOf, nullable
    #     mutations, string query values) - NONE is the KS-1414 pool-draw mechanism, so that count is
    #     not expected to fall; it is measured, not assumed.
    # INAPPLICABLE by inspection: 0 multipart, 0 XML and 0 text/plain bodies in the published spec; no
    # filter_case hook is registered (map_case, before_add_examples, after_call only).
    # KS-1455 (2026-10-09): bumped 4.29.4 -> 4.30.0 (released 2026-10-08; the latest, no 4.30.x patch
    # yet). Prior behaviour: 4.29.4 (KS-1439). A MINOR: 5 additions, 3 changes, 33 fixes, none marked
    # breaking. The three CHANGED entries move counts by design and are measured, not assumed:
    #   * redirects are followed only within the requested host (others returned as the response);
    #   * `positive_data_acceptance` now accepts 3xx by default;
    #   * the coverage phase leads with values learned from earlier responses over declared examples.
    # Estate impacts are recorded where they land (see KS-1455 in systemTest/CLAUDE.md).
    # KS-1476 (2026-10-12): bumped 4.30.0 -> 4.30.1 (uploaded to PyPI 2026-10-09; the latest, read from
    # the registry). Prior behaviour: 4.30.0 (KS-1455). A PATCH: 3 changed, 21 fixed, none marked breaking.
    # What touches this estate (wheel diff 4.30.0 vs 4.30.1, 52 files):
    #   * NEW WARNING `rate_limited` (12 -> 13): an operation answered >= 90 % 429 is named under "Rate
    #     limited". Accounted INFORMATIONAL in test_schemathesis_checks_compatibility.py; reaches the
    #     console, verdict and Warnings tab (test_rate_limited_warning_reaches_every_surface.py);
    #   * 429s no longer count toward the 4xx breakdown behind validation_mismatch / missing_test_data;
    #   * random credentials for an ALTERNATIVE security scheme are dropped when auth is configured - one
    #     operation here declares two (POST /api/platform/organizations/register-connector);
    #   * `--request-timeout` default 10 -> None (config-file value now honoured) - inert here, the argv
    #     always passes it from SECUURA_REQUEST_TIMEOUT;
    #   * a private HTML writer, enabled only by SCHEMATHESIS_HTML_REPORT_DIR ("Private until the HTML
    #     report is complete" upstream) - deliberately not wired; `--report` formats unchanged (7).
    # UNCHANGED (byte-identical): the NDJSON and WFC writers, recorder, statistic, outage, `run` command.
    # KS-1478 (2026-10-14): bumped 4.30.1 -> 4.31.0 (uploaded to PyPI 2026-10-12; the latest, read from the
    # registry 2026-10-14). Folded into the Akto 2.38.2 bump at Peter's instruction (it was filed ahead of the
    # release as KS-1502). Peter's ruling for this bump: update the app, LOG new issues, do not fix them.
    # KS-1615 (2026-10-15): bumped 4.31.0 -> 4.31.1 (Release v4.31.1, the latest on PyPI that day). Fixes
    # only - no new check or warning; touches stateful negative_data_rejection false failures,
    # object_level_authorization reproduction/replay, HTML-report and summary counts. App-only at Peter's
    # ruling: new failures are recorded, not fixed, and logged on Linear only after the PR merges.
    # KS-1607 (2026-10-19): bumped 4.31.1 -> 4.32.1 (4.32.0 2026-10-18, 4.32.1 2026-10-19 - the latest on PyPI,
    # read from the registry 2026-10-19). Checks (14), warnings (15) and WFC codes unchanged. Adds stable failure
    # codes (ST101...) to console/JSON/NDJSON/JUnit, `st explain`, `--report pytest`, renamed failure titles, and
    # a cli/wfc_report <-> cli/executor import cycle (tests import it via tests/support/upstream_wfc_report.py).
    "schemathesis==4.32.1",
    # KS-1439 (2026-10-07): every floor below re-read from the registry and already equals the latest
    # release (hypothesis 6.168.5, httpx 0.28.1, pytest 9.1.1, pytest-cov 7.1.0, pytest-html 4.2.0,
    # python-dotenv 1.2.4, jinja2 3.1.6, pyyaml 6.0.3, allure-python-commons 2.16.2, ruff 0.16.10,
    # mypy 2.4.0, pytest-xdist 3.8.0, pytest-timeout 2.4.0, pip-audit 2.10.1, cssutils 2.15.0,
    # html5lib 1.1, types-pyyaml 6.0.12.20260906) - none moved since KS-571 (2026-10-06), so none changes.
    # KS-1455 (2026-10-09): re-read from the registry again - all 17 floors above still equal the latest
    # release, so none moves; the transitive tree is refreshed in constraints.txt by `update-deps`.
    # KS-1476 (2026-10-12): re-read from the registry - two floors moved upstream: hypothesis 6.168.5 ->
    # 6.169.0 (raised below, on its own sweep) and ruff 0.16.10 -> 0.17.0 (dev, below). The other 15 equal
    # the latest release.
    # KS-684 (2026-08-25): floors below re-verified against PyPI and raised to the latest
    # release of each. Prior floors were the versions last verified under KS-544 (2026-08-05);
    # every one of them already resolved to something newer in a fresh venv, so the floors
    # recorded history rather than what runs. Raising them makes the declared floor equal the
    # verified version. NOTE these remain `>=` floors, unlike the schemathesis `==` pin above —
