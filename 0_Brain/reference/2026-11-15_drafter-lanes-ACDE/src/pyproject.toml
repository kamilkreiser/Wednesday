    # KS-1169 (2026-09-14): floors re-verified against PyPI; only the three below moved since
    # KS-684 — hypothesis 6.165.10 → 6.168.0, ruff 0.16.4 → 0.16.7, types-pyyaml 20260815 → 20260906.
    # The other 14 already equal the latest release and are unchanged.
    # KS-1353 (2026-09-28): 6.168.0 -> 6.168.3. hypothesis IS the generator, so its floor moves on its
    # own evidence, not the Schemathesis bump's: sweep 3 measures it against sweep 2 on the same slot,
    # head and seed, so a change in what is generated is attributable to this line rather than to 4.28.0.
    # KS-571 (2026-10-06): 6.168.3 -> 6.168.5, the latest release (every floor raised to latest).
    # KS-1476 (2026-10-12): 6.168.5 -> 6.169.0, the latest release. Measured on its OWN sweep (same slot,
    # head and seed 1476 as the 4.30.1 sweep before it) so a change in what is generated is attributable
    # to this line rather than to the Schemathesis bump - the KS-1353 method.
    # KS-1478 (2026-10-14): 6.169.0 -> 6.169.1, the latest release (read from the registry that day; update-deps
