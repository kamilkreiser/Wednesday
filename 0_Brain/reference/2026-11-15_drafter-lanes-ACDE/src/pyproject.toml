[project.optional-dependencies]
dev = [
    # Formatting + import-sorting are BOTH owned by ruff (ruff format + ruff's isort rules).
    # black and isort were removed 2026-07-24: running them alongside ruff meant two formatters
    # and two import-sorters with separately-maintained first-party lists, and they demonstrably
    # disagreed (isort split the imports in parsing/crashes/reproduce.py, ruff --fix merged them
    # back). One tool, one config, no drift.
    # KS-1353 (2026-09-28): 0.16.7 -> 0.16.9. A ruff minor can introduce new rules; anything it flags is
    # fixed rather than ignored, and the gate below is the proof it introduced nothing here.
    # KS-571 (2026-10-06): ruff 0.16.9 -> 0.16.10 and mypy 2.3.1 -> 2.4.0 (latest); quality:static
    # re-run on both, findings (if any) fixed, not ignored.
    # KS-1476 (2026-10-12): 0.16.10 -> 0.17.0, the latest release (a minor; quality:static is the proof).
    # KS-1607 (2026-10-19): 0.17.0 -> 0.17.1, the latest (a patch); quality:static is the proof it flags nothing new.
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest-xdist>=3.8.0",
    # Hypothesis-driven fuzz/stateful tests can hang on a bad shrink or a wedged connection;
    # without this only the runner's outer wall-clock catches it. Fails the case, not the job.
    "pytest-timeout>=2.4.0",
    # Dependency vulnerability scanning for the quality gate (mirrors `npm audit` in the
    # Node-based systemTest packages).
    "pip-audit>=2.10.1",
    # Report-asset linters (tests/unit/report/test_report_assets.py): cssutils syntax-checks the
    # report stylesheet, html5lib checks the generated report HTML for well-formedness.
    "cssutils>=2.15.0",
    "html5lib>=1.1",
    # Type stubs for mypy — matches pyyaml in [project.dependencies]
    "types-pyyaml>=6.0.12.20260906",
]

# ===================================================
# Tool Configurations
# ===================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--tb=short --strict-markers -v --cov=src --cov=tests/unit --cov=tests/functional --cov-report=term-missing"
# Per-test wall-clock ceiling (pytest-timeout). Generous enough for the live orchestration tests
# that stop/recreate services, tight enough that a wedged fuzz case fails in minutes rather than
# hanging until the runner's outer timeout.
timeout = 300
filterwarnings = [
    # Hypothesis emits this when building repr() of a very large generated value (>100 kB).
    # It is a performance hint, not a test failure — safe to suppress in CI output.
    "ignore::hypothesis.errors.HypothesisWarning",
]
markers = [
    "stateful: marks tests as stateful (deselect with '-m \"not stateful\"')",
    "fuzz: marks tests as fuzz tests (deselect with '-m \"not fuzz\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "workflow: marks end-to-end workflow scenarios (used in test_workflows_stateful.py)",
]

# ===================================================
# Type Checking (MyPy)
# ===================================================

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
# The three flags `strict = true` would set that we deliberately do NOT set, and why (recorded
# 2026-07-24 so nobody later assumes full strict-mode is in effect):
#   - disallow_any_expr / disallow_any_decorated: schemathesis + hypothesis decorators and the
#     check/hook signatures they impose are untyped upstream, so enabling these would require
#     blanket `# type: ignore` across config/ and the report parsers — noise, not safety.
#   - disallow_any_unimported: kept false for now; the seven `ignore_missing_imports` overrides
#     below mean it should be near-noise-free to flip, so it is the safe one to revisit first.
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "schemathesis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hypothesis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest_.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "allure.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.identity.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.keyvault.secrets.*"
ignore_missing_imports = true

# ===================================================
# Linting (Ruff)
# ===================================================

[tool.ruff]
line-length = 120
target-version = "py314"
extend-include = ["*.pyi"]

[tool.ruff.lint]
select = [
    "A",      # builtin-shadowing
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle (docstrings)
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RUF",    # ruff-specific
    "S",      # flake8-bandit — static security linting. A framework whose job is finding security
              # defects should hold its own code to the same bar (hardcoded creds, shell=True,
              # insecure hashes). Test-only carve-outs live in per-file-ignores below.
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]

ignore = [
    "D100",   # Missing module docstring (allow)
    "D104",   # Missing package docstring (allow)
    "D105",   # Missing magic method docstring
    "D107",   # Missing __init__ docstring
    "SIM102", # Use a single if statement instead of nested if statements
    # Ambiguous-unicode warnings: the report intentionally uses typographic glyphs
    # (em/en dashes, ×, ✓, ⊘) in generated HTML strings, docstrings, and comments.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

# E501 is ignored only in the HTML report builders: these modules emit inline HTML as
# f-strings where a single tag's attributes legitimately exceed the 120-col limit, and
# wrapping them would hurt readability without changing output. All other code is held
# to the line limit.
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".mypy_cache",
    ".ruff_cache",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint.per-file-ignores]
# Docstring rules relaxed for test classes/methods (the test name IS the description).
# S-rule carve-outs are scoped and justified — the goal is real security signal, not silence.
"tests/**/*.py" = [
    "D101", "D102", "D103",
    "S101",  # assert IS the pytest idiom (1,387 hits) — flagging it would drown the real signal
    "S105", "S106",  # seeded test credentials (issuer123 etc.) are fixtures, not secrets
    "S102",  # one test execs build_hypothesis_setup()'s output — verifying that IS its purpose
    "S108",  # "/tmp/openapi.yaml" is a string literal in an assertion, not a file operation
    "S603", "S606", "S607",  # test helpers spawn docker/pytest with LIST args (shell=False, safe form)
    "S314",  # ET over the suite's OWN fixture XML strings, not untrusted input
]
# config/ holds the seeded test personas the harness authenticates as. These are fixtures for a
# local test stack, not secrets — the real credentials come from .env (gitignored).
"config/**/*.py" = ["S105", "S106"]
"conftest.py" = []
"src/html_report/**/*.py" = [
    "E501",
    "S314",  # ET.parse over OUR OWN generated JUnit/NDJSON artefacts, not untrusted input
]
# The runner legitimately shells out to docker compose / pytest. Every call uses list args
# (shell=False) — the safe form S603 flags generically. Partial paths ("docker") are resolved
# from PATH by design so the harness works across machines.
"scripts/**/*.py" = ["S603", "S606", "S607"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
known-first-party = ["tests"]
known-third-party = ["schemathesis", "hypothesis", "pytest"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# MUST stay "double": ruff format is now THE formatter (black removed). This was "single" while
# ruff format was never invoked — adopting it would have silently rewritten every string literal.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ===================================================
# Coverage (pytest-cov)
# ===================================================

[tool.coverage.run]
branch = true
# Measure src/ (report generation, parsing, config) — the production logic worth tracking.
# The two OFFLINE test trees are included so uncalled test helpers surface as a smell, not a
# blind spot: tests/unit/ (unit tests of Python modules) and tests/functional/ (contract tests
# of this repo's schemathesis_tests.yaml / schemathesis.toml against the installed library).
# Only those two are measured: the top-level tests/*.py files are live-API integration suites
# (schemathesis sweep / GDPR IDOR) that run against a running platform during a full/pre-merge
# run, NOT during the offline gate; counting them here would peg coverage at ~0% for ~700
# statements no offline run can ever execute. They are exercised in their own (live) job.
# scripts/ (run.py + runner/) is excluded: subprocess/signal paths cannot be meaningfully unit-tested.
source = ["src", "tests/unit", "tests/functional"]
omit = [
    "*/tests/conftest.py",
    "*/venv/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]
# 90% locks in the panel-builder + parse→dataclass→render coverage added with the Jinja /
# typed-model migration (actual is ~94%, leaving ~4% headroom so a minor edit does not trip
# the gate). The remaining uncovered lines are exception/subprocess paths that legitimately
# cannot be hit in unit tests. Ratchet upward as coverage rises; do not lower without cause.
# If the gate fails after a change, run: python3 -m pytest --cov --cov-report=term-missing
# to identify uncovered lines — add tests or mark pragma: no cover with justification.
fail_under = 90
precision = 2

# ===================================================
# Schemathesis Configuration
# ===================================================
# Fallback defaults only — profiles (pr, pre-merge, full, test-fast, local-debug)
# and all profile-specific flags are defined in config/schemathesis_tests.yaml.
# scripts/run.py enforces profile flags at runtime; values here apply only when
# schemathesis is invoked directly (e.g. `st run schema.yaml`).
# Reference: systemTest/schemathesis/config/schemathesis_tests.yaml

[tool.schemathesis]
# KS-1016: `base-url = "http://localhost:6882"` used to live here and has been removed.
#
# A checked-in literal cannot know which stack slot a run is aimed at, and this one named slot 1.
# `scripts/run.py` already preferred the environment over it (KS-672, scripts/runner/config.py), so
# the key only ever took effect on a DIRECT `st run schema.yaml` — which this file's own comment and
# tests/test_fuzz_comprehensive.py both document as a supported way to run the suite. On slot 3 that
# invocation silently drove slot 1: the requests went to :6882 and nothing said so.
#
# With the key gone, `run.py` falls through to src.constants.DEFAULT_API_BASE_URL, which resolves the
# slot; and a direct `st run` with no --base-url now fails asking for one, instead of answering
# confidently about the wrong stack. Loud beats silently wrong — the reason this suite exists.
#
# Host only, no /api — OpenAPI paths carry their own prefix (see scripts/run.py).

[tool.schemathesis.generation]
# "all" = valid + invalid inputs. Overridden per-profile by scripts/run.py.
mode = "all"

[tool.schemathesis.checks]
# Maximum allowed response time in seconds. Applies to all profiles.
max_response_time = 5.0

[tool.schemathesis.output.sanitization]
# Strip auth tokens, keys, and passwords from all report artefacts.
enabled = true
