      - NODE_ENV=development
      - MCP_HTTP_PORT=4023
      - SECUURA_API_URL=http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4023/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - secuura-network

  # ===========================================================================
  # DEMO SERVICE (Demo Infrastructure - Persona switching & state)
  # ===========================================================================

  demo-service:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: services/demo-service/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-demo-service
    restart: unless-stopped
    # Pen-test F-04: backend ports no longer published on host. Use
    # `docker compose -f docker-compose.yml -f docker-compose.dev-debug.override.yml up -d`
    # to re-enable for local debugging.  Was: - "6030:4030"
    environment:
      - TZ=UTC
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=4030
      - AUTH_HOST=auth
      - AUTH_PORT=4003
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secuura_redis_dev}@redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${GATEWAY_PORT:-6882},http://localhost:${WEBSITE_PORT:-6881}}
      - DEMO_MODE=${DEMO_MODE:-true}
      # KS-641: demo-service refuses to start without BOTH of these. It mints
      # real Platform Admin tokens without a caller credential, so it is an
      # explicit opt-in, never a default, and never production.
      # KS-641 (#737 review): NO default value, deliberately. `:-true` and a
      # 26-char literal made all three branches of assertDemoServiceEnabled()
      # unreachable on every deploy of this file — the guard worked precisely
      # where we do not deploy. The demo VM runs this exact compose stack
      # (DEPLOYMENT-ARCHITECTURE.md:32) and this block has no `profiles:` key,
      # so `docker compose up` starts it. Same rule as #686/KS-487 B-3: refuses
      # everywhere by default, and a developer opts in via .env. Populate with
      # scripts/bootstrap-env.sh, which now generates the key.
      - DEMO_SERVICE_ENABLED=${DEMO_SERVICE_ENABLED:-}
      - DEMO_SERVICE_KEY=${DEMO_SERVICE_KEY:-}
      - DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@pgbouncer:6432/${POSTGRES_DB:-secuura}
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
    volumes:
      - ./docker/seed:/seed:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4030/demo-api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - secuura-network

  # ===========================================================================
  # DEMO OVERLAY — BUILD SURFACE ONLY (KS-654)
  # ===========================================================================
  # This service exists so `docker compose build` compiles the overlay. It is
  # not wired to anything at runtime and is not a dependency of any service.
  #
  # Why it is needed: frontend/demo-overlay had no lockfile and no Dockerfile,
  # so nothing built it and no failure could surface. Its build was broken for
  # 33 days (2026-07-15 -> 2026-08-17, KS-461's lucide icon name on an MUI
  # import path) and was found only by accident. It is a root workspace member,
  # so a broken build also breaks `npm run build --workspaces`. The image build
  # is the red surface that was missing.
  #
  # Why it publishes nowhere: NOTHING SERVES THE OVERLAY. Verified 2026-08-17 —
  # the gateway's `location /demo-overlay/` and sub_filter injection were
  # removed in nginx-demo.conf:363-379 ("no functional value"), the URL 404s,
  # and no .conf references the mount path. The bind-mount that used to be on
  # nginx-gateway below was the misleading artefact: it made this look live.
  # Revive-vs-retire is an open product decision on KS-654 — until it is taken,
  # this builds and reports, and touches nothing.
  demo-overlay:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: frontend/demo-overlay/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-demo-overlay
    restart: "no"
    networks:
      - secuura-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ===========================================================================
  # NGINX GATEWAY - Unified local entry point (port 6882)
  # ===========================================================================

  nginx-gateway:
    labels:
      <<: *stack_labels
    build:
      context: ./docker/nginx-gateway
      dockerfile: Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-nginx-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-6882}:80"
    volumes:
      - ./docker/nginx-gateway/nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
      # KS-654: the `./frontend/demo-overlay/dist:/usr/share/nginx/demo-overlay`
      # bind-mount was REMOVED here on 2026-08-17. Nothing read it — the
      # `location /demo-overlay/` and sub_filter blocks were deleted from
      # nginx-demo.conf (see :363-379), /demo-overlay/demo-overlay.js returns
      # 404, and no directive references the mount path. The mount was the
      # misleading artefact: it made an unserved, untracked, 33-day-broken
      # bundle look live. Do not re-add it without also restoring the location
      # block — that is the open revive-vs-retire decision on KS-654.
    depends_on:
      - issuer-frontend
      - verifier-frontend
      - admin-frontend
      - status-frontend
      - website-frontend
      - api-gateway
      - demo-service
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.125'
          memory: 64M
    networks:
      - secuura-network

  # =============================================================================
  # LOCAL LLM - OLLAMA (Optional - start with: docker-compose --profile local-llm up -d ollama)
  # Uses your pre-downloaded models from the host machine.
  # On macOS Apple Silicon, prefer running Ollama natively (see scripts/start-ollama.sh)
  # for GPU acceleration. Use this service for Linux / CI environments.
  # =============================================================================

  ollama:
    labels:
      <<: *stack_labels
    # KS-366: pinned (was floating :latest — no reproducible pin); bump deliberately.
    image: ollama/ollama:0.31.1
    container_name: ${STACK_PREFIX:-secuura}-ollama
    profiles:
      - local-llm
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_MODELS_PATH:-~/.ollama}:/root/.ollama
    environment:
      - TZ=UTC
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - secuura-network

# =============================================================================
# NETWORKS
# =============================================================================
# All services share a single bridge network for local development.
# Production deployments should use isolated internal/public networks.
# =============================================================================

networks:
  secuura-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
  redis_data:
  cardano_data:
  ollama_data:
