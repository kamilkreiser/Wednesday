  # ===========================================================================

  tokenisation:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: services/tokenisation/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-tokenisation
    restart: unless-stopped
    # Pen-test F-04: backend ports no longer published on host. Use
    # `docker compose -f docker-compose.yml -f docker-compose.dev-debug.override.yml up -d`
    # to re-enable for local debugging.  Was: - "6021:4021"
    environment:
      - TZ=UTC
      - NODE_ENV=development
      - PORT=4021
      # KS-175 + RS256 cutover (KS-302): the tokenisation block was missing vars every other
      # service declares — DATABASE_URL + the JWT verification key (shared envSchema →
      # authenticate()) and PII_ENCRYPTION_KEY (the KEK that wraps tenant keys / PII).
      # Without JWT_PUBLIC_KEY the RS256 verifier fails closed and 401s every authed request
      # (before the route's platform-admin role check) — JWT_SECRET was dropped in the cutover
      # but JWT_PUBLIC_KEY was never added here (demo's bicep has it; only local was missed).
      # Without the KEK, key-wrapping fell back to an invalid dev placeholder ("Invalid key
      # length", KS-288). The gateway's internal PII tokenise/detokenise calls hit the same
      # failures. Match the other services' runtime wiring (least-priv secuura_app via
      # pgbouncer + shared secrets + the RS256 public key).
      - DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@pgbouncer:6432/${POSTGRES_DB:-secuura}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-}
      - PII_ENCRYPTION_KEY_VERSION=${PII_ENCRYPTION_KEY_VERSION:-1}
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4021/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - secuura-network

  # ===========================================================================
  # TENANT PROVISIONING SERVICE (Multi-tenancy - DB lifecycle)
  # ===========================================================================

  tenant-provisioning:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: services/tenant-provisioning/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-tenant-provisioning
    restart: unless-stopped
    # Pen-test F-04: backend ports no longer published on host. Use
    # `docker compose -f docker-compose.yml -f docker-compose.dev-debug.override.yml up -d`
    # to re-enable for local debugging.  Was: - "6022:4022"
    environment:
      - TZ=UTC
      - NODE_ENV=development
      - PORT=4022
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
      - POSTGRES_USER=${POSTGRES_USER:-secuura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secuura_dev_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DIRECT_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/${POSTGRES_DB:-secuura}
      - TOKENISATION_URL=http://tokenisation:4021
      # KS-336: mint the per-tenant Platform-S metering key via the security service
      # (same value the gateway uses — security listens on 4008 in the local stack).
      - SECURITY_SERVICE_URL=http://security:4008
      - INIT_SCRIPTS_DIR=/app/init-scripts
      # BACKLOG H13: tenant-provisioning's authenticate() middleware (from
      # @secuura/shared) calls getJwtConfig() lazily on the first authed
      # request. The shared loadConfig() requires JWT_SECRET + DATABASE_URL
      # both present, even if the service only needs JWT_SECRET. Without
      # them the proxied DELETE / PATCH / GET-by-id requests bounce with
      # "Invalid environment configuration" and the gateway surfaces a
      # misleading "service unavailable" 502. Same values as auth.
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@pgbouncer:6432/${POSTGRES_DB:-secuura}
    volumes:
      - ./docker/init:/app/init-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      tokenisation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4022/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - secuura-network

