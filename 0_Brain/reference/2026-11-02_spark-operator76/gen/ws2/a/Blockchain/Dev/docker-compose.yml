      # so the process hit a JS-heap OOM under the load ramp with ~250 MB of the
      # container budget unused. Size the old space to the container (leaving
      # headroom for non-heap RSS) so GC uses the available memory before aborting.
      # Pairs with the in-flight shedder in src/middleware/overloadProtection.ts.
