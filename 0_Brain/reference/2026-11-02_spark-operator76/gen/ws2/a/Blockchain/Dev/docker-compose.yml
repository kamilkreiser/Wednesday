  auth:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-auth
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    # Pen-test F-04: backend ports no longer published on host. Use
    # `docker compose -f docker-compose.yml -f docker-compose.dev-debug.override.yml up -d`
    # to re-enable for local debugging.  Was: - "6003:4003"
    environment:
      - TZ=UTC
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=4003
      # KS-254: argon2 verifies run on the libuv threadpool (default 4) — raise
      # it so concurrent logins hash in parallel instead of queueing four-wide.
      # 8 × 64 MiB argon2 buffers ≈ 512 MiB peak, inside the 1G limit below.
      - UV_THREADPOOL_SIZE=${AUTH_UV_THREADPOOL_SIZE:-8}
      # KS-254: pool acquisition fails fast (KS-253 maps it to 503). Defaults
      # in code: AUTH_DB_POOL_MAX=10, AUTH_DB_CONNECT_TIMEOUT_MS=2000.
      - DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@pgbouncer:6432/${POSTGRES_DB:-secuura}
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secuura_redis_dev}@redis:6379
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # KS-167/184/302: RS256-only (auth is the sole signer; HS256 removed). auth
      # needs the keypair (JWT_PRIVATE_KEY base64 PEM + JWT_KEY_ID); every verifier
      # needs JWT_PUBLIC_KEY (base64 PEM). bootstrap-env.sh generates these into .env.
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      # PII encryption (F-19) — keys sourced from .env so all services
      # using @secuura/shared encryptField/decryptField/lookupHash can
      # bootstrap the keyring at startup. Required by auth (email lookup
      # hash for getUserByEmail), kyc, originate, midnight; harmless
      # everywhere else. (BACKLOG #1.)
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-}
      - PII_ENCRYPTION_KEY_VERSION=${PII_ENCRYPTION_KEY_VERSION:-1}
      - PII_LOOKUP_HMAC_KEY=${PII_LOOKUP_HMAC_KEY:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${GATEWAY_PORT:-6882}}
      # KS-480: connector token exchange validates sk_ keys against security
      - SECURITY_SERVICE_URL=http://security:4008
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
      - DEMO_MODE=${DEMO_MODE:-true}
      - ENABLE_TEST_TOKENS=${ENABLE_TEST_TOKENS:-false}
      # Pen-test F-05 gate for the 11 documented per-tenant demo accounts
      # (Oxford / BUPA / Apex / Greenfield / Delta; SEEDED_USERS_AND_ROLES.md §11).
      # Defaults to DENY, like originate's line above: KS-949 F5 (8a519e63a)
      # changed this value from `:-true` to `:-` and left the old "defaults to
      # true" comment behind, which KS-955 found still telling readers the
      # seed was on in local dev. To seed them, set
      # ALLOW_DEFAULT_SEED_PASSWORDS=true in Blockchain/Dev/.env (not
      # .env.local: this `environment:` entry overrides `env_file`) BEFORE the
      # stack is built — auth seeds once at boot.
      - ALLOW_DEFAULT_SEED_PASSWORDS=${ALLOW_DEFAULT_SEED_PASSWORDS:-}
      # KS-971: forward the platform SYSTEM_ADMIN's seed password.
      # (Carried on KS-682 too, byte-identical, so whichever PR lands first fixes fresh local
      # stacks — measured 2026-09-10 on slot 1: without it the seeder logs "no password
      # supplied" for admin@secuura.com, the bootstrap admin cannot grant roles, and the
      # Playwright suite's fallback account 401s. The other lands as a no-op.)
      #
      # KS-964 removed the published fallback for admin@secuura.com — the seeder's
      # `requiredSeedPw('ADMIN_USER_PASSWORD')` returns null when this is unset, and the account is
      # then written with an unusable password hash and `status = 'suspended'`. That is correct, and
      # it is why `admin@secuura.com / admin123` now returns 401 (KS-972).
      #
      # But this variable was forwarded to the auth service NOWHERE, so setting it in
      # `Blockchain/Dev/.env` — the obvious place, and where `.env.example:133` templates it — could
      # never reach the container: compose reads `.env` only to substitute `${...}` into variables
      # listed here, and this one was not listed. The only route in was `.env.local`, the service's
      # `env_file`. So the documented knob silently did nothing wherever it was most likely to be
      # set, and the account stayed unusable however carefully it was configured.
      #
      # The `:-` default means an unset host variable arrives in the container as an EMPTY STRING,
      # not as absent. That is safe here, and only because the seeder reads it as
      # `process.env.ADMIN_USER_PASSWORD || null`: '' is falsy, so it takes the null branch, skips
      # the account and leaves it suspended. Fail-closed either way — but if that read is ever
      # changed to `?? null`, an empty string would become a seeded blank password on the
      # cross-tenant SYSTEM_ADMIN. Verified with `docker compose config`: unset -> "", set -> value.
      #
      # NOTE: the sibling DEMO_*_PASSWORD / *_EMAIL overrides the seeder also reads are still not
      # forwarded. They are unaffected by this defect because they carry published fallbacks and are
      # gated on ALLOW_DEFAULT_SEED_PASSWORDS, so they work without an override — but a value set in
      # `.env` expecting it to apply will not. Forwarding those is a separate change.
      - ADMIN_USER_PASSWORD=${ADMIN_USER_PASSWORD:-}
      # Email / SMTP — KS-488 C-5. This block previously defaulted SMTP_ENABLED
      # to TRUE with a real provider as the host, so every deployment of this
      # file ran the auth service with the transport ON, pointed at a third
      # party, without anyone setting anything. Defaults off and empty now; see
      # the note on the originate service above.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      # KS-488 C-5 — see the note on the originate service above.
      - EMAIL_RECIPIENT_ALLOWLIST=${EMAIL_RECIPIENT_ALLOWLIST:-}
      # Social OAuth, Entra ID, Auth0 credentials loaded via env_file (.env.local)
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
