      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secuura_redis_dev}@redis:6379
      - CARDANO_NODE_URL=http://cardano-devnet:8090
      - CARDANO_NETWORK=${CARDANO_NETWORK:-devnet}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # KS-289: originate resolves recipient emails (certify → /api/users/stub,
      # transfer-custody → /api/users/lookup) and signs (→ /api/issuer-certs/sign)
      # by calling auth-service DIRECTLY, not through the public gateway — the
      # gateway CSRF-blocks service POSTs and the old localhost:6882 fallback was
      # unreachable inside this container (→ 502 "Recipient lookup unavailable").
      - AUTH_SERVICE_URL=http://auth:4003
      # PII encryption (F-19) — keys sourced from .env so all services
      # using @secuura/shared encryptField/decryptField/lookupHash can
      # bootstrap the keyring at startup. Required by auth (email lookup
      # hash for getUserByEmail), kyc, originate, midnight; harmless
      # everywhere else. (BACKLOG #1.)
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-}
      - PII_ENCRYPTION_KEY_VERSION=${PII_ENCRYPTION_KEY_VERSION:-1}
      - PII_LOOKUP_HMAC_KEY=${PII_LOOKUP_HMAC_KEY:-}
      # KS-1041 Step 2: the gateway's proof that a request came through the
      # edge. Without a match this service drops identity/tenant/role headers
      # instead of honouring them — see the gateway-provenance middleware in
      # src/index.ts for why stripping and not refusing. Declared on this
      # service and api-gateway ONLY; deliberately not in `.env.local`, whose
      # measured reach is four services. Empty default FAILS CLOSED: this
      # service drops the gateway-set identity headers AND logs a warning
      # naming the consequence at boot, so the loss is loud, not silent.
      - GATEWAY_VOUCH_SECRET=${GATEWAY_VOUCH_SECRET:-}
      # KS-1717: the HMAC key this service signs its own hops to anchoring with,
      # so anchoring honours `x-emitter-internal` (skip the flat-anchor
      # provenance row) only on a request originate made. Declared on this
      # service and anchoring ONLY; not in `.env.local`. Empty default FAILS
      # CLOSED: the marker goes unsigned, anchoring never honours it, and K's
      # own hops each write a second action_provenance row until the secret is
      # set on BOTH services.
      - EMITTER_SIGNING_SECRET=${EMITTER_SIGNING_SECRET:-}
      # KS-487 B-3 (#686 review): the demo-seed route's two gate flags, passed
      # through so the documented `.env` opt-in actually reaches this container.
      # originate declares no `env_file`, and compose passes through nothing a
      # service does not declare, so before this a value in `.env` never
      # arrived and opting in really meant editing THIS file. Both default to
      # EMPTY, so the gate stays default-deny and behaviour is unchanged unless
      # a developer opts in deliberately.
      - ENABLE_DEMO_SEED=${ENABLE_DEMO_SEED:-}
      # F7: this file used to disagree with itself — `:-}` here and `:-true`
      # for auth below. One file must not hold two positions on a security
      # flag, and KS-949 F5 resolves the disagreement toward DENY rather than
      # toward the permissive value it was first resolved to. A flag that
      # decides whether default seed passwords are allowed defaults to NOT
      # allowing them; an operator who wants them says so explicitly.
      - ALLOW_DEFAULT_SEED_PASSWORDS=${ALLOW_DEFAULT_SEED_PASSWORDS:-}
      # SMTP email notifications — KS-488 C-5: no default points at a real mail
      # provider. SMTP_ENABLED is the only switch and defaults off; an enabled
      # transport with no SMTP_HOST/SMTP_FROM refuses to send rather than
      # falling back to somebody else's server.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      # KS-488 C-5: optional recipient allow-list (comma/space separated domains
      # or full addresses). UNSET = send to any recipient, i.e. the behaviour
      # before the guard existed. Set it to bound who can receive Secuura mail.
      - EMAIL_RECIPIENT_ALLOWLIST=${EMAIL_RECIPIENT_ALLOWLIST:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
