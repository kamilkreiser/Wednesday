# =============================================================================
# SECUURA DEVELOPMENT ENVIRONMENT
# =============================================================================
# This docker-compose file sets up the complete Secuura development environment
# including all microservices, databases, and local Cardano devnet.
#
# IMPORTANT: Default passwords are for LOCAL DEVELOPMENT ONLY.
# For production/staging, set ALL passwords via a .env file or secrets manager:
#   POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d postgres redis  # Start only infrastructure
#   docker-compose logs -f originate  # Follow logs for a service
#   docker-compose down               # Stop all services
#
# =============================================================================

# =============================================================================
# STACK OWNERSHIP LABELS (KS-666)
# =============================================================================
# Merged into EVERY service below, so a running stack carries its owner, branch,
# commit and start time on every container rather than on one marker alone.
#
# A YAML anchor cannot cross an `include:` boundary, so this block is declared in
# each compose file that defines services — duplicated deliberately, not by
# oversight.
#
# The `:-` defaults must NOT become `:?required`: required-variable syntax makes
# every plain `docker compose config`/`ps` fail for anyone who has not exported
# these, including both CI workflows.
# KS-667 / s86-s87 trap: an image cannot say which commit it was built from. Tonight a
# gateway image had to be identified by build TIME plus a content probe because it
# carried no revision label, and the deploy-row base SHA in the KS-742 record had to be
# inferred from an rsync manifest. `org.opencontainers.image.revision` makes that a fact
# instead of an inference, permanently, for every future rollback image.
#
# Reuses STACK_COMMIT rather than introducing a second variable, so the image label and
# the container label below can never disagree about which commit is running.
x-image-labels: &image_labels
  org.opencontainers.image.revision: "${STACK_COMMIT:-unknown}"
  org.opencontainers.image.source: "https://github.com/Secuura/Distributed_Secuura"

x-stack-labels: &stack_labels
  com.secuura.stack.owner: "${STACK_OWNER:-unknown}"
  com.secuura.stack.branch: "${STACK_BRANCH:-unknown}"
  com.secuura.stack.commit: "${STACK_COMMIT:-unknown}"
  # ISO 8601 UTC — KS-201 requires every timestamp be region-independent.
  com.secuura.stack.started_at: "${STACK_STARTED_AT:-unknown}"

services:
  # ===========================================================================
  # STACK OWNERSHIP MARKER (KS-666)
  # ===========================================================================
  # WHY: the VM hosts one shared, mutable stack. Before KS-666 nothing recorded
  # who was using it, so the routine `down -v` + `git checkout develop` recovery
  # path destroyed other people's checkouts, volumes and uncommitted work
  # silently and reported success. This container is the ownership record that
  # `scripts/stack_guard.sh` reads before any destructive operation.
  #
  # WHY A CONTAINER RATHER THAN A STATE FILE: a label dies with the stack, so it
  # cannot outlive a crash or a manual teardown and go stale. A lease file can,
  # and a stale lease is worse than none — it trains people to ignore it.
  #
  # WHY A MARKER *AS WELL AS* LABELS ON EVERY SERVICE: every service carries the
  # `x-stack-labels` anchor (see the top of this file), so ownership is readable
  # from any container. The marker adds one container that exists for no other
  # reason, so ownership survives the moments when the rest of the stack does not
  # — mid-build, mid-teardown, or when services are stopped individually. Reading
  # ownership off a service that happens to be down would otherwise report "no
  # stack running" while the stack is plainly up, which is the false all-clear
  # this whole mechanism exists to avoid.
  #
  # The anchor is declared in BOTH compose files because a YAML anchor cannot
  # cross an `include:` boundary — duplicated deliberately, not by oversight.
  stack-marker:
    image: busybox:1.37
    container_name: ${STACK_PREFIX:-secuura}-stack-marker
    restart: unless-stopped
    user: "65534:65534"
    # BusyBox's `sleep` takes integer seconds only — `sleep infinity` is a GNU
    # coreutils extension and exits non-zero here, which under `restart:
    # unless-stopped` would crash-loop the marker and intermittently blind the
    # guard. Loop instead.
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      <<: *stack_labels
      com.secuura.stack.owner: "${STACK_OWNER:-unknown}"
      com.secuura.stack.branch: "${STACK_BRANCH:-unknown}"
      com.secuura.stack.commit: "${STACK_COMMIT:-unknown}"
      # ISO 8601 UTC — KS-201 requires every timestamp be region-independent.
      com.secuura.stack.started_at: "${STACK_STARTED_AT:-unknown}"
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "true"]
      interval: 60s
      timeout: 3s
      retries: 2
    networks:
      - secuura-network

  # ===========================================================================
  # INFRASTRUCTURE SERVICES
  # ===========================================================================

  postgres:
    labels:
      <<: *stack_labels
    image: postgres:15-alpine
    container_name: ${STACK_PREFIX:-secuura}-postgres
    restart: unless-stopped
    # LOCAL-DEV: raise the server connection ceiling well above default (100) so
    # heavy local load/soak tests (e.g. cert-issuance concurrency, KS-207) never
    # hit `53300 too_many_connections`. Local-only — dev/demo run on Azure, where
    # KS-207 fronts a bounded Postgres with pgbouncer instead. Backstops the
    # pgbouncer `max_db_connections = 0` (unlimited) in docker/pgbouncer.ini.
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      TZ: UTC
      # KS-165: every `${VAR:-default}` in this file is a LOCAL-DEV-ONLY
      # fallback. This compose file is never used to deploy dev/demo — those run
      # on Azure Container Apps with secrets injected from Key Vault (see
      # deployment/azure/deploy.sh). So these defaults cannot reach a deployed
      # environment, and the literals are throwaway local values, NOT real
      # secrets (verified: the APP_DB_PASSWORD default below does not match the
      # live dev secret). Production is additionally guarded by
      # enforceProductionConfig (@secuura/shared), which FATALs on dev-default
      # JWT/DB values. The defaults are intentionally kept so `docker compose up`
      # works out-of-the-box — do NOT switch to `:?required` (it would break the
      # team's existing local stacks, and a fresh volume bakes the DB password
      # at first init).
      POSTGRES_USER: ${POSTGRES_USER:-secuura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secuura_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-secuura}
      # Security settings
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # KS-72: forward APP_DB_* into the postgres container so the
      # docker-entrypoint-initdb.d/01-create-app-role.sh script can provision
      # the secuura_app role with the same password every service's
      # DATABASE_URL is built from. Without this, a fresh volume hits the
      # KS-8 guardrail ("FATAL: APP_DB_PASSWORD is not set"), the role is
      # never created, subsequent init scripts are skipped, and every service
      # auth-fails through pgbouncer.
      APP_DB_USER: ${APP_DB_USER:-secuura_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}
    # KS-614: bound to LOOPBACK, not 0.0.0.0. The old form published to every
    # interface, and on the demo VM `ss -lntp` showed docker-proxy on
    # 0.0.0.0:6432 with ufw inactive and an empty DOCKER-USER chain — i.e. no
    # host firewall at all, leaving one Azure NSG rule as the sole control.
    # Docker's published ports bypass ufw, so "we'll add a host firewall later"
    # does not fix this; binding is what fixes it. Every in-repo consumer uses
    # localhost, so loopback preserves local dev unchanged.
    # (The previous "remove in production" comment was never a control.)
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-6432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
      - ./docker/init-platform:/docker-entrypoint-initdb.d/platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secuura}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - secuura-network

  # ===========================================================================
  # DATABASE MIGRATIONS (runs once before other services start)
  # ===========================================================================

  migrations:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: services/originate/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-migrations
    command: ["sh", "scripts/run-migrations.sh"]
    restart: "no"
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-secuura}:${POSTGRES_PASSWORD:-secuura_dev_password}@postgres:5432/${POSTGRES_DB:-secuura}
      - PLATFORM_DATABASE_URL=postgresql://${POSTGRES_USER:-secuura}:${POSTGRES_PASSWORD:-secuura_dev_password}@postgres:5432/secuura_platform
      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - secuura-network

  redis:
    labels:
      <<: *stack_labels
    # KS-368: 7-alpine was security-only upstream; 8-alpine is the active line (AGPL option OK'd by Kam 2026-07-03)
    image: redis:8-alpine
    container_name: ${STACK_PREFIX:-secuura}-redis
    restart: unless-stopped
    # KS-614: bound to LOOPBACK, not 0.0.0.0 — see the postgres stanza above.
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # Enable password authentication and persistence
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:-secuura_redis_dev}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secuura_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - secuura-network

  # ===========================================================================
  # PGBOUNCER - Connection Pooling
  # ===========================================================================
  # Improves database performance by pooling connections.
  # Enabled by default for all environments (transaction pooling mode).
  # All services connect via pgbouncer:6432 instead of postgres:5432.
  
  pgbouncer:
    labels:
      <<: *stack_labels
    build:
      context: ./docker/pgbouncer
      dockerfile: Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-pgbouncer
    restart: unless-stopped
    # KS-614: bound to LOOPBACK, not 0.0.0.0 — see the postgres stanza above.
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6433}:6432"
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-secuura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secuura_dev_password}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:-secuura_dev_password}}
      PGBOUNCER_STATS_PASSWORD: ${PGBOUNCER_STATS_PASSWORD:-${POSTGRES_PASSWORD:-secuura_dev_password}}
      # T2-E Phase 2: PgBouncer needs to know about the secuura_app role so
      # it can authenticate service connections that come through with the
      # non-superuser role (which is the role the RLS policies actually
      # apply to). Without this, services would auth-fail through the pooler.
      APP_DB_USER: ${APP_DB_USER:-secuura_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}
      # KS-207: pgbouncer config is env-driven (entrypoint.sh renders pgbouncer.ini).
      # LOCAL keeps the unlimited ceilings explicitly here; Azure passes bounded
      # values sized to the server's max_connections via bicep. Same image both ways.
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-secuura}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-10000}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-1000}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-100}
      PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-0}
      PGBOUNCER_MAX_USER_CONNECTIONS: ${PGBOUNCER_MAX_USER_CONNECTIONS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - secuura-network

  # ===========================================================================
  # CARDANO LOCAL DEVNET (Yaci DevKit)
  # ===========================================================================

  # ===========================================================================
  # CARDANO LOCAL DEVNET
  # ===========================================================================
  # Option 1: the `cardano-devnet` service below (yaci-cli, auto-starts):
  #   docker compose --profile devnet up -d
  # Option 2: Use Cardano Preview Testnet (requires sync time)
  #   Connect to: https://preview.koios.rest
  # ===========================================================================
  
  # Mock Cardano API for development (returns mock responses)
  # Use this for quick local development without full devnet
  cardano-mock:
    labels:
      <<: *stack_labels
    image: nginx:alpine
    container_name: ${STACK_PREFIX:-secuura}-cardano-mock
    restart: unless-stopped
    ports:
      # KS-666: parameterised so a non-primary stack slot can offset its published
      # ports and run alongside the primary one. Default is the original value, so
      # slot 1 (the primary tree) binds exactly the ports it always did.
      - "${CARDANO_MOCK_PORT:-6090}:80"
    volumes:
      - ./docker/cardano-mock:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    profiles:
      - mock
    networks:
      - secuura-network

  # ==========================================================================
  # REAL CARDANO DEVNET (Yaci DevKit)
  # ==========================================================================
  # Enable with: docker-compose --profile devnet up -d
  # This provides a full local Cardano network for realistic testing
  # ==========================================================================
  cardano-devnet:
    labels:
      <<: *stack_labels
    # KS-372: the old `bloxbean/yaci-devkit:0.10.0` tag never existed on Docker Hub
    # (the profile was unpullable). Devkit 0.10.x ships the devnet as bloxbean/yaci-cli;
    # `create-node -o --start` boots it non-interactively (Spring Shell one-shot), and
    # the trailing `tail -f /dev/null` keeps PID 1 alive while the node processes run.
    # Port layout changed upstream: store API (/api/v1/...) is 8080, tx submit is 8090.
    image: bloxbean/yaci-cli:0.10.6
    container_name: ${STACK_PREFIX:-secuura}-cardano-devnet
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "java -jar /app/yaci-cli.jar create-node -o --start && tail -f /dev/null"]
    ports:
      # KS-666: parameterised for per-slot port offsetting (see cardano-mock above).
      # Defaults preserve the original ports for the primary slot.
      - "${CARDANO_N2N_PORT:-6091}:3001"        # Cardano node N2N
      - "${YACI_STORE_PORT:-6092}:8080"         # Yaci Store API (/api/v1/... — epochs, utxos)
      - "${CARDANO_ADMIN_PORT:-6093}:10000"     # Cluster admin API
      - "${CARDANO_SUBMIT_PORT:-6094}:8090"     # Tx submit API (in-network consumers use cardano-devnet:8090)
    environment:
      - TZ=UTC
      - node=node1
      - yaci_cli_mode=native
      - yaci_store_mode=native
      - yaci_store_enabled=true
      - ogmios_enabled=false
      - kupo_enabled=false
    volumes:
      - cardano_data:/clusters
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/epochs/latest"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          # KS-372: raised from 0.5 CPU / 512M — cardano-node + yaci-store need
          # real headroom; the old limits predate anyone actually running this.
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles:
      - devnet
    networks:
      - secuura-network

  # ===========================================================================
  # CORE SERVICES (Phase 1 - Active)
  # ===========================================================================

  api-gateway:
    labels:
      <<: *stack_labels
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      labels:
        <<: *image_labels
    container_name: ${STACK_PREFIX:-secuura}-api-gateway
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    # No external ports — accessed via nginx-gateway at /api/
    environment:
      - TZ=UTC
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8080
      # Swagger UI gate — default FALSE (BACKLOG 2026-07-17 / #555 decision):
      # this same compose file runs the internet-facing demo VM, where the old
      # `:-true` default published the full Swagger UI + raw spec and defeated
      # the F-04 opt-in guard. Local dev opts in via ENABLE_PUBLIC_API_DOCS=true
      # in Blockchain/Dev/.env (see env.example).
      - ENABLE_PUBLIC_API_DOCS=${ENABLE_PUBLIC_API_DOCS:-false}
      # KS-546 (Kam, 2026-07-31): the gateway SURVIVES unhandled promise
      # rejections (log + continue) instead of Node's fail-fast exit — KS-529
      # proved one unguarded async path here is a platform-wide outage. The
      # gateway is the ONLY service with this; everything else keeps 'exit',
      # and uncaughtException still exits everywhere.
      - UNHANDLED_REJECTION_MODE=survive
      # KS-1041 Step 2: proves to originate that a request came through this
      # gateway before originate honours any identity/tenant/role header.
      # Declared HERE and on `originate` only — deliberately NOT in
      # `.env.local`, which api-gateway, auth, m365-integration and kyc all
      # load, and which would therefore hand the secret to two services with
      # no business holding it (measured: a .env.local value reads identically
      # in all four containers). Compose passes through nothing a service does
      # not declare, so this keeps the blast radius at 2 containers of 34.
      # Empty default => header not sent => originate treats calls as
      # unvouched and drops trust headers. Unconfigured loses privilege.
      - GATEWAY_VOUCH_SECRET=${GATEWAY_VOUCH_SECRET:-}
      # Core Services
      - ORIGINATE_SERVICE_URL=http://originate:4000
      - PRISM_SERVICE_URL=http://prism:4001
      - WALLET_SERVICE_URL=http://wallet-connector:4002
      - AUTH_SERVICE_URL=http://auth:4003
      - TIMESTAMPING_SERVICE_URL=http://timestamping:4004
      - ANCHORING_SERVICE_URL=http://anchoring:4005
      - SECURITY_SERVICE_URL=http://security:4008
      - M365_SERVICE_URL=http://m365-integration:4013
      # Integration Services
      - ANALYTICS_SERVICE_URL=http://analytics:4010
      - KYC_SERVICE_URL=http://kyc:4011
      - VC_ISSUER_SERVICE_URL=http://vc-issuer:4014
      - STAKING_SERVICE_URL=http://staking:4015
      - REFERRAL_SERVICE_URL=http://referral:4016
      - GOVERNANCE_SERVICE_URL=http://governance:4017
      - NFT_SERVICE_URL=http://nft-certificate:4018
      - BILLING_SERVICE_URL=http://billing:4019
      - TRANSFER_SERVICE_URL=http://transfer:4020
      # Infrastructure - secured Redis connection
      - DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@pgbouncer:6432/${POSTGRES_DB:-secuura}
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
      # KS-215: CORE_MIGRATIONS need DDL (CREATE TABLE/ROLE), but the runtime
      # DATABASE_URL above is the least-priv secuura_app role (KS-92/KS-109), so
      # startup-migrations fails "permission denied for schema public" and the
      # CORE tables it owns (charge_events, platform_document_registry, ...) are
      # never created on local — which 500s cert-issue. Give the gateway a
      # superuser migration connection (the POSTGRES_USER owner, direct to
      # postgres, NOT pgbouncer) so migrations run as owner. startup-migrations
      # uses MIGRATION_DATABASE_URL || DATABASE_URL. Mirrors the Azure
      # secuuraadmin MIGRATION_DATABASE_URL wired in KS-109.
      - MIGRATION_DATABASE_URL=postgresql://${POSTGRES_USER:-secuura}:${POSTGRES_PASSWORD:-secuura_dev_password}@postgres:5432/${POSTGRES_DB:-secuura}
      - MIGRATION_PLATFORM_DATABASE_URL=postgresql://${POSTGRES_USER:-secuura}:${POSTGRES_PASSWORD:-secuura_dev_password}@postgres:5432/secuura_platform
      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secuura_redis_dev}@redis:6379
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # PII encryption (F-19) — keys sourced from .env so all services
      # using @secuura/shared encryptField/decryptField/lookupHash can
      # bootstrap the keyring at startup. Required by auth (email lookup
      # hash for getUserByEmail), kyc, originate, midnight; harmless
      # everywhere else. (BACKLOG #1.)
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-}
      - PII_ENCRYPTION_KEY_VERSION=${PII_ENCRYPTION_KEY_VERSION:-1}
      - PII_LOOKUP_HMAC_KEY=${PII_LOOKUP_HMAC_KEY:-}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-2000}  # KS-206. KS-1374: env.example (local + CI) is 10000, .env.example (production-compose) is 2000; this fallback is what a stack with a silent .env inherits, including the demo VM.
      # KS-191: dev/CI-only override to disable the per-IP login throttle so the
      # schemathesis sweep's repeated single-IP logins don't read as 429 auth
      # storms. Code-guarded to a non-prod NODE_ENV; defaults off so local dev keeps it.
      - LOCAL_LOGIN_LIMITER_DISABLED=${LOCAL_LOGIN_LIMITER_DISABLED:-false}
      # CORS — comma-separated list of allowed origins (production: set to your domains)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:6100,http://localhost:6101,http://localhost:6102,http://localhost:6103,http://localhost:${GATEWAY_PORT:-6882},http://localhost:${WEBSITE_PORT:-6881}}
      # CSRF Protection
      - CSRF_SECRET=${CSRF_SECRET:-}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-false}
      # Multi-tenancy
      - PLATFORM_DATABASE_URL=postgresql://${APP_DB_USER:-secuura_app}:${APP_DB_PASSWORD:-YuBzECVdrAU9nUHhQDWMg2yMMSlgrxJP}@postgres:5432/secuura_platform
      - MULTI_TENANCY_ENABLED=${MULTI_TENANCY_ENABLED:-false}
      - TOKENISATION_URL=http://tokenisation:4021
      - TENANT_PROVISIONING_URL=http://tenant-provisioning:4022
      - MCP_SERVER_URL=http://mcp-server:4023
      # KS-466: the default tenant is keyed by UUID everywhere that matters
      # (users.tenant_id, migration-039 backfill, userRepo/originate defaults,
      # and the gateway's own index.ts default). The former ':-default' slug
      # meant a tenantless admin's x-tenant-id was 'default', which fail-closed
      # RLS could never match (UUID rows) — INSERTs 500'd, tenant-scoped reads
      # returned nothing. Default to the canonical default-tenant UUID.
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-a0000000-0000-4000-8000-000000000001}
